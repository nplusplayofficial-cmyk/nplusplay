<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N+ PLAY — Chicken Road Demo</title>
<style>
:root{
  --top:#3b3b3b;
  --road:#77736f;
  --panel:#393939;
  --panel2:#414141;
  --line:#5a5a5a;
  --text:#f6f6f6;
  --muted:#b9b9b9;
  --green:#3cca62;
  --yellow:#ffd33f;
  --blue:#35588f;
  --danger:#f15a68;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
body{min-height:100vh;overflow-x:hidden}

/* Header */
.top{
  height:58px;background:var(--top);border-bottom:1px solid #515151;
  display:flex;align-items:center;padding:0 14px;gap:14px;position:sticky;top:0;z-index:100
}
.logoImg{width:220px;height:42px;object-fit:contain;object-position:left center}
.topCenter{flex:1;display:flex;justify-content:center}
.betId{
  width:min(430px,48vw);height:40px;border:0;border-radius:22px;background:#4b4b4b;color:#e5e5e5;
  padding:0 18px;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px #595959
}
.topRight{display:flex;align-items:center;gap:8px}
.balance{
  min-width:145px;height:38px;border-radius:7px;background:#4b4b4b;border:1px solid #5a5a5a;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:900
}
.balance .coin{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#f0f0f0;color:#666;font-size:11px}
.menuBtn,.helpBtn{height:38px;border:0;border-radius:8px;background:#4b4b4b;color:#fff;padding:0 12px;font-weight:900}
.menuBtn{font-size:21px;padding:0 11px}

/* Game world */
.stage{
  position:relative;height:calc(100vh - 58px);min-height:690px;overflow:hidden;background:#77736f
}
.roadLayer{position:absolute;inset:0 0 214px 0;overflow:hidden;background:var(--road)}
.roadSurface{
  position:absolute;left:0;right:0;top:0;bottom:0;
  background:var(--road) url('./road_tile.png') repeat;
  background-size:102px 102px
}
.leftWorld{
  position:absolute;left:0;top:0;bottom:0;width:15.2%;z-index:2;
  background:url('./start_bg.jpg') center top / auto 100% no-repeat;
}

/* lane separators */
.lane{position:absolute;top:-5%;bottom:-5%;width:5px;z-index:3;background:repeating-linear-gradient(to bottom,#efede7 0 34px,transparent 34px 86px);opacity:.98}
.l1{left:22%}.l2{left:36%}.l3{left:50%}.l4{left:64%}.l5{left:78%}.l6{left:92%}

.world{position:absolute;inset:0;z-index:10;will-change:transform}

/* visual elements taken from the provided asset pack */
.car{position:absolute;width:88px;height:auto;z-index:6;filter:drop-shadow(0 4px 2px rgba(0,0,0,.28))}
.barrier{position:absolute;width:112px;height:auto;z-index:7;filter:drop-shadow(0 4px 2px rgba(0,0,0,.2))}
.coinImg{position:absolute;width:92px;height:92px;z-index:5;object-fit:contain;filter:drop-shadow(0 5px 3px rgba(0,0,0,.2))}

.checkpoint{
  position:absolute;width:112px;height:112px;border-radius:50%;z-index:5;
  background:repeating-linear-gradient(90deg,#44433f 0 9px,#66635e 9px 18px);
  border:6px solid #575752;box-shadow:inset 0 0 0 8px rgba(0,0,0,.18),0 5px 8px rgba(0,0,0,.18);
  display:grid;place-items:center;color:#f0eee9;font-weight:1000;text-shadow:0 2px 0 #45423e
}
.checkpoint span{font-size:18px}

/* exact-ish chicken extracted from the supplied reference */
.chicken{position:absolute;left:11.5%;bottom:220px;width:145px;z-index:30;will-change:transform}
.chicken img{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 4px rgba(0,0,0,.25))}

.currentBubble{
  position:absolute;left:11%;bottom:225px;z-index:35;
  min-width:112px;padding:11px 20px;text-align:center;border-radius:7px;
  background:linear-gradient(#4a69a0,#31517f);border:3px solid #2c4267;box-shadow:0 5px 0 #22324f,0 8px 14px rgba(0,0,0,.18);
  color:#fff;font-size:22px;font-weight:1000
}
.currentBubble:before{content:"";position:absolute;top:-15px;left:50%;transform:translateX(-50%);border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:15px solid #2c4267}

/* controls */
.controls{
  position:absolute;left:0;right:0;bottom:0;height:214px;z-index:60;background:#353535;border-top:1px solid #5b5b5b;padding:12px 22px
}
.panel{
  height:100%;border:2px solid #606060;border-radius:18px;background:linear-gradient(#414141,#373737);
  display:grid;grid-template-columns:315px 1fr 210px 210px;gap:16px;align-items:center;padding:14px 14px
}
.amountArea{display:flex;flex-direction:column;gap:8px}
.amountMain{height:46px;display:grid;grid-template-columns:48px 1fr 48px;background:#4b4b4b;border:1px solid #5e5e5e;border-radius:7px;overflow:hidden}
.amountMain button{border:0;background:transparent;color:#888;font-size:27px}
.amountMain input{width:100%;border:0;background:transparent;color:#f2f2f2;text-align:center;font-size:18px;font-weight:900;outline:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.quick button{height:34px;border:1px solid #575757;background:#484848;color:#e4e4e4;border-radius:7px;font-size:11px;font-weight:900}
.centerArea{display:flex;flex-direction:column;gap:10px;min-width:0}
.labelRow{display:flex;align-items:center;justify-content:space-between;color:#ededed;font-size:16px}
.chance{color:#c1c1c1;font-size:14px;text-align:right;white-space:nowrap}
.difficulty{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#4b4b4b;border-radius:7px;padding:2px}
.difficulty button{height:43px;border:0;border-radius:7px;background:transparent;color:#bdbdbd;font-weight:900;font-size:13px}
.difficulty button.active{background:#5a5a5a;color:#efefef;box-shadow:inset 0 0 0 1px #646464}
.action{height:126px;border:0;border-radius:16px;font-size:24px;font-weight:1000;line-height:1.08;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 6px 0 rgba(0,0,0,.14)}
.cash{background:var(--yellow);color:#1f2620}.go{background:var(--green);color:#06150a}.action:disabled{opacity:.45;cursor:not-allowed}
.action small{display:block;font-size:12px;margin-top:3px;opacity:.82}

/* result */
.result{position:absolute;inset:0;z-index:90;display:none;place-items:center;background:rgba(0,0,0,.42);backdrop-filter:blur(2px)}
.result.show{display:grid}
.resultCard{width:min(88%,360px);padding:24px;background:#202020;border:1px solid #5e5e5e;border-radius:18px;text-align:center;box-shadow:0 25px 70px #0008}
.resultCard h2{font-size:11px;letter-spacing:2px;color:#aaa;margin:0}.resultX{font-size:46px;font-weight:1000;color:#f0ca6d;margin:8px 0}.resultText{font-size:11px;color:#b7b7b7}

/* menu */
.menuPanel{position:absolute;right:14px;top:54px;z-index:120;width:265px;background:#242424;border:1px solid #4c4c4c;border-radius:10px;box-shadow:0 20px 60px #0008;display:none;overflow:hidden}
.menuPanel.show{display:block}
.menuItem{width:100%;height:44px;padding:0 14px;border:0;border-bottom:1px solid #373737;background:transparent;color:#eee;text-align:left;font-size:12px;font-weight:800}
.menuItem:hover{background:#303030}

@media(max-width:900px){
  .panel{grid-template-columns:250px 1fr 170px 170px;gap:10px}
  .action{font-size:20px}
  .chicken{left:9%;width:122px}
  .currentBubble{left:8%;bottom:270px}
}
@media(max-width:720px){
  .top{padding:0 8px;gap:8px}.logoImg{width:155px}.topCenter{display:none}.balance{min-width:110px;font-size:10px}.helpBtn{display:none}
  .stage{min-height:720px}.roadLayer{bottom:258px}
  .controls{height:258px;padding:10px}
  .panel{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;padding:9px;gap:8px}
  .centerArea{grid-column:1/-1;grid-row:2}.action{height:74px;font-size:18px}
  .chicken{left:7%;bottom:270px;width:108px}.currentBubble{left:6%;bottom:220px;font-size:18px;min-width:86px;padding:8px 14px}
}
@media(max-width:450px){
  .logoImg{width:125px}.balance{min-width:92px}
  .roadLayer{bottom:275px}.controls{height:275px}
  .action{height:60px;font-size:16px}.quick button{height:30px}.amountMain{height:42px}.difficulty button{height:37px;font-size:11px}
  .chicken{width:92px}
}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <img class="logoImg" src="./chicken_logo.png" alt="Chicken Road">
  <div class="topCenter"><div class="betId">Bet ID: <b id="betId">—</b></div></div>
  <div class="topRight">
    <div class="balance"><span id="balance">1,000.00</span><span class="coin">$</span></div>
    <button class="helpBtn" onclick="showHow()">ⓘ&nbsp; How to play?</button>
    <button class="menuBtn" onclick="toggleMenu()">☰</button>
  </div>
</header>

<div class="menuPanel" id="menuPanel">
  <button class="menuItem" onclick="showHow()">ⓘ How To Play</button>
  <button class="menuItem" onclick="showHistory()">◷ Game History</button>
  <button class="menuItem" onclick="showMyHistory()">▣ My Demo History</button>
  <button class="menuItem" onclick="resetDemo()">↻ Reset Demo Data</button>
</div>

<section class="stage" id="stage">
  <div class="roadLayer" id="roadLayer">
    <div class="roadSurface"></div>
    <div class="leftWorld"></div>
    <div class="lane l1"></div><div class="lane l2"></div><div class="lane l3"></div><div class="lane l4"></div><div class="lane l5"></div><div class="lane l6"></div>
    <div class="world" id="world">
      <img class="barrier" src="./barrier.png" style="left:17%;top:22%">
      <img class="barrier" src="./barrier.png" style="left:29%;top:22%">
      <img class="car" src="./car_yellow.png" style="left:30%;top:-8%">
      <img class="coinImg" src="./coin.png" style="left:5%;top:46%">

      <div class="checkpoint" data-x="1.98" style="left:31%;top:46%"><span>1.98x</span></div>
      <div class="checkpoint" data-x="2.12" style="left:46%;top:46%"><span>2.12x</span></div>
      <div class="checkpoint" data-x="2.28" style="left:61%;top:46%"><span>2.28x</span></div>
      <div class="checkpoint" data-x="2.47" style="left:76%;top:46%"><span>2.47x</span></div>
      <div class="checkpoint" data-x="2.70" style="left:91%;top:46%"><span>2.70x</span></div>
    </div>
  </div>

  <div class="chicken" id="chicken"><img src="./chicken.png" alt="Chicken"></div>
  <div class="currentBubble" id="bubble">1.00x</div>

  <div class="result" id="result">
    <div class="resultCard">
      <h2 id="resultTitle">ROUND RESULT</h2>
      <div class="resultX" id="resultX">1.00x</div>
      <div class="resultText" id="resultText">Demo round finished.</div>
    </div>
  </div>

  <div class="controls">
    <div class="panel">
      <div class="amountArea">
        <div class="amountMain">
          <button onclick="changeStake(-1)">−</button>
          <input id="stake" type="number" min="1" step="1" value="2">
          <button onclick="changeStake(1)">+</button>
        </div>
        <div class="quick">
          <button onclick="setStake(1)">1 $</button>
          <button onclick="setStake(2)">2 $</button>
          <button onclick="setStake(5)">5 $</button>
          <button onclick="setStake(10)">10 $</button>
        </div>
      </div>

      <div class="centerArea">
        <div class="labelRow"><span>Difficulty</span><span class="chance" id="chance">Chance of being shot down · 18%</span></div>
        <div class="difficulty">
          <button class="active" data-mode="easy">Easy</button>
          <button data-mode="medium">Medium</button>
          <button data-mode="hard">Hard</button>
          <button data-mode="hardcore">Hardcore</button>
        </div>
      </div>

      <button class="action cash" id="cash" onclick="cashOut()" disabled>CASH OUT<small id="cashValue">2.00 DEMO</small></button>
      <button class="action go" id="go" onclick="go()">GO</button>
    </div>
  </div>
</section>
</main>

<script>
(()=>{
'use strict';
const STORE='nplus_chicken_road_asset_demo_v3';
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
let db;try{db=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){db=null}
if(!db)db={balance:1000,history:[],plays:[]};
let mode='easy',running=false,start=0,current=1,crash=2.2,stake=2,raf=0;
const profiles={easy:{chance:18,growth:.18,max:4.5},medium:{chance:28,growth:.22,max:6.5},hard:{chance:40,growth:.26,max:9},hardcore:{chance:55,growth:.31,max:14}};
function save(){db.history=db.history.slice(0,100);db.plays=db.plays.slice(0,100);localStorage.setItem(STORE,JSON.stringify(db));renderBalance()}
function renderBalance(){$('balance').textContent=money(db.balance)}
function setStake(v){$('stake').value=Math.max(1,Number(v)||1)}
function changeStake(v){setStake(Math.max(1,(Number($('stake').value)||2)+v))}
function makeCrash(){const s=profiles[mode],r=Math.random();if(r<.18)return 1.20+Math.random()*.65;if(r<.60)return 1.55+Math.random()*1.55;if(r<.88)return 2.3+Math.random()*Math.max(.8,s.max-2.3);return Math.min(s.max,4+Math.random()*Math.max(1,s.max-4))}
function resetScene(){
  $('bubble').textContent='1.00x';$('bubble').style.left='11%';$('chicken').style.left='11.5%';$('chicken').style.transform='none';
  $('world').style.transform='translateX(0)';document.querySelectorAll('.checkpoint').forEach((e,i)=>{e.style.opacity='1';});
}
function scene(x){
  const p=Math.min(.8,Math.log(x)/Math.log(12));
  const shift=p*42; // controlled horizontal road travel
  $('world').style.transform=`translateX(${-shift}%)`;
  $('bubble').textContent=x.toFixed(2)+'x';
  // Chicken keeps the same reference position while environment moves.
  const bounce=Math.sin(performance.now()/120)*1.5;
  $('chicken').style.transform=`translateY(${bounce}px)`;
  document.querySelectorAll('.checkpoint').forEach(el=>{const v=Number(el.dataset.x);el.style.opacity=x>=v?.82:1;});
}
function go(){
  if(running)return;stake=Math.max(1,Number($('stake').value)||1);if(stake>db.balance){alert('Insufficient demo balance.');return}
  db.balance-=stake;save();running=true;current=1;crash=makeCrash();start=performance.now();$('betId').textContent='DEMO-'+Date.now().toString().slice(-8);$('go').disabled=true;$('cash').disabled=false;$('cashValue').textContent=money(stake)+' DEMO';scene(1);raf=requestAnimationFrame(loop)
}
function loop(now){if(!running)return;const t=(now-start)/1000,s=profiles[mode];current=Number((1+s.growth*t+.022*t*t).toFixed(2));scene(current);$('cashValue').textContent=money(stake*current)+' DEMO';if(current>=crash){finishCrash();return}raf=requestAnimationFrame(loop)}
function cashOut(){if(!running)return;running=false;cancelAnimationFrame(raf);const payout=Number((stake*current).toFixed(2));db.balance+=payout;db.history.unshift(current);db.plays.unshift({stake,result:current,payout,status:'CASHED OUT',at:Date.now()});save();showResult('CASHED OUT',current,`Demo return ${money(payout)}`);resetControls()}
function finishCrash(){running=false;cancelAnimationFrame(raf);const v=Number(crash.toFixed(2));db.history.unshift(v);db.plays.unshift({stake,result:v,payout:0,status:'CRASHED',at:Date.now()});save();showResult('ROUND CRASHED',v,'Chicken was stopped before cash out.');resetControls()}
function resetControls(){$('go').disabled=false;$('cash').disabled=true;$('cashValue').textContent=money(stake)+' DEMO';setTimeout(()=>{ $('result').classList.remove('show'); resetScene(); },1800)}
function showResult(title,val,text){$('resultTitle').textContent=title;$('resultX').textContent=val.toFixed(2)+'x';$('resultText').textContent=text;$('result').classList.add('show')}
function showHow(){toggleMenu(false);alert('CHICKEN ROAD — N+ PLAY DEMO\n\nChoose a demo stake and difficulty. Press GO to start. Cash Out returns demo credits based on the current multiplier.\n\nNo real-money wagering or payment processing.')}
function toggleMenu(force){const el=$('menuPanel');if(typeof force==='boolean')el.classList.toggle('show',force);else el.classList.toggle('show')}
function showHistory(){toggleMenu(false);alert('Last 100 demo results: '+(db.history.slice(0,10).map(x=>x.toFixed(2)+'x').join(' · ')||'None'))}
function showMyHistory(){toggleMenu(false);alert(db.plays.slice(0,5).map(p=>`${p.status} · ${p.result.toFixed(2)}x · ${money(p.stake)}`).join('\n')||'No demo history yet.')}
function resetDemo(){toggleMenu(false);if(confirm('Reset Chicken Road demo data?')){db={balance:1000,history:[],plays:[]};save();resetScene()}}

document.querySelectorAll('.difficulty button').forEach(b=>b.onclick=()=>{if(running)return;mode=b.dataset.mode;document.querySelectorAll('.difficulty button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('chance').textContent=`Chance of being shot down · ${profiles[mode].chance}%`});
renderBalance();resetScene();
})();
</script>
</body>
</html>
