<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chicken Road 2 - Casino Game</title>
    <style>
        /* ==========================================
           1. RESET & MOBILE-FIRST DARK THEME
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --bg-dark: #121214;
            --bg-card: #1e1e22;
            --bg-input: #27272a;
            --border-color: #3f3f46;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --yellow-gold: #f59e0b;
            --yellow-glow: rgba(245, 158, 11, 0.4);
            --green-primary: #22c55e;
            --green-hover: #16a34a;
            --red-primary: #ef4444;
            --road-asphalt: #27272a;
            --sidewalk-tile: #d4d4d8;
        }

        body {
            background-color: #09090b;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        /* App Viewport Container */
        .app-viewport {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }

        /* ==========================================
           2. LOADING SCREEN OVERLAY (z-index highest)
           ========================================== */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 24px 30px 24px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-auto: 0;
            flex: 1;
        }

        /* Cartoon Dazed Chicken Logo */
        .dazed-chicken-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 15px var(--yellow-glow));
            animation: bounceGentle 2s infinite ease-in-out;
        }

        @keyframes bounceGentle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .loading-title {
            color: var(--yellow-gold);
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--yellow-glow);
            margin-bottom: 24px;
        }

        /* Progress Dots & Percentage */
        .progress-dots-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .dots-row {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #4b5563; /* Grey */
        }

        .dot.active {
            background-color: var(--yellow-gold);
            box-shadow: 0 0 8px var(--yellow-gold);
        }

        .progress-percentage {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .loading-footer-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.72rem;
            text-align: center;
            line-height: 1.4;
            letter-spacing: 0.2px;
        }

        .loading-footer-text strong {
            color: var(--yellow-gold);
        }

        /* ==========================================
           3. HEADER BAR
           ========================================== */
        header {
            background-color: #18181b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--yellow-gold);
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
        }

        .balance-badge {
            background-color: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 5px 12px;
            font-weight: 800;
            font-size: 0.85rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hamburger-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 4px;
        }

        .hamburger-icon span {
            width: 20px;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
        }

        /* ==========================================
           4. GAME CANVAS AREA (TOP-DOWN VIEW)
           ========================================== */
        .game-canvas-container {
            width: 100%;
            height: 320px;
            display: flex;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            background-color: #000;
        }

        /* Left Sidewalk (30%) */
        .sidewalk-area {
            width: 30%;
            height: 100%;
            background-color: var(--sidewalk-tile);
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 24px 24px;
            position: relative;
            border-right: 4px solid #a1a1aa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: inset -4px 0 10px rgba(0,0,0,0.15);
        }

        .bush-graphic {
            width: 28px;
            height: 28px;
            background-color: #16a34a;
            border-radius: 50%;
            box-shadow: inset -2px -2px 0 #15803d, 0 3px 6px rgba(0,0,0,0.2);
        }

        .streetlamp-graphic {
            width: 20px;
            height: 40px;
            position: relative;
        }

        /* Cartoon Standing Chicken on Sidewalk */
        .chicken-character {
            position: absolute;
            bottom: 35px;
            right: 8px;
            width: 52px;
            height: 52px;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.3s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .chicken-character.walking {
            animation: waddle 0.25s infinite alternate;
        }

        @keyframes waddle {
            0% { transform: scale(1) rotate(-4deg); }
            100% { transform: scale(1.05) rotate(4deg); }
        }

        .chicken-character.splatted {
            transform: scale(1.3, 0.3) rotate(30deg) !important;
            filter: grayscale(0.5) drop-shadow(0 0 10px red) !important;
        }

        /* Right Road (70%) */
        .road-area {
            width: 70%;
            height: 100%;
            background-color: var(--road-asphalt);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Scrolling Dashed Road Lines */
        .road-dashed-line {
            position: absolute;
            left: 50%;
            top: -100px;
            transform: translateX(-50%);
            width: 6px;
            height: 500px;
            background: repeating-linear-gradient(
                to bottom,
                #ffffff 0px,
                #ffffff 30px,
                transparent 30px,
                transparent 60px
            );
        }

        .road-dashed-line.animating {
            animation: scrollRoad 0.6s linear infinite;
        }

        @keyframes scrollRoad {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(60px); }
        }

        /* Manhole Cover in Middle of Road */
        .manhole-cover {
            width: 130px;
            height: 130px;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Multiplier Text Over Manhole */
        .multiplier-text {
            position: absolute;
            z-index: 25;
            font-size: 2.8rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.8);
            letter-spacing: -0.5px;
        }

        .multiplier-text.splatted-text {
            color: var(--red-primary) !important;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8) !important;
            font-size: 2.2rem;
        }

        /* ==========================================
           5. BETTING CONTROL PANEL
           ========================================== */
        .bet-panel-container {
            padding: 16px;
            background-color: var(--bg-dark);
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Top Row: Bet ID */
        .bet-id-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Input Row: Amount & Quick Multipliers */
        .input-controls-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .amount-input-box {
            flex: 1.2;
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px 8px;
            height: 44px;
        }

        .btn-step {
            width: 28px;
            height: 28px;
            background-color: var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
        }

        .amount-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.9rem;
            text-align: center;
        }

        .quick-multiplier-btns {
            display: flex;
            gap: 6px;
        }

        .btn-quick {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0 10px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .btn-quick:hover {
            border-color: var(--yellow-gold);
            color: var(--yellow-gold);
        }

        /* Difficulty Selector Dropdown */
        .difficulty-dropdown-container {
            position: relative;
            width: 100%;
        }

        .difficulty-box {
            width: 100%;
            height: 44px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .difficulty-options {
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            background-color: #27272a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: none;
            z-index: 50;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .difficulty-options.open {
            display: block;
        }

        .opt-item {
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .opt-item:hover {
            background-color: var(--border-color);
            color: var(--yellow-gold);
        }

        /* Massive Action Button */
        .btn-action-main {
            width: 100%;
            height: 54px;
            background-color: var(--green-primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action-main:active {
            transform: scale(0.98);
        }

        .btn-action-main.cashout-state {
            background-color: var(--yellow-gold) !important;
            color: #000000 !important;
            box-shadow: 0 6px 20px var(--yellow-glow) !important;
        }

        .btn-action-main.splatted-state {
            background-color: var(--red-primary) !important;
            color: #ffffff !important;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4) !important;
        }

        /* Toast Popup */
        .toast-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #18181b;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .toast-msg.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- TOAST POPUP -->
    <div id="toast" class="toast-msg">Notification Message</div>

    <!-- ==========================================
       2. LOADING SCREEN OVERLAY (z-index 99999)
       ========================================== -->
    <div id="loading-overlay">
        <div class="loading-center">
            <!-- Cartoon Dazed Chicken SVG -->
            <svg class="dazed-chicken-logo" viewBox="0 0 100 100">
                <!-- Body -->
                <circle cx="50" cy="55" r="32" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
                <!-- Wing -->
                <path d="M 30 55 Q 18 60 30 70 Q 42 65 30 55" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
                <!-- Comb -->
                <path d="M 42 22 Q 46 12 50 20 Q 54 10 58 22 Z" fill="#ef4444"/>
                <!-- Beak -->
                <polygon points="50,42 62,48 50,52" fill="#f59e0b"/>
                <!-- Dazed Spiral Eyes -->
                <circle cx="42" cy="38" r="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <path d="M 40 38 Q 42 36 44 38 Q 42 40 40 38" fill="none" stroke="#000000" stroke-width="1.5"/>
                <circle cx="58" cy="38" r="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <path d="M 56 38 Q 58 36 60 38 Q 58 40 56 38" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- Legs -->
                <line x1="42" y1="85" x2="42" y2="95" stroke="#f59e0b" stroke-width="3"/>
                <line x1="58" y1="85" x2="58" y2="95" stroke="#f59e0b" stroke-width="3"/>
            </svg>

            <!-- Yellow/Gold Title -->
            <div class="loading-title">CHICKEN ROAD 2</div>

            <!-- Progress Indicator: 5 Dots (2 yellow, 3 grey) + 39% -->
            <div class="progress-dots-container">
                <div class="dots-row">
                    <div class="dot active"></div>
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <span class="progress-percentage">39%</span>
            </div>
        </div>

        <!-- Bottom Disclaimer -->
        <div class="loading-footer-text">
            <strong>CHICKEN ROAD 2™</strong> is a 100% provably fair game.
        </div>
    </div>

    <!-- ==========================================
       3. MAIN GAME VIEWPORT
       ========================================== -->
    <div class="app-viewport">
        
        <!-- HEADER -->
        <header>
            <div class="header-logo-group">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#f59e0b">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>CHICKEN ROAD 2</span>
            </div>
            <div class="header-right-group">
                <div class="btn-icon-circle" onclick="showToast('Chicken Road 2 Help Guide')">?</div>
                <div class="balance-badge">
                    <span id="user-balance">0.49</span>
                    <span style="font-size: 0.7rem; color: var(--text-muted);">INR</span>
                </div>
                <div class="hamburger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </header>

        <!-- GAME CANVAS AREA (TOP-DOWN VIEW) -->
        <div class="game-canvas-container" id="gameCanvas">
            
            <!-- Left Side: Sidewalk (30%) -->
            <div class="sidewalk-area">
                <div class="bush-graphic"></div>

                <!-- Streetlamp Graphic -->
                <div class="streetlamp-graphic">
                    <svg viewBox="0 0 30 60" width="24" height="48">
                        <path d="M15 50 L15 15 Q15 5 22 5" fill="none" stroke="#52525b" stroke-width="3"/>
                        <circle cx="22" cy="8" r="5" fill="#fef08a"/>
                    </svg>
                </div>

                <div class="bush-graphic"></div>

                <!-- Cartoon Chicken Standing on Sidewalk -->
                <div class="chicken-character" id="chickenChar">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <circle cx="50" cy="50" r="30" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
                        <path d="M 40 22 Q 45 12 50 20 Q 55 10 60 22 Z" fill="#ef4444"/>
                        <polygon points="50,42 62,48 50,52" fill="#f59e0b"/>
                        <circle cx="42" cy="38" r="3" fill="#000000"/>
                        <circle cx="58" cy="38" r="3" fill="#000000"/>
                    </svg>
                </div>
            </div>

            <!-- Right Side: Road (70%) -->
            <div class="road-area">
                <!-- Dashed Center Lines -->
                <div class="road-dashed-line" id="roadLine"></div>

                <!-- Manhole Cover in Center -->
                <div class="manhole-cover">
                    <svg viewBox="0 0 100 100" width="120" height="120">
                        <circle cx="50" cy="50" r="45" fill="#3f3f46" stroke="#18181b" stroke-width="4"/>
                        <circle cx="50" cy="50" r="36" fill="none" stroke="#27272a" stroke-width="3"/>
                        <path d="M20 50 L80 50 M50 20 L50 80 M28 28 L72 72 M28 72 L72 28" stroke="#27272a" stroke-width="2"/>
                    </svg>

                    <!-- Multiplier Text directly over manhole cover -->
                    <div class="multiplier-text" id="multText">1.00x</div>
                </div>
            </div>
        </div>

        <!-- BETTING CONTROL PANEL -->
        <div class="bet-panel-container">
            <div class="bet-card">
                
                <!-- Row 1: Bet ID -->
                <div class="bet-id-row">
                    <span>Bet ID: #CR2-98412</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 10l5 5 5-5z"/>
                    </svg>
                </div>

                <!-- Row 2: Input Controls & Quick Multipliers -->
                <div class="input-controls-row">
                    <div class="amount-input-box">
                        <div class="btn-step" onclick="adjustAmount(-0.50)">-</div>
                        <input type="text" id="amountInput" value="1.00 INR" readonly>
                        <div class="btn-step" onclick="adjustAmount(0.50)">+</div>
                    </div>

                    <div class="quick-multiplier-btns">
                        <div class="btn-quick" onclick="multiplyAmount(0.5)">x0.5</div>
                        <div class="btn-quick" onclick="multiplyAmount(2.0)">x2.0</div>
                        <div class="btn-quick" onclick="showToast('Coin Stack Presets')">🪙</div>
                    </div>
                </div>

                <!-- Row 3: Difficulty Selector Dropdown -->
                <div class="difficulty-dropdown-container">
                    <div class="difficulty-box" onclick="toggleDifficultyDropdown()">
                        <span id="selectedDifficulty">Easy</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </div>
                    <div class="difficulty-options" id="difficultyMenu">
                        <div class="opt-item" onclick="selectDifficulty('Easy')">Easy</div>
                        <div class="opt-item" onclick="selectDifficulty('Medium')">Medium</div>
                        <div class="opt-item" onclick="selectDifficulty('Hard')">Hard</div>
                        <div class="opt-item" onclick="selectDifficulty('Hardcore')">Hardcore</div>
                    </div>
                </div>

                <!-- Row 4: Massive Prominent Action Button -->
                <button class="btn-action-main" id="btnPlay" onclick="handlePlayAction()">Play</button>

            </div>
        </div>

    </div>

    <!-- ==========================================
       4. JAVASCRIPT GAME ENGINE & LOGIC
       ========================================== -->
    <script>
        // --- GAME STATE ---
        let balance = 0.49;
        let currentBet = 1.00;
        let gameState = 'IDLE'; // 'IDLE', 'RUNNING', 'CASHED_OUT', 'SPLATTED'
        let currentMultiplier = 1.00;
        let crashMultiplier = 2.00;
        let gameInterval = null;

        // DOM Elements
        const loadingOverlay = document.getElementById('loading-overlay');
        const userBalanceEl = document.getElementById('user-balance');
        const amountInput = document.getElementById('amountInput');
        const difficultyMenu = document.getElementById('difficultyMenu');
        const selectedDifficulty = document.getElementById('selectedDifficulty');
        const btnPlay = document.getElementById('btnPlay');
        const multText = document.getElementById('multText');
        const roadLine = document.getElementById('roadLine');
        const chickenChar = document.getElementById('chickenChar');

        // 1. Loading Screen Auto-Fade after 3 seconds
        window.addEventListener('load', () => {
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 3000);
        });

        // 2. Bet Amount Controls
        function adjustAmount(delta) {
            if (gameState !== 'IDLE') return;
            currentBet = Math.max(0.50, currentBet + delta);
            amountInput.value = `${currentBet.toFixed(2)} INR`;
        }

        function multiplyAmount(factor) {
            if (gameState !== 'IDLE') return;
            currentBet = Math.max(0.50, currentBet * factor);
            amountInput.value = `${currentBet.toFixed(2)} INR`;
        }

        // 3. Difficulty Dropdown
        function toggleDifficultyDropdown() {
            if (gameState !== 'IDLE') return;
            difficultyMenu.classList.toggle('open');
        }

        function selectDifficulty(level) {
            selectedDifficulty.innerText = level;
            difficultyMenu.classList.remove('open');
            showToast(`Difficulty set to ${level}`);
        }

        // 4. Main Game Play / Cash Out Action Handler
        function handlePlayAction() {
            if (gameState === 'IDLE') {
                startRound();
            } else if (gameState === 'RUNNING') {
                cashOut();
            }
        }

        function startRound() {
            gameState = 'RUNNING';
            currentMultiplier = 1.00;

            // Generate weighted random crash point
            const difficulty = selectedDifficulty.innerText;
            let maxRange = 5.0;
            if (difficulty === 'Medium') maxRange = 10.0;
            if (difficulty === 'Hard') maxRange = 25.0;
            if (difficulty === 'Hardcore') maxRange = 50.0;

            crashMultiplier = (1.05 + Math.random() * (maxRange - 1.05)).toFixed(2);

            // Deduct / update UI
            btnPlay.innerText = `Cash Out (1.00 INR)`;
            btnPlay.className = "btn-action-main cashout-state";

            multText.innerText = "1.00x";
            multText.className = "multiplier-text";

            // Animate road & chicken
            roadLine.classList.add('animating');
            chickenChar.classList.add('walking');
            chickenChar.style.right = "8px";

            // Start multiplier counter
            const startTime = Date.now();
            gameInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                currentMultiplier = (1.00 + Math.pow(elapsed * 0.5, 1.6)).toFixed(2);

                if (parseFloat(currentMultiplier) >= parseFloat(crashMultiplier)) {
                    triggerCrash();
                } else {
                    multText.innerText = `${currentMultiplier}x`;
                    const currentPayout = (currentBet * parseFloat(currentMultiplier)).toFixed(2);
                    btnPlay.innerText = `Cash Out (${currentPayout} INR)`;
                }
            }, 50);
        }

        function cashOut() {
            if (gameState !== 'RUNNING') return;

            clearInterval(gameInterval);
            gameState = 'CASHED_OUT';

            const winAmount = currentBet * parseFloat(currentMultiplier);
            balance += winAmount;
            userBalanceEl.innerText = balance.toFixed(2);

            roadLine.classList.remove('animating');
            chickenChar.classList.remove('walking');

            btnPlay.innerText = `Cashed Out! (+${winAmount.toFixed(2)} INR)`;
            showToast(`🎉 Cashed out at ${currentMultiplier}x! Won ${winAmount.toFixed(2)} INR`);

            setTimeout(() => {
                resetToIdle();
            }, 1800);
        }

        function triggerCrash() {
            clearInterval(gameInterval);
            gameState = 'SPLATTED';

            roadLine.classList.remove('animating');
            chickenChar.classList.remove('walking');
            chickenChar.classList.add('splatted');

            multText.innerText = "SPLATTED!";
            multText.className = "multiplier-text splatted-text";

            btnPlay.innerText = "SPLATTED!";
            btnPlay.className = "btn-action-main splatted-state";

            setTimeout(() => {
                resetToIdle();
            }, 2000);
        }

        function resetToIdle() {
            gameState = 'IDLE';
            btnPlay.innerText = "Play";
            btnPlay.className = "btn-action-main";
            multText.innerText = "1.00x";
            multText.className = "multiplier-text";
            chickenChar.className = "chicken-character";
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = 'toast-msg show';
            setTimeout(() => {
                toast.className = 'toast-msg';
            }, 2600);
        }
    </script>
</body>
</html>
