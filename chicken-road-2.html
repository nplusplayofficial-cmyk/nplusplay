<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N+ PLAY — Chicken Road</title>
<style>
:root{
  --bg:#050505;
  --panel:#101010;
  --panel2:#161616;
  --line:#2a2926;
  --gold:#d8b76a;
  --gold2:#f1d991;
  --text:#f4f1eb;
  --muted:#89867f;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
button{font:inherit;cursor:pointer}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.app{
  width:min(100%,620px);
  min-height:100vh;
  position:relative;
  background:
    radial-gradient(circle at 50% 35%,rgba(216,183,106,.08),transparent 34%),
    linear-gradient(180deg,#0b0b0b,#050505);
  border-left:1px solid #111;
  border-right:1px solid #111;
  display:flex;
  flex-direction:column;
}
.top{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  background:rgba(8,8,8,.9);
  backdrop-filter:blur(14px);
}
.icon{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#111;
  color:#eee;
  font-size:24px;
}
.brand{
  font-weight:950;
  letter-spacing:4px;
  color:var(--gold2);
}
.badge{
  font-size:9px;
  letter-spacing:1.5px;
  color:#8e8a83;
}
.main{
  flex:1;
  display:grid;
  place-items:center;
  padding:28px 18px;
}
.card{
  width:min(100%,470px);
  padding:34px 24px 28px;
  border:1px solid #3a352d;
  border-radius:24px;
  background:
    linear-gradient(180deg,rgba(24,24,24,.96),rgba(12,12,12,.98));
  box-shadow:0 25px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
  text-align:center;
}
.logoWrap{
  width:92px;
  height:92px;
  margin:0 auto 18px;
  border-radius:24px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#1c1c1c,#0e0e0e);
  border:1px solid #38332b;
  box-shadow:0 0 35px rgba(216,183,106,.08);
}
.logoWrap span{
  color:var(--gold2);
  font-weight:950;
  font-size:24px;
  letter-spacing:2px;
}
.kicker{
  font-size:9px;
  color:#8b877f;
  letter-spacing:2.5px;
  margin-bottom:12px;
}
h1{
  margin:0;
  font-size:30px;
  letter-spacing:.5px;
  font-weight:950;
}
.line{
  width:64px;
  height:2px;
  margin:16px auto;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
}
p{
  margin:0 auto;
  max-width:360px;
  color:#9b9891;
  line-height:1.65;
  font-size:12px;
}
.coming{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:22px;
  padding:11px 16px;
  border:1px solid #5c5038;
  border-radius:12px;
  background:#1a1711;
  color:var(--gold2);
  font-size:10px;
  font-weight:950;
  letter-spacing:1.6px;
}
.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--gold2);
  box-shadow:0 0 12px rgba(241,217,145,.7);
}
.home{
  width:100%;
  margin-top:18px;
  padding:13px 15px;
  border:1px solid #3d3a35;
  border-radius:12px;
  background:#141414;
  color:#ddd;
  font-weight:900;
  font-size:11px;
}
.home:hover{
  border-color:#665b43;
  color:var(--gold2);
}
.footer{
  text-align:center;
  padding:0 14px 18px;
  color:#555;
  font-size:8px;
  letter-spacing:.5px;
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <button class="icon" onclick="history.back()">‹</button>
    <div class="brand">N+ PLAY</div>
    <div class="badge">DEMO PLATFORM</div>
  </header>

  <section class="main">
    <div class="card">
      <div class="logoWrap"><span>N+ CR</span></div>
      <div class="kicker">CHICKEN ROAD</div>
      <h1>Coming Soon</h1>
      <div class="line"></div>
      <p>
        Chicken Road experience is currently under development.
        We are preparing the next premium N+ PLAY version.
      </p>

      <div class="coming">
        <span class="dot"></span>
        COMING SOON
      </div>

      <button class="home" onclick="location.href='index.html'">
        BACK TO N+ PLAY
      </button>
    </div>
  </section>

  <div class="footer">
    N+ PLAY · VIRTUAL-CREDIT DEMO EXPERIENCE · 18+
  </div>
</main>
</body>
</html>
