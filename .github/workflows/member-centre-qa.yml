name: N+ Member Centre Static and Database QA

on:
  workflow_dispatch:
  pull_request:
    branches: [release-candidate/security-rollout-2026-10-17]

permissions:
  contents: read

concurrency:
  group: nplus-member-centre-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  member-centre-static-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nplus_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nplus_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nplus_qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static member centre QA
        run: node tests/nplus-member-centre-qa.mjs
      - name: Free release source safety guards
        run: node qa/free-release-guards.cjs
      - name: Prepare disposable Supabase-like PostgreSQL fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/nplus-member-centre-prelude.sql
      - name: Apply member centre migration in disposable database only
        run: psql -v ON_ERROR_STOP=1 -f sql/NPLUS_VIP_REFERRAL_DEMO_2026-10-19.sql
      - name: Exercise referral, reward, gift, safe, attendance and support RPCs
        run: psql -v ON_ERROR_STOP=1 -f tests/nplus-member-centre-smoke.sql

  member-centre-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: pip install playwright==1.55.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start local candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nplus-member-http.log 2>&1 &
          echo $! > /tmp/nplus-member-http.pid
      - name: Wait for server and smoke test desktop/mobile member pages
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          python qa/browser-smoke.py
