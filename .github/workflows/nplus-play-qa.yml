name: N+ PLAY static QA

on:
  push:
    branches:
      - main
      - fixes/premium-audit-2026-10-15
      - security/server-game-settlement-2026-10-15
      - release-candidate/security-rollout-2026-10-17
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nplus_test
          POSTGRES_DB: nplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nplus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test live RLS/index migrations in a dedicated disposable database
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_migration_test
          psql -h 127.0.0.1 -U postgres -d nplus_migration_test -v ON_ERROR_STOP=1 -f qa/test-release-index-policy-migration.sql
      - name: Check syntax and local links
        run: node qa/verify-project.js
      - name: Guard qualified demo referral lifecycle state
        run: node qa/test-demo-referral-qualified-state.cjs
      - name: Guard finite Admin referral qualification amounts
        run: node qa/test-demo-referral-finite-amount.cjs
      - name: Test finite Admin referral qualification in a dedicated disposable database
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_referral_finite_test
          psql -h 127.0.0.1 -U postgres -d nplus_referral_finite_test -v ON_ERROR_STOP=1 -f qa/test-demo-referral-finite-amount.sql
      - name: Guard finite numeric RPC inputs
        run: node qa/test-finite-numeric-rpc-guards.cjs
      - name: Test finite numeric guard semantics in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_finite_numeric_rpc_test
          psql -h 127.0.0.1 -U postgres -d nplus_finite_numeric_rpc_test -v ON_ERROR_STOP=1 -f qa/test-finite-numeric-rpc-guards.sql
      - name: Execute finite-numeric candidate migration in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_finite_numeric_migration_test
          psql -h 127.0.0.1 -U postgres -d nplus_finite_numeric_migration_test -v ON_ERROR_STOP=1 -f qa/test-finite-numeric-migration.sql
      - name: Test reconstructed legacy-table baseline in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_migration_replay_20261027
          psql -h 127.0.0.1 -U postgres -d nplus_migration_replay_20261027 -v ON_ERROR_STOP=1 -f qa/test-reconstructed-legacy-bootstrap.sql
      - name: Guard reconstructed full replay procedure
        run: node qa/test-reconstructed-replay-runner.cjs
      - name: Guard one-command local split replay wrapper
        run: node qa/test-final-split-replay-wrapper.cjs
      - name: Guard unapproved K3, 5D and TRX payout rules
        run: node qa/test-game-rules-approval.cjs
      - name: Audit recent activity privacy and Aviator recovery
        run: node qa/test-activity-aviator-audit.cjs
      - name: Verify recovered live migration source fingerprints
        run: node qa/test-live-migration-source-fingerprints.cjs
      - name: Test WINGO Admin overload disambiguation in a fresh disposable database
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_wingo_overload_test
          psql -h 127.0.0.1 -U postgres -d nplus_wingo_overload_test -v ON_ERROR_STOP=1 -f qa/test-wingo-overload-disambiguation.sql
      - name: Test public Recent Activity privacy contract in a dedicated disposable database
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_activity_test
          psql -h 127.0.0.1 -U postgres -d nplus_activity_test -v ON_ERROR_STOP=1 -f qa/test-recent-demo-activity-privacy.sql
      - name: Test Recent Activity recovery SQL in a separate disposable database
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_activity_recovery_test
          psql -h 127.0.0.1 -U postgres -d nplus_activity_recovery_test -v ON_ERROR_STOP=1 -f qa/test-recent-demo-activity.sql
      - name: Test WINGO settlement against disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-wingo-settlement.sql
      - name: Test N+ ADMIN game status against disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-admin-game-status.sql
      - name: Test server-authoritative K3, 5D and TRX demo settlement
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_demo_lottery_test
          psql -h 127.0.0.1 -U postgres -d nplus_demo_lottery_test -v ON_ERROR_STOP=1 -f qa/test-demo-lottery-settlement.sql
      - name: Test MotoRace settlement against disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-motorace-settlement.sql
      - name: Test Aviator server settlement against disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-aviator-settlement.sql
      - name: Test generic wallet positive-credit guard in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-generic-wallet-credit-guard.sql
      - name: Test phone-enumeration revocation in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-phone-enumeration-revoke.sql
      - name: Test N+ ADMIN user tools in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-admin-user-tools.sql
      - name: Test profile role escalation guard in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-profile-role-guard.sql
      - name: Test Admin null-profile authorization guard in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-admin-null-profile-guard.sql
      - name: Test N+ ADMIN deposit actions in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-admin-deposits.sql
      - name: Test demo deposit and withdrawal requests in disposable PostgreSQL
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-demo-wallet-requests.sql
      - name: Test legacy table privilege hardening in a dedicated disposable database
        env:
          PGPASSWORD: nplus_test
        run: |
          createdb -h 127.0.0.1 -U postgres nplus_legacy_privilege_test
          psql -h 127.0.0.1 -U postgres -d nplus_legacy_privilege_test -v ON_ERROR_STOP=1 -f qa/test-legacy-table-privilege-hardening.sql
      - name: Guard legacy browser routes as read-only
        run: node qa/test-legacy-browser-route-readonly.cjs
      - name: Test LEGACY 200/20 referral prototype only (not current release acceptance)
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-demo-referrals.sql
      - name: Test profile RLS admin login and private profile visibility
        env:
          PGPASSWORD: nplus_test
        run: psql -h 127.0.0.1 -U postgres -d nplus_test -v ON_ERROR_STOP=1 -f qa/test-profiles-rls-admin-login.sql

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: pip install playwright==1.55.0
      - name: Install Chromium
        run: python -m playwright install --only-shell chromium
      - name: Start local candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nplus-play-http.log 2>&1 &
          echo $! > /tmp/nplus-play-http.pid
      - name: Wait for local server and test desktop/mobile page rendering
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          python qa/browser-smoke.py
