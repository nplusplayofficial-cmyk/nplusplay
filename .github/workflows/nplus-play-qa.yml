name: N+ PLAY static QA

on:
  push:
    branches:
      - main
      - fixes/premium-audit-2026-10-15
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check syntax and local links
        run: node qa/verify-project.js
