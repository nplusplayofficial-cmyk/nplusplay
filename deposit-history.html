<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080908"><link rel="manifest" href="./manifest.webmanifest"><title>N+ PLAY — Deposit History</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080908;color:#f4f1e8;font:14px Inter,system-ui,sans-serif}.app{width:min(850px,100% - 28px);margin:18px auto 40px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 17px;border-bottom:1px solid #29271f}.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:1px;text-decoration:none;color:inherit}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#f0dfb5,#b9914b);color:#15120b}.link{color:#f0dfb5;font-size:11px;text-decoration:none;margin-left:12px}.hero,.panel{border:1px solid rgba(201,165,91,.17);border-radius:18px;background:linear-gradient(145deg,#171813,#0c0d0b);padding:18px;margin-top:16px}.eyebrow{font-size:9px;letter-spacing:2px;color:#c9a55b}h1{font-size:24px;margin:8px 0}p{font-size:12px;line-height:1.6;color:#85877f}.status{padding:18px;text-align:center;color:#aaa99f;font-size:12px;line-height:1.6}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.06)}.row:last-child{border-bottom:0}.title{font-size:12px;font-weight:900;overflow-wrap:anywhere}.meta{font-size:10px;color:#85877f;line-height:1.6;margin-top:5px;overflow-wrap:anywhere}.money{text-align:right;font-weight:950;font-size:14px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#22231e;color:#d1c7a9;font-size:9px;font-weight:900;letter-spacing:.4px;margin-top:6px}.approved{color:#8de4bd;background:rgba(66,217,165,.08)}.rejected{color:#ff9da4;background:rgba(255,109,119,.08)}.foot{font-size:10px;color:#65675f;text-align:center;padding:16px}@media(max-width:500px){.row{grid-template-columns:1fr}.money{text-align:left}}
</style></head><body><main class="app"><header class="top"><a class="brand" href="account.html"><span class="mark">N+</span>PLAY</a><div><a class="link" href="deposit.html">DEPOSIT</a><a class="link" href="withdraw.html">WITHDRAW</a></div></header>
<section class="hero"><div class="eyebrow">WALLET CENTER</div><h1>Deposit history</h1><p>These are your virtual-credit requests only. A request does not add credits until an administrator approves it. No payment provider is connected.</p></section><section class="panel"><div id="rows" class="status" role="status" aria-live="polite">Checking account…</div></section><footer class="foot">N+ PLAY · Virtual-credit demo · No real-money deposits</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="core/nplus-config.js"></script><script src="core/nplus-auth.js"></script>
<script>
(async function(){"use strict";const rows=document.getElementById("rows"),money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));try{const user=await window.NPlusAuth.requireAuth();if(!user)return;const response=await window.NPlusAuth.client.from("deposit_requests").select("id,amount,status,created_at,reviewed_at,request_note,payment_method").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100);if(response.error)throw response.error;const data=response.data||[];if(!data.length){rows.className="status";rows.textContent="No deposit requests yet. Start from the Deposit page.";return}rows.className="";rows.innerHTML=data.map(r=>{const state=String(r.status||"pending").toLowerCase(),cls=state==="approved"?"approved":state==="rejected"?"rejected":"";return '<article class="row"><div><div class="title">Demo request · '+esc(String(r.id).slice(0,8))+'</div><div class="meta">Created: '+esc(r.created_at?new Date(r.created_at).toLocaleString("en-IN"):"—")+'</div><div class="meta">Method: '+esc(r.payment_method||"DEMO_CREDIT")+'</div><div class="meta">'+esc(r.request_note||"Virtual-credit request")+'</div><span class="badge '+cls+'">'+esc(state.toUpperCase())+'</span>'+(r.reviewed_at?'<div class="meta">Reviewed: '+esc(new Date(r.reviewed_at).toLocaleString("en-IN"))+'</div>':"")+'</div><div class="money">'+money(r.amount)+'</div></article>'}).join("")}catch(e){console.error(e);rows.className="status";rows.textContent=e.message||"Could not load deposit history."}})();
</script><script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("PWA registration skipped",e)));</script></body></html>
