<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N+ PLAY - European Casino Roulette</title>
    <style>
        /* ==========================================
           1. MODERN DARK GAMING THEME & GLASSMORPHISM
           ========================================== */
        :root {
            --bg-dark: #070a12;
            --bg-surface: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            
            --gold-neon: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.35);
            --red-vibrant: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.4);
            --green-vibrant: #10b981;
            --black-vibrant: #1e293b;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.85);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 10%, var(--gold-glow) 0%, transparent 40%),
                radial-gradient(circle at 10% 90%, var(--red-glow) 0%, transparent 40%),
                linear-gradient(180deg, var(--bg-dark) 0%, #030712 100%);
            background-attachment: fixed;
            padding: 10px 10px 80px 10px; /* Space for bottom nav */
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        /* HEADER */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--gold-neon);
            color: var(--gold-neon);
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ffffff, var(--gold-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wallet-chip {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green-vibrant);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
        }

        /* LIVE ROLLING HISTORY BADGES */
        .history-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 2px;
            white-space: nowrap;
        }

        .history-strip::-webkit-scrollbar { display: none; }

        .num-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 900;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .num-badge.red { background: var(--red-vibrant); }
        .num-badge.black { background: var(--black-vibrant); border: 1px solid rgba(255,255,255,0.2); }
        .num-badge.green { background: var(--green-vibrant); }

        /* ROULETTE WHEEL ARENA CONTAINER */
        .wheel-arena-card {
            background: radial-gradient(circle, rgba(30, 41, 59, 0.9), #030712);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .canvas-wrapper {
            position: relative;
            width: 230px;
            height: 230px;
            margin-bottom: 12px;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .wheel-pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 16px solid var(--gold-neon);
            filter: drop-shadow(0 2px 6px var(--gold-glow));
            z-index: 10;
        }

        .arena-status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            font-size: 0.85rem;
            font-weight: 800;
        }

        .clock-val {
            color: var(--gold-neon);
            font-family: monospace;
            font-size: 1.1rem;
        }

        /* CHIP SELECTION BAR */
        .chips-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
        }

        .chip-btn {
            flex: 1;
            height: 42px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.4);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .chip-10 { background: #0284c7; }
        .chip-50 { background: #7c3aed; }
        .chip-100 { background: #d97706; }
        .chip-500 { background: #dc2626; }

        .chip-btn.active {
            border-style: solid;
            border-color: #ffffff;
            transform: scale(1.12);
            box-shadow: 0 0 15px var(--gold-neon);
        }

        /* INTERACTIVE BETTING GRID TABLE */
        .table-grid-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .grid-row-0 {
            display: grid;
            grid-template-columns: 1fr;
        }

        .grid-cell-0 {
            background: var(--green-vibrant);
            color: #fff;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            position: relative;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .grid-numbers-table {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
        }

        .num-cell {
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.72rem;
            cursor: pointer;
            color: #fff;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .num-cell.red { background: var(--red-vibrant); }
        .num-cell.black { background: var(--black-vibrant); }

        .grid-outside-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .outside-cell {
            height: 38px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.78rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .outside-cell.red-bg { background: var(--red-vibrant); }
        .outside-cell.black-bg { background: var(--black-vibrant); }

        /* CHIP BADGE ON PLACED BETS */
        .chip-placed-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--gold-neon);
            color: #000;
            font-size: 0.58rem;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 10px;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* CONTROL BUTTONS */
        .action-row {
            display: flex;
            gap: 8px;
        }

        .btn-ctrl {
            flex: 1;
            height: 44px;
            border-radius: 12px;
            border: none;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-clear { background: rgba(255,255,255,0.1); color: var(--text-muted); }
        .btn-double { background: rgba(245, 158, 11, 0.2); border: 1px solid var(--gold-neon); color: var(--gold-neon); }

        /* FIXED 4-COLUMN BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 480px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .nav-item.active { color: var(--gold-neon); }
        .nav-icon { font-size: 1.2rem; }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--gold-neon);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.85rem; font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">Notification</div>

    <!-- MAIN APP CONTAINER -->
    <div class="app-viewport">
        <!-- HEADER -->
        <header class="app-header">
            <a href="index.html" class="btn-back" title="Back to Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <span class="brand-title">🎡 Roulette VIP</span>
            <div class="wallet-chip" id="walletDisplay">$1,000.00</div>
        </header>

        <!-- RECENT ROLLING HISTORY BADGES -->
        <div class="history-strip" id="historyStrip">
            <span class="num-badge red">32</span>
            <span class="num-badge black">15</span>
            <span class="num-badge green">0</span>
            <span class="num-badge red">19</span>
            <span class="num-badge black">4</span>
            <span class="num-badge red">21</span>
            <span class="num-badge black">2</span>
            <span class="num-badge red">25</span>
        </div>

        <!-- ROULETTE WHEEL ARENA -->
        <div class="wheel-arena-card">
            <div class="canvas-wrapper">
                <div class="wheel-pointer"></div>
                <canvas id="rouletteCanvas" width="230" height="230"></canvas>
            </div>

            <div class="arena-status-bar">
                <span id="gameStatusText">Place Your Bets</span>
                <span class="clock-val" id="clockDisplay">00:15</span>
            </div>
        </div>

        <!-- CHIP SELECTION BAR -->
        <div class="chips-bar">
            <button class="chip-btn chip-10 active" onclick="selectChip(10, this)">$10</button>
            <button class="chip-btn chip-50" onclick="selectChip(50, this)">$50</button>
            <button class="chip-btn chip-100" onclick="selectChip(100, this)">$100</button>
            <button class="chip-btn chip-500" onclick="selectChip(500, this)">$500</button>
        </div>

        <!-- INTERACTIVE BETTING GRID TABLE -->
        <div class="table-grid-card">
            <!-- Pocket 0 -->
            <div class="grid-row-0">
                <div class="grid-cell-0" onclick="placeBet('0', 'number')">
                    0
                    <span class="chip-placed-badge" id="betBadge-0" style="display:none;">$0</span>
                </div>
            </div>

            <!-- Numbers 1 to 36 Grid -->
            <div class="grid-numbers-table" id="numbersGrid">
                <!-- JS Population -->
            </div>

            <!-- Dozens -->
            <div class="grid-outside-row">
                <div class="outside-cell" onclick="placeBet('1st12', 'dozen')">
                    1st 12 (1-12)
                    <span class="chip-placed-badge" id="betBadge-1st12" style="display:none;">$0</span>
                </div>
                <div class="outside-cell" onclick="placeBet('2nd12', 'dozen')">
                    2nd 12 (13-24)
                    <span class="chip-placed-badge" id="betBadge-2nd12" style="display:none;">$0</span>
                </div>
                <div class="outside-cell" onclick="placeBet('3rd12', 'dozen')">
                    3rd 12 (25-36)
                    <span class="chip-placed-badge" id="betBadge-3rd12" style="display:none;">$0</span>
                </div>
            </div>

            <!-- Colors & Parity -->
            <div class="grid-outside-row">
                <div class="outside-cell red-bg" onclick="placeBet('Red', 'color')">
                    RED
                    <span class="chip-placed-badge" id="betBadge-Red" style="display:none;">$0</span>
                </div>
                <div class="outside-cell black-bg" onclick="placeBet('Black', 'color')">
                    BLACK
                    <span class="chip-placed-badge" id="betBadge-Black" style="display:none;">$0</span>
                </div>
                <div class="outside-cell" onclick="placeBet('Even', 'parity')">
                    EVEN
                    <span class="chip-placed-badge" id="betBadge-Even" style="display:none;">$0</span>
                </div>
            </div>

            <!-- Clear & Double Actions -->
            <div class="action-row">
                <button class="btn-ctrl btn-clear" onclick="clearAllBets()">Clear Bets</button>
                <button class="btn-ctrl btn-double" onclick="doubleAllBets()">Double Bets</button>
            </div>
        </div>
    </div>

    <!-- FIXED 4-COLUMN BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="activity.html" class="nav-item">
            <span class="nav-icon">🔥</span>
            <span>Activity</span>
        </a>
        <a href="promotion.html" class="nav-item">
            <span class="nav-icon">🎁</span>
            <span>Promotion</span>
        </a>
        <a href="account.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Account</span>
        </a>
    </nav>

    <!-- ==========================================
       JAVASCRIPT ROULETTE WHEEL & BETTING ENGINE
       ========================================== -->
    <script>
        // --- EUROPEAN ROULETTE WHEEL SEQUENCE & COLOR MAPPING ---
        const ROULETTE_SEQUENCE = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const RED_NUMBERS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

        // --- GAME STATE ---
        let walletBalance = 1000.00;
        let selectedChip = 10;
        let placedBets = {}; // e.g. { 'Red': 50, '17': 10 }
        let totalStakedRound = 0;

        let countdown = 15;
        let isSpinning = false;

        let canvas, ctx;
        let currentWheelAngle = 0;

        // --- INITIALIZATION ---
        window.onload = () => {
            canvas = document.getElementById('rouletteCanvas');
            ctx = canvas.getContext('2d');

            drawWheel(0);
            renderNumbersGrid();
            startContinuousLoop();
        };

        function updateWalletDisplay() {
            document.getElementById('walletDisplay').innerText = `$${walletBalance.toFixed(2)}`;
        }

        function selectChip(val, btn) {
            selectedChip = val;
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- RENDER BETTING GRID (NUMBERS 1 TO 36) ---
        function renderNumbersGrid() {
            const container = document.getElementById('numbersGrid');
            let html = '';
            for (let i = 1; i <= 36; i++) {
                let isRed = RED_NUMBERS.includes(i);
                html += `
                    <div class="num-cell ${isRed ? 'red' : 'black'}" onclick="placeBet('${i}', 'number')">
                        ${i}
                        <span class="chip-placed-badge" id="betBadge-${i}" style="display:none;">$0</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // --- BETTING LOGIC ---
        function placeBet(targetKey, type) {
            if (isSpinning || countdown <= 3) {
                showToast("Betting is locked during spin!");
                return;
            }

            if (walletBalance < selectedChip) {
                showToast("Insufficient Balance!");
                return;
            }

            walletBalance -= selectedChip;
            placedBets[targetKey] = (placedBets[targetKey] || 0) + selectedChip;
            totalStakedRound += selectedChip;

            updateWalletDisplay();
            updateBetBadges();
        }

        function clearAllBets() {
            if (isSpinning || countdown <= 3) return;
            walletBalance += totalStakedRound;
            placedBets = {};
            totalStakedRound = 0;

            updateWalletDisplay();
            updateBetBadges();
            showToast("All bets cleared!");
        }

        function doubleAllBets() {
            if (isSpinning || countdown <= 3) return;
            if (totalStakedRound === 0) return;
            if (walletBalance < totalStakedRound) {
                showToast("Insufficient Balance to Double!");
                return;
            }

            walletBalance -= totalStakedRound;
            Object.keys(placedBets).forEach(key => {
                placedBets[key] *= 2;
            });
            totalStakedRound *= 2;

            updateWalletDisplay();
            updateBetBadges();
        }

        function updateBetBadges() {
            // Hide all badges first
            document.querySelectorAll('.chip-placed-badge').forEach(b => b.style.display = 'none');

            // Render active placed bets
            Object.keys(placedBets).forEach(key => {
                const badge = document.getElementById(`betBadge-${key}`);
                if (badge && placedBets[key] > 0) {
                    badge.innerText = `$${placedBets[key]}`;
                    badge.style.display = 'block';
                }
            });
        }

        // --- CONTINUOUS GAME LOOP & COUNTDOWN ---
        function startContinuousLoop() {
            setInterval(() => {
                if (isSpinning) return;

                countdown--;
                document.getElementById('clockDisplay').innerText = `00:${countdown < 10 ? '0' + countdown : countdown}`;

                if (countdown <= 3 && countdown > 0) {
                    document.getElementById('gameStatusText').innerText = "LOCKING BETS...";
                }

                if (countdown <= 0) {
                    spinWheelRoutine();
                }
            }, 1000);
        }

        function spinWheelRoutine() {
            isSpinning = true;
            document.getElementById('gameStatusText').innerText = "SPINNING...";

            // Pick random winning European Roulette number (0 to 36)
            const winningNum = ROULETTE_SEQUENCE[Math.floor(Math.random() * ROULETTE_SEQUENCE.length)];
            const targetIndex = ROULETTE_SEQUENCE.indexOf(winningNum);

            // Calculate rotation angle to align winning sector with top pointer
            const numSectors = 37;
            const sectorAngle = (2 * Math.PI) / numSectors;
            const targetSectorAngle = (numSectors - targetIndex) * sectorAngle;

            const extraRotations = 5 * 2 * Math.PI; // 5 Full spins
            const totalTargetAngle = currentWheelAngle + extraRotations + (targetSectorAngle - (currentWheelAngle % (2 * Math.PI)));

            const startTime = performance.now();
            const duration = 4500; // 4.5s animation

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const easeOut = 1 - Math.pow(1 - progress, 3); // Cubic ease out

                currentWheelAngle = currentWheelAngle + (totalTargetAngle - currentWheelAngle) * easeOut;
                drawWheel(currentWheelAngle);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    evaluateRouletteOutcome(winningNum);
                }
            }

            requestAnimationFrame(animate);
        }

        // --- OUTCOME EVALUATION & PAYOUTS ---
        function evaluateRouletteOutcome(winningNum) {
            let color = winningNum === 0 ? 'Green' : (RED_NUMBERS.includes(winningNum) ? 'Red' : 'Black');
            let isEven = winningNum !== 0 && winningNum % 2 === 0;

            let totalPayout = 0;

            // 1. Straight Up Number Bet (36x)
            if (placedBets[winningNum]) {
                totalPayout += placedBets[winningNum] * 36;
            }

            // 2. Color Bet (2x)
            if (placedBets[color]) {
                totalPayout += placedBets[color] * 2;
            }

            // 3. Parity Bet (2x)
            if (winningNum !== 0) {
                if (isEven && placedBets['Even']) totalPayout += placedBets['Even'] * 2;
                if (!isEven && placedBets['Odd']) totalPayout += placedBets['Odd'] * 2;
            }

            // 4. Dozens Bet (3x)
            if (winningNum >= 1 && winningNum <= 12 && placedBets['1st12']) totalPayout += placedBets['1st12'] * 3;
            if (winningNum >= 13 && winningNum <= 24 && placedBets['2nd12']) totalPayout += placedBets['2nd12'] * 3;
            if (winningNum >= 25 && winningNum <= 36 && placedBets['3rd12']) totalPayout += placedBets['3rd12'] * 3;

            // Credit winnings & Reset
            if (totalPayout > 0) {
                walletBalance += totalPayout;
                showToast(`🎉 WIN! Result: ${winningNum} (${color}). Paid $${totalPayout.toFixed(2)}!`);
            } else if (totalStakedRound > 0) {
                showToast(`❌ Result: ${winningNum} (${color}). No win this round.`);
            }

            updateWalletDisplay();
            addHistoryBadge(winningNum, color);

            // Reset bets & restart timer loop
            placedBets = {};
            totalStakedRound = 0;
            updateBetBadges();

            countdown = 15;
            isSpinning = false;
            document.getElementById('gameStatusText').innerText = "Place Your Bets";
        }

        // --- DRAW CANVAS ROULETTE WHEEL ---
        function drawWheel(angleOffset) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = canvas.width / 2 - 8;
            const numSectors = 37;
            const arc = (2 * Math.PI) / numSectors;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Outer Brass Rim
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angleOffset);

            for (let i = 0; i < numSectors; i++) {
                const num = ROULETTE_SEQUENCE[i];
                const startAngle = i * arc - Math.PI / 2;
                const endAngle = startAngle + arc;

                // Color Pocket Fill
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.fillStyle = num === 0 ? '#10b981' : (RED_NUMBERS.includes(num) ? '#ef4444' : '#1e293b');
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Numbers Text
                ctx.save();
                ctx.rotate(startAngle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px Segoe UI, sans-serif';
                ctx.fillText(num, radius - 8, 3);
                ctx.restore();
            }

            // Center Brass Cap
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.35, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.15, 0, 2 * Math.PI);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();

            ctx.restore();
        }

        // --- HISTORY BADGE HELPER ---
        function addHistoryBadge(num, color) {
            const strip = document.getElementById('historyStrip');
            const badge = document.createElement('span');
            badge.className = `num-badge ${color.toLowerCase()}`;
            badge.innerText = num;
            strip.insertBefore(badge, strip.firstChild);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = 'toast show';
            setTimeout(() => { toast.className = 'toast'; }, 2800);
        }
    </script>
</body>
