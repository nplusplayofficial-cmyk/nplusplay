<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N+ PLAY — American Roulette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#f6f3ed;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:680px;min-height:100vh;background:radial-gradient(circle at 50% 15%,rgba(196,162,88,.035),transparent 28%),linear-gradient(180deg,#0b0b0b 0%,#080808 35%,#030303 100%);border-left:1px solid #171717;border-right:1px solid #171717;position:relative;overflow:hidden}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #28241e;background:rgba(9,9,9,.88)}
.back{width:44px;height:44px;border-radius:12px;border:1px solid #2f2c27;background:#111;color:#eee;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.logo{position:absolute;left:50%;transform:translateX(-50%);color:#f0d986;font-size:18px;font-weight:800;letter-spacing:7px;white-space:nowrap}
.demo{color:#77736c;font-size:10px;letter-spacing:2px;white-space:nowrap}
.main{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:80px 26px 120px}
.card{width:min(560px,100%);min-height:470px;border:1px solid #38332b;border-radius:26px;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.018),transparent 40%),linear-gradient(180deg,#1a1a1a,#121212 62%,#0e0e0e);box-shadow:0 28px 80px rgba(0,0,0,.68);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 28px 34px;text-align:center}
.icon{width:104px;height:104px;border-radius:30px;border:1px solid #3d372d;background:linear-gradient(145deg,#191919,#101010);display:flex;align-items:center;justify-content:center;color:#f0d986;font-size:30px;font-weight:800;box-shadow:inset 0 0 22px rgba(0,0,0,.5);margin-bottom:24px}
.game-name{color:#9a917f;font-size:10px;letter-spacing:4px;margin-bottom:17px}
h1{margin:0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.8px}
.gold-line{width:72px;height:2px;margin:24px 0 20px;background:linear-gradient(90deg,transparent,#e7cd82,transparent);box-shadow:0 0 12px rgba(231,205,130,.3)}
.desc{margin:0;max-width:410px;color:#99958e;font-size:13px;line-height:1.75}
.status{margin-top:25px;padding:11px 20px;border-radius:12px;border:1px solid #5b4b2e;background:linear-gradient(180deg,#211b11,#15110b);color:#f0d276;font-size:12px;font-weight:800;letter-spacing:1.4px;display:flex;align-items:center;gap:10px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#efd77e;box-shadow:0 0 10px rgba(239,215,126,.65)}
.back-home{width:100%;max-width:460px;height:48px;margin-top:20px;border-radius:12px;border:1px solid #383838;background:linear-gradient(180deg,#171717,#111);color:#f2f2f2;font-size:13px;font-weight:800;cursor:pointer}
.back-home:hover{border-color:#5a4d38}
.footer{position:absolute;bottom:32px;left:0;width:100%;text-align:center;color:#6a665f;font-size:9px;letter-spacing:.8px;padding:0 20px}
@media(max-width:600px){
.topbar{height:62px;padding:0 12px}.back{width:40px;height:40px;font-size:24px}.logo{font-size:16px;letter-spacing:5px}.demo{font-size:8px}
.main{padding:55px 16px 100px}.card{min-height:455px;border-radius:22px;padding:34px 20px 28px}
.icon{width:88px;height:88px;border-radius:25px;font-size:26px}h1{font-size:29px}.desc{font-size:12px;max-width:330px}.footer{bottom:22px;font-size:8px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<button class="back" onclick="history.back()" aria-label="Back">‹</button>
<div class="logo">N + PLAY</div>
<div class="demo">DEMO PLATFORM</div>
</header>
<main class="main">
<section class="card">
<div class="icon">N+</div>
<div class="game-name">AMERICAN ROULETTE</div>
<h1>Coming Soon</h1>
<div class="gold-line"></div>
<p class="desc">American Roulette experience is currently under development. We are preparing the next premium N+ PLAY version.</p>
<div class="status"><span class="status-dot"></span>COMING SOON</div>
<button class="back-home" onclick="window.location.href='index.html'">BACK TO N+ PLAY</button>
</section>
</main>
<div class="footer">N+ PLAY · VIRTUAL-CREDIT DEMO EXPERIENCE · 18+</div>
</div>
</body>
</html>
