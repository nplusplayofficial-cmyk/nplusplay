<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N+ PLAY - Premium WinGo</title>
    <style>
        /* ==========================================
           1. CSS VARIABLES & PREMIUM THEME
           ========================================== */
        :root {
            --bg-deep: #0a0f1c;
            --bg-panel: #1a202c;
            --bg-overlay: rgba(10, 15, 28, 0.85);
            
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.2);
            --gold-glow: rgba(255, 215, 0, 0.4);
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            --green: #10b981;
            --violet: #8b5cf6;
            --red: #ef4444;
            --blue: #3b82f6;
            
            --border-rad: 12px;
            --shadow-card: 0 4px 15px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* App container handles scroll */
        }

        /* Mobile-First App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-deep);
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .app-container::-webkit-scrollbar { display: none; }

        /* ==========================================
           2. HEADER & WALLET
           ========================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--gold-dim);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-icon { font-size: 20px; color: var(--text-muted); cursor: pointer; }
        .header-title { font-size: 18px; font-weight: 900; color: var(--gold); letter-spacing: 1px; }
        .header-right { display: flex; gap: 12px; }

        .wallet-card {
            background: linear-gradient(135deg, #1e293b, var(--bg-panel));
            margin: 16px;
            border-radius: var(--border-rad);
            padding: 20px;
            border: 1px solid var(--gold-dim);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .balance-val { font-size: 28px; font-weight: 900; color: var(--text-main); }
        .balance-lbl { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .wallet-btns { display: flex; width: 100%; gap: 12px; }
        .w-btn {
            flex: 1; padding: 12px 0; border-radius: 20px; font-weight: 800; font-size: 14px;
            border: none; cursor: pointer; transition: transform 0.1s; text-align: center;
        }
        .w-btn:active { transform: scale(0.96); }
        .btn-withdraw { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-deposit { background: var(--gold); color: #000; box-shadow: 0 4px 10px var(--gold-glow); }

        /* ==========================================
           3. MODE TABS & TIMER BOX
           ========================================== */
        .mode-tabs {
            display: flex;
            background: var(--bg-panel);
            margin: 0 16px;
            border-radius: var(--border-rad) var(--border-rad) 0 0;
            padding: 6px;
        }
        .m-tab {
            flex: 1; text-align: center; padding: 10px 0; font-size: 12px; font-weight: 700;
            color: var(--text-muted); cursor: pointer; border-radius: 8px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .m-tab.active { background: rgba(255, 215, 0, 0.1); color: var(--gold); }

        .timer-box {
            display: flex;
            justify-content: space-between;
            background: var(--bg-panel);
            margin: 0 16px;
            padding: 16px;
            border-radius: 0 0 var(--border-rad) var(--border-rad);
            border-top: 1px solid rgba(255,255,255,0.05);
            box-shadow: var(--shadow-card);
        }
        
        .timer-left, .timer-right { display: flex; flex-direction: column; gap: 8px; }
        .timer-right { align-items: flex-end; }
        
        .timer-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .btn-how { border: 1px solid var(--gold); color: var(--gold); background: transparent; padding: 2px 8px; border-radius: 10px; font-size: 10px; cursor: pointer; }
        
        .recent-circles { display: flex; gap: 6px; }
        .r-circle { width: 16px; height: 16px; border-radius: 50%; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .c-red { background-color: var(--red); }
        .c-green { background-color: var(--green); }
        .c-violet { background-color: var(--violet); }
        
        .period-id { font-size: 16px; font-weight: 800; font-family: monospace; }
        
        .clock-display { display: flex; gap: 4px; align-items: center; font-size: 20px; font-weight: 900; }
        .clock-box { background: #0a0f1c; color: var(--gold); padding: 4px 6px; border-radius: 4px; border: 1px solid var(--gold-dim); min-width: 22px; text-align: center; }

        /* ==========================================
           4. AI PREDICTOR
           ========================================== */
        .ai-box {
            margin: 16px; padding: 12px 16px;
            background: linear-gradient(90deg, rgba(20, 30, 48, 0.8), rgba(26, 32, 44, 0.9));
            border-radius: var(--border-rad);
            border: 1px solid rgba(139, 92, 246, 0.4);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
        }
        .ai-lbl { font-size: 12px; font-weight: 800; color: #c4b5fd; display: flex; align-items: center; gap: 6px;}
        .ai-res { font-size: 14px; font-weight: 900; }

        /* ==========================================
           5. ACTION GRID & LOCK OVERLAY
           ========================================== */
        .action-wrapper {
            position: relative;
            margin: 0 16px;
        }

        .action-grid {
            background: var(--bg-panel);
            border-radius: var(--border-rad);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-card);
        }

        .lock-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 28, 0.85); backdrop-filter: blur(4px);
            border-radius: var(--border-rad); z-index: 50;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .lock-overlay.active { opacity: 1; pointer-events: all; }
        .lock-msg { font-size: 32px; font-weight: 900; color: var(--red); letter-spacing: 2px; text-shadow: 0 0 20px var(--red); }

        .row-3 { display: flex; gap: 8px; }
        .btn-act { flex: 1; padding: 14px 0; border: none; border-radius: 8px; color: #fff; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-act:active { transform: scale(0.96); }

        .bg-green { background: var(--green); }
        .bg-violet { background: var(--violet); }
        .bg-red { background: var(--red); }
        .bg-blue { background: var(--blue); }
        .bg-orange { background: var(--gold); color: #000; }

        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .btn-num { aspect-ratio: 1; border: none; border-radius: 50%; font-size: 20px; font-weight: 900; color: #fff; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn-num:active { transform: scale(0.94); }
        
        .grad-0 { background: linear-gradient(135deg, var(--red) 50%, var(--violet) 50%); }
        .grad-5 { background: linear-gradient(135deg, var(--green) 50%, var(--violet) 50%); }

        .quick-mults { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
        .quick-mults::-webkit-scrollbar { display: none; }
        .btn-qm { padding: 8px 12px; background: var(--bg-deep); border: 1px solid var(--border-dim); border-radius: 6px; color: var(--text-muted); font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;}
        .btn-qm.active { border-color: var(--gold); color: var(--gold); }

        /* ==========================================
           6. HISTORY TABS & TABLE
           ========================================== */
        .history-wrapper {
            margin: 16px;
            background: var(--bg-panel);
            border-radius: var(--border-rad);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .h-tabs { display: flex; border-bottom: 1px solid var(--border-dim); }
        .h-tab { flex: 1; text-align: center; padding: 14px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
        .h-tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        .h-content { min-height: 250px; max-height: 350px; overflow-y: auto; }
        .h-content::-webkit-scrollbar { width: 4px; }
        .h-content::-webkit-scrollbar-thumb { background: var(--border-dim); }

        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; }
        th { padding: 12px 8px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-dim); position: sticky; top: 0; background: var(--bg-panel); z-index: 10; }
        td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.02); font-weight: 700; }
        .td-per { color: var(--text-muted); font-family: monospace; }
        .td-num { font-size: 16px; font-weight: 900; }
        
        .c-text-red { color: var(--red); }
        .c-text-green { color: var(--green); }
        .c-text-violet { color: var(--violet); }
        .c-text-gold { color: var(--gold); }

        /* ==========================================
           7. BOTTOM SHEET BETTING MODAL
           ========================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 999;
            opacity: 0; visibility: hidden; transition: all 0.3s;
            display: flex; justify-content: center; align-items: flex-end;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }

        .modal-content {
            width: 100%; max-width: 480px;
            background: var(--bg-panel);
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column;
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }

        .m-header {
            padding: 16px 20px; border-radius: 20px 20px 0 0;
            text-align: center; font-weight: 900; font-size: 16px; color: #fff;
            transition: background 0.3s;
        }

        .m-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .m-row { display: flex; justify-content: space-between; align-items: center; }
        .m-lbl { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        
        .base-btns { display: flex; gap: 8px; }
        .btn-base { padding: 6px 12px; background: var(--bg-deep); border: 1px solid var(--border-dim); border-radius: 6px; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-base.active { border-color: var(--gold); background: rgba(255,215,0,0.1); color: var(--gold); }

        .qty-ctrl { display: flex; align-items: center; gap: 12px; }
        .btn-qty { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--border-dim); color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qty-val { font-size: 16px; font-weight: 900; min-width: 24px; text-align: center; }

        .m-mults { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;}
        .m-mults::-webkit-scrollbar { display: none; }

        .m-footer { display: flex; gap: 12px; padding: 0 20px 20px 20px; }
        .btn-cancel { flex: 1; padding: 14px; background: var(--bg-deep); border: 1px solid var(--border-dim); border-radius: 12px; color: var(--text-muted); font-weight: 800; cursor: pointer; }
        .btn-confirm { flex: 2; padding: 14px; background: var(--gold); border: none; border-radius: 12px; color: #000; font-weight: 900; cursor: pointer; font-size: 15px; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000; padding: 10px 20px; border-radius: 20px;
            font-weight: 800; font-size: 13px; z-index: 2000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; }

    </style>
</head>
<body>

    <div id="toast" class="toast">Message</div>

    <div class="app-container">
        
        <!-- HEADER -->
        <header class="header">
            <div class="header-icon">&#10094;</div>
            <div class="header-title">N+ PLAY</div>
            <div class="header-right">
                <div class="header-icon">🔊</div>
                <div class="header-icon" onclick="showToast('Refreshed')">🔄</div>
            </div>
        </header>

        <!-- WALLET CARD -->
        <div class="wallet-card">
            <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                <span class="balance-lbl">Available Balance</span>
                <span class="balance-val" id="balanceDisplay">₹ 50,000.00</span>
            </div>
            <div class="wallet-btns">
                <button class="w-btn btn-withdraw" onclick="showToast('Withdraw clicked')">Withdraw</button>
                <button class="w-btn btn-deposit" onclick="showToast('Deposit clicked')">Deposit</button>
            </div>
        </div>

        <!-- MODE TABS -->
        <div class="mode-tabs">
            <div class="m-tab active" data-mode="30">
                <span>⏱️</span><span>30s</span>
            </div>
            <div class="m-tab" data-mode="60">
                <span>⏱️</span><span>1 Min</span>
            </div>
            <div class="m-tab" data-mode="180">
                <span>⏱️</span><span>3 Min</span>
            </div>
            <div class="m-tab" data-mode="300">
                <span>⏱️</span><span>5 Min</span>
            </div>
        </div>

        <!-- TIMER & RECENT BOX -->
        <div class="timer-box">
            <div class="timer-left">
                <button class="btn-how">📖 How to play</button>
                <div class="recent-circles" id="recentCircles">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div class="timer-right">
                <span class="timer-lbl">Time remaining</span>
                <div class="clock-display" id="clockDisplay">
                    <div class="clock-box" id="m1">0</div>
                    <div class="clock-box" id="m2">0</div>
                    <span style="color:var(--gold); font-weight:bold;">:</span>
                    <div class="clock-box" id="s1">3</div>
                    <div class="clock-box" id="s2">0</div>
                </div>
                <span class="period-id" id="periodDisplay">Loading...</span>
            </div>
        </div>

        <!-- AI PREDICTOR -->
        <div class="ai-box">
            <div class="ai-lbl">🤖 AI Prediction</div>
            <div class="ai-res" id="aiDisplay">
                <div class="r-circle" id="aiDot" style="background:var(--green);"></div>
                <span id="aiText" style="color:var(--green);">Green Big</span>
            </div>
        </div>

        <!-- ACTION GRID -->
        <div class="action-wrapper">
            <div class="lock-overlay" id="lockOverlay">
                <div class="lock-msg">🔒 LOCKED</div>
            </div>
            
            <div class="action-grid">
                <!-- Row 1: Colors -->
                <div class="row-3">
                    <button class="btn-act bg-green" onclick="openModal('Color', 'Green')">Join Green</button>
                    <button class="btn-act bg-violet" onclick="openModal('Color', 'Violet')">Join Violet</button>
                    <button class="btn-act bg-red" onclick="openModal('Color', 'Red')">Join Red</button>
                </div>

                <!-- Row 2 & 3: Numbers -->
                <div class="num-grid">
                    <button class="btn-num grad-0" onclick="openModal('Number', 0)">0</button>
                    <button class="btn-num bg-green" onclick="openModal('Number', 1)">1</button>
                    <button class="btn-num bg-red" onclick="openModal('Number', 2)">2</button>
                    <button class="btn-num bg-green" onclick="openModal('Number', 3)">3</button>
                    <button class="btn-num bg-red" onclick="openModal('Number', 4)">4</button>
                    <button class="btn-num grad-5" onclick="openModal('Number', 5)">5</button>
                    <button class="btn-num bg-red" onclick="openModal('Number', 6)">6</button>
                    <button class="btn-num bg-green" onclick="openModal('Number', 7)">7</button>
                    <button class="btn-num bg-red" onclick="openModal('Number', 8)">8</button>
                    <button class="btn-num bg-green" onclick="openModal('Number', 9)">9</button>
                </div>

                <!-- Row 4: Quick Multipliers -->
                <div class="quick-mults">
                    <button class="btn-qm" onclick="openModal('Random', null)">Random</button>
                    <button class="btn-qm active" onclick="setQuickMult(1, this)">X1</button>
                    <button class="btn-qm" onclick="setQuickMult(5, this)">X5</button>
                    <button class="btn-qm" onclick="setQuickMult(10, this)">X10</button>
                    <button class="btn-qm" onclick="setQuickMult(20, this)">X20</button>
                    <button class="btn-qm" onclick="setQuickMult(50, this)">X50</button>
                    <button class="btn-qm" onclick="setQuickMult(100, this)">X100</button>
                </div>

                <!-- Row 5: Size -->
                <div class="row-3">
                    <button class="btn-act bg-orange" onclick="openModal('Size', 'Big')">Big (5-9)</button>
                    <button class="btn-act bg-blue" onclick="openModal('Size', 'Small')">Small (0-4)</button>
                </div>
            </div>
        </div>

        <!-- HISTORY AREA -->
        <div class="history-wrapper">
            <div class="h-tabs">
                <div class="h-tab active" data-tab="game">Game history</div>
                <div class="h-tab" data-tab="chart">Chart</div>
                <div class="h-tab" data-tab="my">My history</div>
            </div>
            <div class="h-content" id="historyContent">
                <!-- Populated by JS -->
            </div>
        </div>

    </div>

    <!-- BOTTOM SHEET BETTING MODAL -->
    <div class="modal-overlay" id="betModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="m-header" id="modalHeader">
                WinGo 30s | Select Green
            </div>
            <div class="m-body">
                <div class="m-row">
                    <span class="m-lbl">Balance</span>
                    <div class="base-btns">
                        <button class="btn-base active" onclick="setBase(1, this)">1</button>
                        <button class="btn-base" onclick="setBase(10, this)">10</button>
                        <button class="btn-base" onclick="setBase(100, this)">100</button>
                        <button class="btn-base" onclick="setBase(1000, this)">1000</button>
                    </div>
                </div>
                <div class="m-row">
                    <span class="m-lbl">Quantity</span>
                    <div class="qty-ctrl">
                        <button class="btn-qty" onclick="adjQty(-1)">-</button>
                        <span class="qty-val" id="qtyVal">1</span>
                        <button class="btn-qty" onclick="adjQty(1)">+</button>
                    </div>
                </div>
                <div class="m-row" style="flex-direction: column; align-items: flex-end; gap: 8px;">
                    <div class="m-mults">
                        <button class="btn-base active" onclick="setModalMult(1, this)">X1</button>
                        <button class="btn-base" onclick="setModalMult(5, this)">X5</button>
                        <button class="btn-base" onclick="setModalMult(10, this)">X10</button>
                        <button class="btn-base" onclick="setModalMult(20, this)">X20</button>
                        <button class="btn-base" onclick="setModalMult(50, this)">X50</button>
                        <button class="btn-base" onclick="setModalMult(100, this)">X100</button>
                    </div>
                </div>
            </div>
            <div class="m-footer">
                <button class="btn-cancel" onclick="closeModalForce()">Cancel</button>
                <button class="btn-confirm" id="btnConfirm" onclick="confirmBet()">Total amount ₹1</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        /* --- STATE & VARIABLES --- */
        let balance = 50000.00;
        let currentMode = 30; 
        let activeTab = 'game'; // game, chart, my
        
        let quickMult = 1;
        let modalState = { type: null, value: null, base: 1, qty: 1, mult: 1 };
        let isLocked = false;

        // Data Storage per mode
        const data = {
            30: { history: [], myBets: [], ai: { color: '', size: '', num: 0 }, seq: 0 },
            60: { history: [], myBets: [], ai: { color: '', size: '', num: 0 }, seq: 0 },
            180: { history: [], myBets: [], ai: { color: '', size: '', num: 0 }, seq: 0 },
            300: { history: [], myBets: [], ai: { color: '', size: '', num: 0 }, seq: 0 }
        };

        // DOM Cache
        const els = {
            bal: document.getElementById('balanceDisplay'),
            mTabs: document.querySelectorAll('.m-tab'),
            hTabs: document.querySelectorAll('.h-tab'),
            hContent: document.getElementById('historyContent'),
            period: document.getElementById('periodDisplay'),
            m1: document.getElementById('m1'), m2: document.getElementById('m2'),
            s1: document.getElementById('s1'), s2: document.getElementById('s2'),
            recent: document.getElementById('recentCircles'),
            lockOver: document.getElementById('lockOverlay'),
            aiText: document.getElementById('aiText'),
            aiDot: document.getElementById('aiDot'),
            modal: document.getElementById('betModal'),
            mHeader: document.getElementById('modalHeader'),
            qtyVal: document.getElementById('qtyVal'),
            btnConfirm: document.getElementById('btnConfirm'),
            toast: document.getElementById('toast'),
            qMults: document.querySelectorAll('.btn-qm')
        };

        /* --- INITIALIZATION --- */
        function init() {
            // Seed initial dummy history
            [30, 60, 180, 300].forEach(m => {
                for(let i=0; i<20; i++) {
                    let n = Math.floor(Math.random() * 10);
                    data[m].history.push(getProps(n));
                }
                generateAI(m);
            });
            updateBalance();
            tick();
            setInterval(tick, 1000);
            renderHistory();
            renderRecent();
        }

        /* --- GAME ENGINE (24/7 OS SYNC) --- */
        function tick() {
            const now = new Date();
            const midnight = new Date(now).setHours(0,0,0,0);
            const elapsed = Math.floor((now.getTime() - midnight) / 1000);

            [30, 60, 180, 300].forEach(m => {
                const periodIdx = Math.floor(elapsed / m) + 1;
                const remaining = m - (elapsed % m);

                // Resolution trigger (New Round)
                if (data[m].seq !== 0 && data[m].seq !== periodIdx) {
                    resolveRound(m, getPeriodString(now, m, data[m].seq));
                }
                data[m].seq = periodIdx;

                if (m === currentMode) {
                    updateClockUI(remaining);
                    els.period.innerText = getPeriodString(now, m, periodIdx);
                    
                    // Lock Logic
                    if (remaining <= 5 && !isLocked) {
                        isLocked = true;
                        els.lockOver.classList.add('active');
                        closeModalForce();
                    } else if (remaining > 5 && isLocked) {
                        isLocked = false;
                        els.lockOver.classList.remove('active');
                    }
                }
            });
        }

        function getPeriodString(date, mode, seq) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            let mPrefix = mode===30?1 : mode===60?2 : mode===180?3 : 4;
            return `${yyyy}${mm}${dd}${mPrefix}${String(seq).padStart(4, '0')}`;
        }

        function updateClockUI(sec) {
            const min = Math.floor(sec / 60);
            const s = sec % 60;
            const mStr = String(min).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');
            els.m1.innerText = mStr[0]; els.m2.innerText = mStr[1];
            els.s1.innerText = sStr[0]; els.s2.innerText = sStr[1];
        }

        /* --- ROUND RESOLUTION & AI (5% WIN RATE) --- */
        function getProps(num) {
            let color = 'Red', colorCode = 'var(--red)', size = num >= 5 ? 'Big' : 'Small';
            if (num === 0) { color = 'Red/Violet'; colorCode = 'var(--red)'; }
            else if (num === 5) { color = 'Green/Violet'; colorCode = 'var(--green)'; }
            else if ([1,3,7,9].includes(num)) { color = 'Green'; colorCode = 'var(--green)'; }
            return { num, color, colorCode, size };
        }

        function generateAI(mode) {
            const n = Math.floor(Math.random() * 10);
            const p = getProps(n);
            data[mode].ai = { num: n, color: p.color.split('/')[0], size: p.size, colorCode: p.colorCode };
            if(mode === currentMode) updateAIUI();
        }

        function updateAIUI() {
            const ai = data[currentMode].ai;
            els.aiText.innerText = `${ai.color} ${ai.size}`;
            els.aiText.style.color = ai.colorCode;
            els.aiDot.style.background = ai.colorCode;
            if(ai.num === 0 || ai.num === 5) els.aiDot.style.background = 'var(--violet)';
        }

        function resolveRound(mode, periodId) {
            const ai = data[mode].ai;
            let resultNum;

            // 5% AI Accuracy
            if (Math.random() <= 0.05) {
                resultNum = ai.num;
            } else {
                do { resultNum = Math.floor(Math.random() * 10); } while (resultNum === ai.num);
            }

            const p = getProps(resultNum);

            // Resolve Bets
            data[mode].myBets.forEach(bet => {
                if (bet.period === periodId && bet.status === 'Pending') {
                    let win = false;
                    let payout = 0;

                    if (bet.type === 'Color') {
                        if (p.color.includes(bet.value)) {
                            win = true;
                            payout = bet.amount * (bet.value === 'Violet' ? 4.5 : (resultNum===0||resultNum===5 ? 1.5 : 2));
                        }
                    } else if (bet.type === 'Number' && parseInt(bet.value) === resultNum) {
                        win = true; payout = bet.amount * 9;
                    } else if (bet.type === 'Size' && bet.value === p.size) {
                        win = true; payout = bet.amount * 2;
                    }

                    if (win) {
                        bet.status = 'Win';
                        bet.payout = payout;
                        balance += payout;
                    } else {
                        bet.status = 'Loss';
                        bet.payout = 0;
                    }
                }
            });

            updateBalance();

            // Add History
            data[mode].history.unshift(p);
            if(data[mode].history.length > 50) data[mode].history.pop();

            generateAI(mode);

            if (mode === currentMode) {
                renderHistory();
                renderRecent();
            }
        }

        /* --- UI INTERACTIONS --- */
        els.mTabs.forEach(tab => tab.addEventListener('click', function() {
            els.mTabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentMode = parseInt(this.getAttribute('data-mode'));
            tick();
            updateAIUI();
            renderHistory();
            renderRecent();
        }));

        els.hTabs.forEach(tab => tab.addEventListener('click', function() {
            els.hTabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            activeTab = this.getAttribute('data-tab');
            renderHistory();
        }));

        function setQuickMult(val, btn) {
            quickMult = val;
            els.qMults.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function updateBalance() {
            els.bal.innerText = `₹ ${balance.toLocaleString('en-IN', {minimumFractionDigits:2})}`;
        }

        function showToast(msg) {
            els.toast.innerText = msg;
            els.toast.classList.add('show');
            setTimeout(() => els.toast.classList.remove('show'), 2000);
        }

        /* --- RENDERING --- */
        function renderRecent() {
            const h = data[currentMode].history.slice(0, 5);
            els.recent.innerHTML = h.map(i => {
                let cls = 'c-red';
                if(i.color.includes('Green')) cls = 'c-green';
                if(i.num===0 || i.num===5) cls = 'c-violet';
                return `<span class="r-circle ${cls}"></span>`;
            }).join('');
        }

        function renderHistory() {
            const h = data[currentMode].history;
            const mb = data[currentMode].myBets;
            let html = '';

            if (activeTab === 'game') {
                html = `<table><thead><tr><th>Period</th><th>Number</th><th>Size</th><th>Color</th></tr></thead><tbody>`;
                h.slice(0, 20).forEach((i, idx) => {
                    let dotCls = i.color.includes('Green') ? 'c-text-green' : 'c-text-red';
                    if(i.num===0 || i.num===5) dotCls = 'c-text-violet';
                    html += `<tr><td class="td-per">***${String(100-idx).padStart(3,'0')}</td>
                    <td class="td-num ${dotCls}">${i.num}</td>
                    <td style="font-weight:600">${i.size}</td>
                    <td><div class="r-circle" style="background:${i.colorCode}; display:inline-block; vertical-align:middle;"></div></td></tr>`;
                });
                html += `</tbody></table>`;
            } 
            else if (activeTab === 'chart') {
                html = `<div style="padding: 20px; text-align: center; color: var(--text-grey); font-weight:600;">Chart tracking active...</div>`;
            } 
            else if (activeTab === 'my') {
                if (mb.length === 0) html = `<div class="empty-msg">No data available</div>`;
                else {
                    html = `<table><thead><tr><th>Period</th><th>Select</th><th>Status</th><th>Amount</th></tr></thead><tbody>`;
                    mb.forEach(b => {
                        let sCls = b.status === 'Win' ? 'status-win' : (b.status==='Loss' ? 'status-loss' : 'status-pending');
                        html += `<tr><td class="td-per">${b.period.slice(-5)}</td>
                        <td style="font-weight:800">${b.value}</td>
                        <td class="${sCls}">${b.status}</td>
                        <td class="${sCls}">₹${b.status==='Win' ? b.payout : b.amount}</td></tr>`;
                    });
                    html += `</tbody></table>`;
                }
            }
            els.hContent.innerHTML = html;
        }

        /* --- BOTTOM SHEET MODAL LOGIC --- */
        function openModal(type, value) {
            if (isLocked) { showToast("Betting Locked!"); return; }
            
            if (type === 'Random') {
                type = 'Number';
                value = Math.floor(Math.random() * 10);
            }

            modalState = { type, value, base: 1, qty: 1, mult: quickMult };
            
            // Header Color Setup
            let bg = 'var(--bg-panel)';
            if (type === 'Color') {
                if(value==='Green') bg = 'var(--green)';
                if(value==='Red') bg = 'var(--red)';
                if(value==='Violet') bg = 'var(--violet)';
            } else if (type === 'Number') {
                if([1,3,7,9].includes(value)) bg = 'var(--green)';
                else if([2,4,6,8].includes(value)) bg = 'var(--red)';
                else bg = 'var(--violet)';
            } else if (type === 'Size') {
                bg = value==='Big' ? 'var(--gold)' : 'var(--blue)';
            }

            els.mHeader.style.background = bg;
            let titleMode = currentMode===30?'30s':currentMode===60?'1Min':currentMode===180?'3Min':'5Min';
            els.mHeader.innerText = `WinGo ${titleMode} | Select ${value}`;

            resetModalUI();
            els.modal.classList.add('open');
        }

        function closeModal(e) {
            if (e.target === els.modal) closeModalForce();
        }
        function closeModalForce() { els.modal.classList.remove('open'); }

        function setBase(val, btn) {
            modalState.base = val;
            document.querySelectorAll('.base-btns .btn-base').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateModalTotal();
        }

        function adjQty(delta) {
            if (modalState.qty + delta >= 1) {
                modalState.qty += delta;
                els.qtyVal.innerText = modalState.qty;
                updateModalTotal();
            }
        }

        function setModalMult(val, btn) {
            modalState.mult = val;
            document.querySelectorAll('.m-mults .btn-base').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateModalTotal();
        }

        function updateModalTotal() {
            const total = modalState.base * modalState.qty * modalState.mult;
            els.btnConfirm.innerText = `Total amount ₹${total}`;
        }

        function resetModalUI() {
            document.querySelectorAll('.base-btns .btn-base').forEach((b,i) => i===0 ? b.classList.add('active') : b.classList.remove('active'));
            els.qtyVal.innerText = '1';
            
            document.querySelectorAll('.m-mults .btn-base').forEach(b => {
                if (parseInt(b.innerText.replace('X','')) === quickMult) b.classList.add('active');
                else b.classList.remove('active');
            });
            updateModalTotal();
        }

        function confirmBet() {
            const total = modalState.base * modalState.qty * modalState.mult;
            if (balance < total) {
                showToast("Insufficient Balance!");
                return;
            }

            balance -= total;
            updateBalanceUI();

            const s = data[currentMode];
            s.myBets.unshift({
                period: s.currentPeriod,
                type: modalState.type,
                value: modalState.value,
                amount: total,
                status: 'Pending'
            });

            closeModalForce();
            showToast("Bet successful");
            if(activeTab === 'my') renderHistory();
        }

        // Boot
        init();

    </script>
</body>
</html>
