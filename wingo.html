<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WINGO – N+ PLAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        /* Only WINGO-specific rules not covered by design system */
        .game-container { max-width: 560px; margin: 0 auto; }

        .round-timer { 
            font-size: 2.8rem; font-weight: 900; color: var(--gold-hi); 
            text-shadow: 0 0 30px rgba(245,197,24,.3); 
            font-variant-numeric: tabular-nums; 
        }
        .number-pad { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin: 12px 0; }
        .num-btn { 
            aspect-ratio:1; border-radius: 14px; background: rgba(255,255,255,.06); 
            border:1px solid var(--line); font-size:1.3rem; font-weight:900; color:#fff; 
            cursor:pointer; transition:.25s var(--ease); 
        }
        .num-btn:hover { border-color: var(--gold); background: rgba(245,197,24,.08); }
        .num-btn.selected { border-color: var(--gold); background: rgba(245,197,24,.15); box-shadow:0 0 20px rgba(245,197,24,.25); }

        .color-btn { 
            padding: 14px; border-radius: 12px; font-weight: 800; 
            border:1px solid transparent; transition:.25s var(--ease);
        }
        .color-red { background: linear-gradient(145deg,#3a0d0d,#1a0404); border-color:#7a2020; color:#ff7777; }
        .color-green { background: linear-gradient(145deg,#0d3a2a,#041a0f); border-color:#207a4d; color:#77ffa8; }
        .color-violet { background: linear-gradient(145deg,#2a0d3a,#1a041f); border-color:#6d207a; color:#d477ff; }

        .big-small-btn { background: rgba(255,255,255,.04); border:1px solid var(--line); color:#ccc; }
        .big-small-btn.selected { border-color: var(--gold); background: rgba(245,197,24,.15); }

        .bet-popup { position:fixed; inset:0; z-index:500; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.75); backdrop-filter:blur(8px); }
        .bet-popup.active { display:flex; }
        .bet-sheet { 
            width:100%; max-width:500px; background:linear-gradient(180deg,#111,#0a0a0a); 
            border-radius:24px 24px 0 0; border-top:1px solid rgba(245,197,24,.2); 
            padding:22px; animation:slideUp .3s var(--ease); 
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

        .info-tabs { display:flex; border-bottom:1px solid var(--line); margin-top: 16px; }
        .info-tabs button { flex:1; padding:10px 0; background:none; border:none; color:var(--muted); font-weight:600; font-size:.75rem; cursor:pointer; border-bottom:2px solid transparent; }
        .info-tabs button.active { color:var(--gold); border-bottom-color:var(--gold); }

        .tab-content { padding:12px 0; max-height: 300px; overflow-y:auto; }

        .result-reveal { text-align:center; padding:20px; border-radius:16px; background:rgba(245,197,24,.05); border:1px solid var(--line-gold); margin:12px 0; }
        .result-number { font-size:3.5rem; font-weight:900; color:var(--gold-hi); }

        /* Additional small tweaks */
        .bet-row { display:flex; gap:8px; margin:8px 0; }
        .bet-row input[type="number"] { flex:1; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px; color:#fff; font-weight:700; }
        .multiplier-btn { padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; }
        .multiplier-btn.active { border-color:var(--gold); color:var(--gold); background:rgba(245,197,24,.08); }

        /* Override design-system .header for game page if needed */
        .game-page .header { margin-bottom: 0; }
    </style>
</head>
<body>

<!-- ===== HEADER (same as index) ===== -->
<header class="header">
    <a href="index.html" class="brand" aria-label="N+ PLAY home">
        <span class="brand-mark">N+</span>
        <span class="brand-name gold-text">PLAY</span>
    </a>
    <div class="header-right">
        <div class="wallet"><span class="wallet-dot"></span><span class="wallet-value" id="walletBalanceHeader">₹1,000</span></div>
        <span class="age">18+</span>
    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="page game-page">
    <div class="game-container">

        <!-- Back button and title -->
        <div style="display:flex; align-items:center; gap:12px; margin:10px 0 4px;">
            <button onclick="history.back()" style="background:transparent; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer;">←</button>
            <h1 class="gold-text" style="font-size:1.4rem; font-weight:900;">WINGO</h1>
            <span style="margin-left:auto; font-size:.7rem; color:var(--muted);">Period <span id="periodId">---</span></span>
        </div>

        <!-- Timer -->
        <div style="text-align:center; margin:10px 0 16px;">
            <div class="round-timer" id="timerDisplay">--:--</div>
            <div style="font-size:.7rem; color:var(--muted);">Betting closes 3s before round end</div>
        </div>

        <!-- Betting closed message -->
        <div id="bettingClosed" style="display:none; text-align:center; padding:8px; background:rgba(255,82,96,.1); border:1px solid rgba(255,82,96,.3); border-radius:8px; margin-bottom:12px; color:var(--red); font-weight:700;">
            ⛔ Betting Closed
        </div>

        <!-- Duration selector -->
        <div style="display:flex; gap:6px; margin-bottom:12px;">
            <button class="duration-btn active" data-dur="30" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;">30s</button>
            <button class="duration-btn" data-dur="60" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;">1m</button>
            <button class="duration-btn" data-dur="180" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;">3m</button>
            <button class="duration-btn" data-dur="300" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer;">5m</button>
        </div>

        <!-- Number grid -->
        <div class="number-pad" id="numberPad">
            <!-- Numbers 0-9 filled by JS -->
        </div>

        <!-- Color & Big/Small selections -->
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px;">
            <button class="color-btn color-red" data-color="red">Red</button>
            <button class="color-btn color-green" data-color="green">Green</button>
            <button class="color-btn color-violet" data-color="violet">Violet</button>
        </div>
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px;">
            <button class="big-small-btn" data-size="big">Big</button>
            <button class="big-small-btn" data-size="small">Small</button>
        </div>

        <!-- Info tabs -->
        <div class="info-tabs">
            <button class="active" data-tab="history">History</button>
            <button data-tab="mybets">My Bets</button>
            <button data-tab="chart">Chart</button>
            <button data-tab="strategy">Strategy</button>
        </div>
        <div class="tab-content" id="tabContent">
            <!-- Dynamic content -->
        </div>
    </div>
</main>

<!-- ===== BET POPUP ===== -->
<div class="bet-popup" id="betPopup">
    <div class="bet-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="gold-text" style="font-weight:900;">Bet Slip</span>
            <button onclick="closeBetPopup()" style="background:none; border:none; color:var(--muted); font-size:1.3rem; cursor:pointer;">✕</button>
        </div>
        <div id="selectedBetDisplay" style="margin:10px 0; font-size:1.1rem; color:var(--gold-hi);"></div>
        <div class="bet-row">
            <label style="font-size:.8rem; color:var(--muted);">Amount</label>
            <input type="number" id="betAmount" value="1" min="0.1" step="0.1">
        </div>
        <div class="bet-row">
            <label style="font-size:.8rem; color:var(--muted);">Quantity</label>
            <button class="qty-btn" id="qtyMinus" style="padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:transparent; color:#fff;">−</button>
            <span id="qtyDisplay" style="padding:0 10px;">1</span>
            <button class="qty-btn" id="qtyPlus" style="padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:transparent; color:#fff;">+</button>
        </div>
        <div class="bet-row">
            <label style="font-size:.8rem; color:var(--muted);">Multiplier</label>
            <button class="multiplier-btn active" data-mult="1">x1</button>
            <button class="multiplier-btn" data-mult="5">x5</button>
            <button class="multiplier-btn" data-mult="10">x10</button>
            <button class="multiplier-btn" data-mult="20">x20</button>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button id="cancelBet" class="secondary" style="flex:1;">Cancel</button>
            <button id="confirmBet" class="primary" style="flex:1;">Place Bet</button>
        </div>
        <div id="betError" style="color:var(--red); font-size:.8rem; margin-top:6px; display:none;">Insufficient balance</div>
    </div>
</div>

<!-- ===== BOTTOM NAV (same as index) ===== -->
<nav class="bottom-nav" aria-label="Primary navigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">⌂</span><span>Home</span></a>
    <a href="activity.html" class="nav-item"><span class="nav-icon">◷</span><span>Activity</span></a>
    <a href="bonus.html" class="nav-item"><span class="nav-icon">✦</span><span>Bonus</span></a>
    <a href="promotion.html" class="nav-item"><span class="nav-icon">◇</span><span>Promotion</span></a>
    <a href="account.html" class="nav-item"><span class="nav-icon">◯</span><span>Account</span></a>
</nav>

<script>
// ===========================
// WINGO GAME ENGINE (demo)
// ===========================
(function(){
    // ---------- Shared constants ----------
    const BALANCE_KEY = 'nplus_wallet_balance'; // sync with wallet page
    const DURATIONS = {30: '30s', 60: '1m', 180: '3m', 300: '5m'};
    const BET_CLOSE_MS = 3000;
    const HOUSE_EDGE = 0.985;

    // ---------- State ----------
    let balance = parseFloat(localStorage.getItem(BALANCE_KEY) || '1000');
    let currentDuration = 30;
    let periodId = '';
    let roundStartMs = 0;
    let selected = { numbers: [], colors: [], size: null };
    let betQuantity = 1;
    let betMultiplier = 1;
    let roundBetPlaced = false;
    let roundBetAmount = 0;
    let roundHistory = [];
    let myBets = [];

    // DOM elements
    const balanceHeaderEl = document.getElementById('walletBalanceHeader');
    const timerDisplay = document.getElementById('timerDisplay');
    const periodIdEl = document.getElementById('periodId');
    const bettingClosedEl = document.getElementById('bettingClosed');
    const numberPadEl = document.getElementById('numberPad');
    const betPopup = document.getElementById('betPopup');
    const selectedBetDisplay = document.getElementById('selectedBetDisplay');
    const betAmountInput = document.getElementById('betAmount');
    const qtyDisplay = document.getElementById('qtyDisplay');
    const betError = document.getElementById('betError');
    const tabContent = document.getElementById('tabContent');

    // ---------- Utility functions ----------
    function pad(n){ return n < 10 ? '0'+n : ''+n; }
    function updateBalanceUI(){ balanceHeaderEl.textContent = '₹' + balance.toFixed(2); }
    function saveBalance(){ localStorage.setItem(BALANCE_KEY, String(balance)); }

    function getPeriodId(ms){
        const d = new Date(ms);
        const y = d.getFullYear();
        const m = pad(d.getMonth()+1);
        const day = pad(d.getDate());
        const midnight = new Date(y, d.getMonth(), d.getDate()).getTime();
        const secondsSinceMidnight = Math.floor((ms - midnight) / 1000);
        const roundIndex = Math.floor(secondsSinceMidnight / currentDuration) + 1;
        const code = currentDuration === 30 ? '1000' : currentDuration === 60 ? '2000' : currentDuration === 180 ? '3000' : '4000';
        return `${y}${m}${day}${code}${String(roundIndex).padStart(5,'0')}`;
    }

    function getRoundStart(ms = Date.now()){
        return Math.floor(ms / (currentDuration*1000)) * currentDuration*1000;
    }

    function getRemainingMs(){
        const start = getRoundStart();
        return (start + currentDuration*1000) - Date.now();
    }

    // ---------- Deterministic result (same period same result) ----------
    function hash(str){
        let h = 2166136261;
        for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
        return h >>> 0;
    }
    function getResultForPeriod(startMs){
        const seed = `wingo-${currentDuration}-${startMs}`;
        const num = hash(seed) % 10;
        return { number: num };
    }

    // ---------- Timer loop ----------
    function startTimer(){
        setInterval(()=>{
            const rem = getRemainingMs();
            const totalSec = Math.ceil(rem/1000);
            const mins = Math.floor(totalSec/60);
            const secs = totalSec % 60;
            timerDisplay.textContent = `${pad(mins)}:${pad(secs)}`;
            periodIdEl.textContent = periodId;

            // Lock betting in last 3 seconds
            if(rem <= BET_CLOSE_MS){
                bettingClosedEl.style.display = 'block';
                if(betPopup.classList.contains('active')) closeBetPopup();
            } else {
                bettingClosedEl.style.display = 'none';
            }

            // New round started?
            const currentStart = getRoundStart();
            if(currentStart !== roundStartMs){
                roundStartMs = currentStart;
                periodId = getPeriodId(roundStartMs);
                roundBetPlaced = false;
                roundBetAmount = 0;
                selected = {numbers:[], colors:[], size:null};
                updateSelectionUI();
            }

            // Round ended?
            if(rem <= 0){
                settleRound();
            }
        }, 200);
    }

    function settleRound(){
        const result = getResultForPeriod(roundStartMs);
        const num = result.number;
        const isBig = num >= 5;
        let winAmount = 0;
        let win = false;

        // Check numbers
        selected.numbers.forEach(n=>{
            if(n === num){
                winAmount += betAmountInput.value * betQuantity * betMultiplier * 9 * HOUSE_EDGE;
                win = true;
            }
        });
        // Check colors
        selected.colors.forEach(c=>{
            let match = false;
            if(c === 'red' && (num%2===0 && num!==0 && num!==5)) match=true;
            if(c === 'green' && (num%2===1 && num!==5)) match=true;
            if(c === 'violet' && (num===0 || num===5)) match=true;
            if(match){ winAmount += betAmountInput.value * betQuantity * betMultiplier * (c==='violet'?14:2) * HOUSE_EDGE; win=true; }
        });
        // Check size
        if(selected.size){
            const match = (selected.size === 'big' && isBig) || (selected.size === 'small' && !isBig);
            if(match){ winAmount += betAmountInput.value * betQuantity * betMultiplier * 2 * HOUSE_EDGE; win=true; }
        }

        if(winAmount > 0){
            balance += winAmount;
            saveBalance();
            updateBalanceUI();
            // Add to history and mybets
            roundHistory.unshift({period: periodId, number: num, result: win ? 'win' : 'loss', amount: winAmount});
            myBets.unshift({period: periodId, number: num, bet: selected, stake: betAmountInput.value * betQuantity * betMultiplier, win: win, payout: winAmount});
            if(roundHistory.length > 100) roundHistory.pop();
            if(myBets.length > 100) myBets.pop();
            localStorage.setItem('wingo_history', JSON.stringify(roundHistory));
            localStorage.setItem('wingo_mybets', JSON.stringify(myBets));
            renderHistory();
            renderMyBets();
            showResult(num, winAmount, win);
        } else if(roundBetPlaced){
            // Lost
            roundHistory.unshift({period: periodId, number: num, result: 'loss', amount: -roundBetAmount});
            myBets.unshift({period: periodId, number: num, bet: selected, stake: roundBetAmount, win: false, payout: 0});
            saveBalance();
            updateBalanceUI();
            localStorage.setItem('wingo_history', JSON.stringify(roundHistory));
            localStorage.setItem('wingo_mybets', JSON.stringify(myBets));
            renderHistory();
            renderMyBets();
            showResult(num, 0, false);
        }

        // Reset for next round
        roundBetPlaced = false;
        roundBetAmount = 0;
        selected = {numbers:[], colors:[], size:null};
        updateSelectionUI();
    }

    function showResult(num, amount, win){
        alert(`${win ? '🎉 You Win!' : '😞 You Lose'} Number: ${num} ${win ? '+₹'+amount.toFixed(2) : ''}`);
    }

    // ---------- UI Rendering ----------
    function updateSelectionUI(){
        // Update number pad
        document.querySelectorAll('.num-btn').forEach(btn=>{
            const n = parseInt(btn.dataset.num);
            btn.classList.toggle('selected', selected.numbers.includes(n));
        });
        // Update color buttons
        document.querySelectorAll('.color-btn').forEach(btn=>{
            btn.classList.toggle('selected', selected.colors.includes(btn.dataset.color));
        });
        // Update size buttons
        document.querySelectorAll('.big-small-btn').forEach(btn=>{
            btn.classList.toggle('selected', selected.size === btn.dataset.size);
        });
    }

    function renderNumberPad(){
        let html = '';
        for(let i=0; i<=9; i++){
            html += `<button class="num-btn" data-num="${i}">${i}</button>`;
        }
        numberPadEl.innerHTML = html;
        document.querySelectorAll('.num-btn').forEach(btn=>{
            btn.addEventListener('click', ()=>{
                if(roundBetPlaced || getRemainingMs() <= BET_CLOSE_MS) return;
                const num = parseInt(btn.dataset.num);
                if(selected.numbers.includes(num)){
                    selected.numbers = selected.numbers.filter(n=>n!==num);
                } else {
                    if(selected.numbers.length >= 5){ alert('Max 5 numbers'); return; }
                    selected.numbers.push(num);
                }
                updateSelectionUI();
                openBetPopup();
            });
        });
    }

    function openBetPopup(){
        if(selected.numbers.length===0 && selected.colors.length===0 && !selected.size) return;
        selectedBetDisplay.textContent = `Selected: ${selected.numbers.map(n=>'#'+n).join(' ')} ${selected.colors.join(' ')} ${selected.size||''}`;
        betPopup.classList.add('active');
        updateBetTotal();
    }

    function closeBetPopup(){
        betPopup.classList.remove('active');
    }

    function updateBetTotal(){
        const amount = parseFloat(betAmountInput.value) || 1;
        const total = amount * betQuantity * betMultiplier;
        betError.style.display = total > balance ? 'block' : 'none';
    }

    // ---------- Tab content ----------
    function renderHistory(){
        const history = JSON.parse(localStorage.getItem('wingo_history') || '[]');
        let html = '<table style="width:100%; border-collapse:collapse; font-size:.75rem;">';
        html += '<tr><th>Period</th><th>Number</th><th>Result</th></tr>';
        history.slice(0,20).forEach(h=>{
            html += `<tr><td>${h.period}</td><td>${h.number}</td><td style="color:${h.result==='win'?'var(--green)':'var(--red)'}">${h.result}</td></tr>`;
        });
        html += '</table>';
        tabContent.innerHTML = html;
    }

    function renderMyBets(){
        const bets = JSON.parse(localStorage.getItem('wingo_mybets') || '[]');
        let html = '<table style="width:100%; border-collapse:collapse; font-size:.75rem;">';
        html += '<tr><th>Period</th><th>Number</th><th>Stake</th><th>Win</th></tr>';
        bets.slice(0,20).forEach(b=>{
            html += `<tr><td>${b.period}</td><td>${b.number}</td><td>₹${b.stake.toFixed(2)}</td><td>${b.win?'✅':'❌'}</td></tr>`;
        });
        html += '</table>';
        tabContent.innerHTML = html;
    }

    function renderChart(){
        const history = JSON.parse(localStorage.getItem('wingo_history') || '[]');
        const numbers = history.slice(0,30).map(h=>h.number);
        let html = '<div style="display:flex; gap:4px; align-items:flex-end; height:100px;">';
        numbers.forEach(n=>{
            const height = (n+1)*8;
            html += `<div style="flex:1; background:var(--gold); height:${height}px; border-radius:2px;"></div>`;
        });
        html += '</div>';
        tabContent.innerHTML = html;
    }

    function renderStrategy(){
        tabContent.innerHTML = '<div style="color:var(--muted);">Strategy: Follow the trend. Last 5 numbers: ...</div>';
    }

    // ---------- Tab switching ----------
    document.querySelectorAll('.info-tabs button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            document.querySelectorAll('.info-tabs button').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            const tab = btn.dataset.tab;
            if(tab==='history') renderHistory();
            else if(tab==='mybets') renderMyBets();
            else if(tab==='chart') renderChart();
            else if(tab==='strategy') renderStrategy();
        });
    });

    // ---------- Event listeners ----------
    document.querySelectorAll('.duration-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            document.querySelectorAll('.duration-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            currentDuration = parseInt(btn.dataset.dur);
            roundStartMs = getRoundStart();
            periodId = getPeriodId(roundStartMs);
            periodIdEl.textContent = periodId;
        });
    });

    document.querySelectorAll('.color-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            if(roundBetPlaced || getRemainingMs() <= BET_CLOSE_MS) return;
            const color = btn.dataset.color;
            if(selected.colors.includes(color)){
                selected.colors = selected.colors.filter(c=>c!==color);
            } else {
                if(selected.colors.length >= 2){ alert('Max 2 colors'); return; }
                selected.colors.push(color);
            }
            updateSelectionUI();
            openBetPopup();
        });
    });

    document.querySelectorAll('.big-small-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            if(roundBetPlaced || getRemainingMs() <= BET_CLOSE_MS) return;
            const size = btn.dataset.size;
            selected.size = (selected.size === size) ? null : size;
            updateSelectionUI();
            openBetPopup();
        });
    });

    document.getElementById('qtyMinus').addEventListener('click', ()=>{
        if(betQuantity>1) betQuantity--;
        qtyDisplay.textContent = betQuantity;
        updateBetTotal();
    });
    document.getElementById('qtyPlus').addEventListener('click', ()=>{
        betQuantity++;
        qtyDisplay.textContent = betQuantity;
        updateBetTotal();
    });

    document.querySelectorAll('.multiplier-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            document.querySelectorAll('.multiplier-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            betMultiplier = parseInt(btn.dataset.mult);
            updateBetTotal();
        });
    });

    document.getElementById('cancelBet').addEventListener('click', closeBetPopup);
    document.getElementById('confirmBet').addEventListener('click', ()=>{
        const amount = parseFloat(betAmountInput.value) || 1;
        const total = amount * betQuantity * betMultiplier;
        if(total > balance){
            betError.style.display='block';
            return;
        }
        balance -= total;
        roundBetPlaced = true;
        roundBetAmount = total;
        saveBalance();
        updateBalanceUI();
        closeBetPopup();
    });

    document.getElementById('betAmount').addEventListener('input', updateBetTotal);

    // ---------- Init ----------
    function init(){
        updateBalanceUI();
        renderNumberPad();
        roundStartMs = getRoundStart();
        periodId = getPeriodId(roundStartMs);
        periodIdEl.textContent = periodId;
        updateSelectionUI();
        renderHistory();
        startTimer();
    }

    init();
})();
