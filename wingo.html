<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wingo Color Prediction</title>
    <style>
        /* CSS Variables & Theme Setup */
        :root {
            --bg-main: #171b26;
            --bg-panel: #212836;
            --text-white: #ffffff;
            --text-grey: #94a3b8;
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.2);
            --green-solid: #10b981;
            --green-dark: #0e3c26;
            --violet-solid: #8b5cf6;
            --red-solid: #ef4444;
            --blue-solid: #0ea5e9;
            --border-dim: #334155;
            
            --grad-0: linear-gradient(135deg, #ef4444 50%, #8b5cf6 50%);
            --grad-5: linear-gradient(135deg, #10b981 50%, #8b5cf6 50%);
        }

        /* Reset & Global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Mobile-First App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
            position: relative;
        }

        /* 1. Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--bg-panel);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .back-icon {
            font-size: 20px;
            color: var(--text-grey);
            cursor: pointer;
            padding: 4px;
        }

        .header-logo {
            max-height: 35px;
            object-fit: contain;
        }

        .balance-pill {
            background-color: var(--green-dark);
            color: var(--green-solid);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* 2. Timer Tabs Panel */
        .timer-tabs-panel {
            background-color: var(--bg-panel);
            margin: 4px 12px 0 12px;
            border-radius: 12px;
            display: flex;
            padding: 6px;
            gap: 6px;
        }

        .timer-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .timer-tab .tab-icon {
            font-size: 18px;
            margin-bottom: 2px;
            opacity: 0.6;
        }

        .timer-tab .tab-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-grey);
        }

        .timer-tab.active {
            border-color: var(--gold);
            background-color: rgba(245, 158, 11, 0.05);
            box-shadow: inset 0 0 10px var(--gold-glow);
        }

        .timer-tab.active .tab-icon { opacity: 1; }
        .timer-tab.active .tab-text { color: var(--gold); }

        /* 3. Period & Countdown Box */
        .period-countdown-box {
            background-color: var(--bg-panel);
            margin: 0 12px;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .period-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .period-label {
            font-size: 12px;
            color: var(--text-grey);
            font-weight: 600;
            text-transform: uppercase;
        }

        .period-id {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-white);
        }

        .countdown-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .countdown-label {
            font-size: 12px;
            color: var(--text-grey);
            font-weight: 600;
        }

        .countdown-timer {
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1px;
            font-family: monospace;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        /* 4. Color Action Buttons */
        .color-actions-row {
            display: flex;
            margin: 4px 12px 0 12px;
            gap: 10px;
        }

        .btn-color {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 10px;
            color: var(--text-white);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        
        .btn-color:active { transform: scale(0.96); }

        .btn-join-green { background-color: var(--green-solid); }
        .btn-join-violet { background-color: var(--violet-solid); }
        .btn-join-red { background-color: var(--red-solid); }

        /* 5. Number Grid (0-9) */
        .number-grid-panel {
            background-color: var(--bg-panel);
            margin: 0 12px;
            border-radius: 12px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .btn-num {
            aspect-ratio: 1;
            border: none;
            border-radius: 12px;
            color: var(--text-white);
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn-num:active { transform: scale(0.94); }

        .btn-num.n-1, .btn-num.n-3, .btn-num.n-7, .btn-num.n-9 { background-color: var(--green-solid); }
        .btn-num.n-2, .btn-num.n-4, .btn-num.n-6, .btn-num.n-8 { background-color: var(--red-solid); }
        .btn-num.n-0 { background: var(--grad-0); }
        .btn-num.n-5 { background: var(--grad-5); }

        /* 6. Size Buttons */
        .size-actions-row {
            display: flex;
            margin: 0 12px;
            gap: 10px;
        }

        .btn-size {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 10px;
            color: var(--text-white);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn-size:active { transform: scale(0.96); }

        .btn-big { background-color: var(--gold); }
        .btn-small { background-color: var(--blue-solid); }

        /* 7. History Tabs */
        .history-tabs-panel {
            background-color: var(--bg-panel);
            margin: 8px 12px 0 12px;
            border-radius: 12px;
            display: flex;
            padding: 4px;
        }

        .hist-tab {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-grey);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s;
        }

        .hist-tab.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Top Header -->
        <header class="header">
            <div class="back-icon" onclick="history.back()">&#10094;</div>
            <img src="wingo.png" alt="Wingo" class="header-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span style="display:none; font-weight: 900; font-size: 20px; font-style: italic;">WINGO</span> <!-- Fallback if img missing -->
            <div class="balance-pill">₹ 50,000.00</div>
        </header>

        <!-- Timer Tabs Panel -->
        <div class="timer-tabs-panel" id="modeTabs">
            <div class="timer-tab active" data-mode="30">
                <span class="tab-icon">⚡</span>
                <span class="tab-text">30s</span>
            </div>
            <div class="timer-tab" data-mode="60">
                <span class="tab-icon">⏱️</span>
                <span class="tab-text">1Min</span>
            </div>
            <div class="timer-tab" data-mode="180">
                <span class="tab-icon">⏱️</span>
                <span class="tab-text">3Min</span>
            </div>
            <div class="timer-tab" data-mode="300">
                <span class="tab-icon">⏱️</span>
                <span class="tab-text">5Min</span>
            </div>
        </div>

        <!-- Period & Countdown Box -->
        <div class="period-countdown-box">
            <div class="period-info">
                <span class="period-label" id="periodLabel">WIN GO 30S</span>
                <span class="period-id" id="periodDisplay">Loading...</span>
            </div>
            <div class="countdown-info">
                <span class="countdown-label">Time Remaining</span>
                <span class="countdown-timer" id="countdownDisplay">00:00</span>
            </div>
        </div>

        <!-- Color Action Buttons -->
        <div class="color-actions-row">
            <button class="btn-color btn-join-green">Join Green</button>
            <button class="btn-color btn-join-violet">Join Violet</button>
            <button class="btn-color btn-join-red">Join Red</button>
        </div>

        <!-- Number Grid (0-9) -->
        <div class="number-grid-panel">
            <button class="btn-num n-0">0</button>
            <button class="btn-num n-1">1</button>
            <button class="btn-num n-2">2</button>
            <button class="btn-num n-3">3</button>
            <button class="btn-num n-4">4</button>
            <button class="btn-num n-5">5</button>
            <button class="btn-num n-6">6</button>
            <button class="btn-num n-7">7</button>
            <button class="btn-num n-8">8</button>
            <button class="btn-num n-9">9</button>
        </div>

        <!-- Size Buttons -->
        <div class="size-actions-row">
            <button class="btn-size btn-big">Big (5-9)</button>
            <button class="btn-size btn-small">Small (0-4)</button>
        </div>

        <!-- History Tabs -->
        <div class="history-tabs-panel">
            <div class="hist-tab">Game History</div>
            <div class="hist-tab">Trend Chart</div>
            <div class="hist-tab active">My Bets</div>
        </div>

    </div>

    <!-- 24/7 Real-Time JavaScript Engine -->
    <script>
        // Configuration
        const periodDisplay = document.getElementById('periodDisplay');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const periodLabel = document.getElementById('periodLabel');
        const tabs = document.querySelectorAll('.timer-tab');
        
        let currentModeSeconds = 30; // Default to 30s
        let timerInterval = null;

        // --- Core Time Engine ---
        function updateGameEngine() {
            const now = new Date();
            
            // 1. Calculate midnight of the current day to act as absolute zero anchor
            const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
            
            // 2. Calculate exact total seconds passed since midnight
            const msPassedToday = now.getTime() - midnight.getTime();
            const totalSecondsPassed = Math.floor(msPassedToday / 1000);

            // 3. Calculate Period ID logic
            // E.g., if mode is 30s, period increments every 30s.
            const currentIntervalIndex = Math.floor(totalSecondsPassed / currentModeSeconds);
            
            // Generate standard YYYYMMDD string
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const datePrefix = `${yyyy}${mm}${dd}`;

            // Unique game mode identifier (e.g. 1 for 30s, 2 for 1m, 3 for 3m, 4 for 5m)
            let modeId = '1'; 
            if(currentModeSeconds === 60) modeId = '2';
            else if(currentModeSeconds === 180) modeId = '3';
            else if(currentModeSeconds === 300) modeId = '4';

            // Sequence padded to 4 digits (e.g., 0001, 0002)
            // Sequence starts at 1, so add 1 to the index.
            const sequenceNum = String(currentIntervalIndex + 1).padStart(4, '0');
            
            const finalPeriodId = `${datePrefix}${modeId}${sequenceNum}`;
            periodDisplay.innerText = finalPeriodId;

            // 4. Calculate Countdown logic
            // Find how many seconds have elapsed inside the CURRENT interval
            const secondsElapsedInInterval = totalSecondsPassed % currentModeSeconds;
            
            // Remaining seconds is the total interval length minus what has elapsed
            const remainingSeconds = currentModeSeconds - secondsElapsedInInterval;

            // Format mm:ss
            const remMins = Math.floor(remainingSeconds / 60);
            const remSecs = remainingSeconds % 60;
            const formattedTime = `${String(remMins).padStart(2, '0')}:${String(remSecs).padStart(2, '0')}`;
            
            countdownDisplay.innerText = formattedTime;
        }

        // --- Tab Switching Logic ---
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                // UI Update
                tabs.forEach(t => t.classList.remove('active'));
                e.currentTarget.classList.add('active');

                // State Update
                const modeSecs = parseInt(e.currentTarget.getAttribute('data-mode'));
                currentModeSeconds = modeSecs;

                // Update Label
                let labelText = "WIN GO 30S";
                if(modeSecs === 60) labelText = "WIN GO 1MIN";
                else if(modeSecs === 180) labelText = "WIN GO 3MIN";
                else if(modeSecs === 300) labelText = "WIN GO 5MIN";
                
                periodLabel.innerText = labelText;

                // Instantly update engine to avoid 1-second lag
                updateGameEngine();
            });
        });

        // Start the engine
        // Run immediately once, then set interval
        updateGameEngine();
        timerInterval = setInterval(updateGameEngine, 1000);

    </script>
</body>
</html>
