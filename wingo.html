<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINGO - N+ PLAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0808; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #0f172a; border: 1px solid #2a2a3a; border-radius: 24px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
        h1 { color: #f5c518; font-size: 2.5rem; margin-bottom: 16px; }
        p { color: #94a3b8; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 12px 28px; background: #f5c518; color: #000; font-weight: bold; border-radius: 12px; text-decoration: none; }
        .btn:hover { transform: scale(1.04); }
        .back { margin-top: 16px; display: inline-block; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .back:hover { color: #f5c518; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎰 WINGO</h1>
        <p>Color & Number Prediction Game</p>
        <p style="font-size:0.9rem; color:#64748b;">Coming soon — full game with timer, betting, and live results!</p>
        <br>
        <a href="index.html" class="back">← Back to Home</a>
    </div>
</body>
</html>
