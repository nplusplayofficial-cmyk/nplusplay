<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N+ PLAY - Register</title>
    <style>
        /* ==========================================
           1. DAMAN GAMES RED THEME STYLES
           ========================================== */
        :root {
            --primary-red: #f43f5e;
            --primary-red-dark: #e11d48;
            --header-gradient: linear-gradient(135deg, #fb7185, #e11d48);
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-card);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.05);
            position: relative;
            padding-bottom: 70px; /* Space for support button */
        }

        /* HEADER */
        .app-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* BRAND HERO BANNER */
        .brand-section {
            background: var(--header-gradient);
            padding: 20px 20px 40px 20px;
            text-align: center;
            color: #ffffff;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            margin-bottom: -20px;
        }

        .brand-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background: #ffffff;
            color: var(--primary-red-dark);
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* FORM CONTAINER */
        .form-container {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 10;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-red);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.12);
        }

        .input-icon {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }

        .country-code {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-red-dark);
            padding-right: 10px;
            border-right: 1px solid var(--border-color);
            margin-right: 10px;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-control {
            width: 100%;
            height: 48px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .toggle-password {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        /* CHECKBOX AGREEMENT */
        .agreement-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .agreement-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-red);
            cursor: pointer;
            margin-top: 1px;
        }

        .link-text {
            color: var(--primary-red-dark);
            text-decoration: none;
            font-weight: 600;
        }

        /* REGISTER BUTTON */
        .btn-register {
            width: 100%;
            height: 50px;
            background: var(--header-gradient);
            color: #ffffff;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(225, 29, 72, 0.3);
            transition: all 0.2s ease;
            margin-top: 6px;
        }

        .btn-register:active {
            transform: scale(0.98);
            box-shadow: 0 3px 10px rgba(225, 29, 72, 0.2);
        }

        .login-prompt {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* FLOATING AGENT / HELP BUTTON */
        .agent-chat-floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--primary-red);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            z-index: 99;
            transition: all 0.2s ease;
        }

        .agent-chat-floating-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.4);
        }

        .agent-chat-floating-btn:active {
            transform: translateY(0);
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1e293b;
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: #ef4444;
        }

        .toast.success {
            background: #10b981;
        }
    </style>
</head>
<body>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">Notification Message</div>

    <div class="app-container">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='home.html'">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <span class="header-title">Register</span>
            </div>
        </header>

        <!-- BRAND BANNER -->
        <div class="brand-section">
            <div class="brand-logo-badge">N+</div>
            <div class="brand-subtitle">Create an account to start playing</div>
        </div>

        <!-- FORM SECTION -->
        <form class="form-container" id="registerForm" onsubmit="handleRegister(event)">
            
            <!-- PHONE NUMBER (INDIAN +91) -->
            <div class="input-group">
                <label class="input-label">Phone Number</label>
                <div class="input-wrapper">
                    <span class="country-code">🇮🇳 +91</span>
                    <input type="tel" id="phone" class="form-control" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                </div>
            </div>

            <!-- SET PASSWORD -->
            <div class="input-group">
                <label class="input-label">Set Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input type="password" id="password" class="form-control" placeholder="Set password (min 6 chars)" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="input-group">
                <label class="input-label">Confirm Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <!-- INVITE CODE -->
            <div class="input-group">
                <label class="input-label">Invite Code</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"></path><path d="M2 7h20v5H2z"></path><path d="M12 22V7"></path><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
                    </span>
                    <input type="text" id="inviteCode" class="form-control" placeholder="Enter recommendation code" value="918237">
                </div>
            </div>

            <!-- PRIVACY AGREEMENT -->
            <div class="agreement-box">
                <input type="checkbox" id="agreement" checked required>
                <label for="agreement">
                    I have read and agree to the <a href="#" class="link-text" onclick="alert('Privacy Agreement: Please play responsibly.')">Privacy Agreement</a>
                </label>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn-register">Register</button>

            <!-- LOGIN LINK -->
            <div class="login-prompt">
                I have an account? <a href="#" class="link-text" onclick="showToast('Redirecting to Login...')">Log in</a>
            </div>
        </form>
    </div>

    <!-- FLOATING AGENT / HELP CHAT BUTTON -->
    <a href="agent-chat.html" class="agent-chat-floating-btn">
        <span class="online-dot"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Agent Support</span>
    </a>

    <!-- ==========================================
       2. JAVASCRIPT VALIDATION & LOGIC
       ========================================== -->
    <script>
        // --- TOGGLE PASSWORD VISIBILITY ---
        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.style.color = 'var(--primary-red)';
            } else {
                input.type = 'password';
                btn.style.color = 'var(--text-muted)';
            }
        }

        // --- SHOW CUSTOM TOAST ---
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast show ${type}`;

            setTimeout(() => {
                toast.className = 'toast';
            }, 2500);
        }

        // --- REGISTER FORM SUBMISSION & INDIAN PHONE VALIDATION ---
        function handleRegister(e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const inviteCode = document.getElementById('inviteCode').value.trim();
            const agreement = document.getElementById('agreement').checked;

            // Strict Indian Phone Validation: 10 digits starting with 6, 7, 8, or 9
            const indianPhoneRegex = /^[6-9]\d{9}$/;
            if (!indianPhoneRegex.test(phone)) {
                showToast('Please enter a valid 10-digit Indian phone number starting with 6-9', 'error');
                return;
            }

            // Password Length Check
            if (password.length < 6) {
                showToast('Password must be at least 6 characters long', 'error');
                return;
            }

            // Confirm Password Match Check
            if (password !== confirmPassword) {
                showToast('Passwords do not match!', 'error');
                return;
            }

            // Privacy Checkbox Check
            if (!agreement) {
                showToast('You must agree to the Privacy Agreement', 'error');
                return;
            }

            // Store User session data locally
            const userData = {
                phone: '+91' + phone,
                inviteCode: inviteCode || 'DEFAULT',
                registeredAt: new Date().toISOString()
            };
            localStorage.setItem('nplus_user', JSON.stringify(userData));

            // Success feedback
            showToast('🎉 Registration Successful!', 'success');

            // Redirect to home page or game dashboard after 1.2s
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1200);
        }
    </script>
</body>
</html>
