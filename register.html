<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N+ PLAY - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; background: #22223b; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Header */
        .header { background: #e63946; padding: 15px 20px; display: flex; align-items: center; color: white; position: relative; }
        .back-btn { font-size: 20px; text-decoration: none; color: white; margin-right: 15px; }
        .header-title { font-size: 18px; font-weight: bold; width: 100%; text-align: center; margin-right: 25px; }

        /* Form Body */
        .form-body { padding: 25px 20px; flex-grow: 1; }
        .form-subtitle { font-size: 13px; color: #adb5bd; margin-bottom: 25px; }
        
        .section-title { font-size: 14px; font-weight: bold; color: #e63946; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .input-group { margin-bottom: 20px; }
        .input-label { font-size: 13px; color: #adb5bd; margin-bottom: 8px; display: block; }
        
        .input-box { display: flex; align-items: center; background: #2d2d44; border-radius: 8px; border: 1px solid #4a4e69; overflow: hidden; }
        .prefix { background: #3a3a5e; padding: 12px 15px; font-size: 14px; color: #e2e2e2; border-right: 1px solid #4a4e69; }
        .input-box input { background: transparent; border: none; outline: none; color: white; padding: 12px 15px; width: 100%; font-size: 14px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 15px; font-size: 12px; color: #adb5bd; }
        .checkbox-group a { color: #e63946; text-decoration: none; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #e63946, #d90429); color: white; border: none; padding: 14px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 30px; box-shadow: 0 4px 15px rgba(230,57,70,0.4); }
        .btn-submit:active { transform: scale(0.98); }

        .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: #adb5bd; }
        .footer-links a { color: #e63946; text-decoration: none; font-weight: bold; }

        /* Help / Agent Live Chat Button */
        .help-bar { background: #161625; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2d2d44; }
        .help-text { font-size: 13px; color: #adb5bd; }
        .help-btn { background: #3a3a5e; color: #4cc9f0; border: none; padding: 8px 15px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div>
        <!-- Header -->
        <div class="header">
            <a href="index.html" class="back-btn">❮</a>
            <div class="header-title">N+ PLAY</div>
        </div>

        <!-- Body -->
        <div class="form-body">
            <h2 style="font-size: 22px; margin-bottom: 5px;">Register</h2>
            <p class="form-subtitle">Please register by Indian phone number (+91)</p>

            <div class="section-title">📱 Register your phone</div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label class="input-label">Phone number</label>
                    <div class="input-box">
                        <span class="prefix">+91</span>
                        <input type="tel" id="phone" placeholder="Enter 10-digit mobile number" maxlength="10" pattern="[6-9][0-9]{9}" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Set password</label>
                    <div class="input-box">
                        <input type="password" id="password" placeholder="Set password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Confirm password</label>
                    <div class="input-box">
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Invite code</label>
                    <div class="input-box">
                        <input type="text" id="inviteCode" value="NPLUS999" readonly style="color: #4cc9f0; font-weight: bold;">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreement" required>
                    <label for="agreement">I have read and agree <a href="#">[Privacy Agreement]</a></label>
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>

            <div class="footer-links">
                I have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <!-- Help & Agent Chat Bar -->
    <div class="help-bar">
        <span class="help-text">Need assistance?</span>
        <a href="agent-chat.html" class="help-btn">💬 Customer Support</a>
    </div>
</div>

<script>
    function handleRegister(event) {
        event.preventDefault();
        const phone = document.getElementById('phone').value;
        const pass = document.getElementById('password').value;
        const cpass = document.getElementById('confirmPassword').value;

        if(phone.length !== 10) {
            alert('Please enter a valid 10-digit Indian mobile number!');
            return;
        }
        if(pass !== cpass) {
            alert('Passwords do not match!');
            return;
        }

        alert('Registration Successful! Redirecting to Login...');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
