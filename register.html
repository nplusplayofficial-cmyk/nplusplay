<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N+ PLAY - Premium Registration</title>
    <style>
        /* ==========================================
           1. MODERN DARK GAMING THEME & GLASSMORPHISM
           ========================================== */
        :root {
            --bg-dark: #070a12;
            --bg-surface: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            
            --gold-neon: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.35);
            --red-vibrant: #e63946;
            --red-glow: rgba(230, 57, 70, 0.4);
            --cyan-accent: #06b6d4;
            --green-glow: #10b981;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.8);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 15% 15%, var(--red-glow) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, var(--gold-glow) 0%, transparent 45%),
                linear-gradient(180deg, var(--bg-dark) 0%, #030712 100%);
            background-attachment: fixed;
            padding: 12px;
        }

        /* CONTAINER VIEWPORT */
        .app-viewport {
            width: 100%;
            max-width: 450px;
            min-height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding-bottom: 75px; /* Clearance for sticky bottom bar */
        }

        /* SLEEK HEADER */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--card-border);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--gold-neon);
            color: var(--gold-neon);
        }

        /* BRAND LOGO WITH NEON GLOW */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-badge {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--gold-neon), var(--red-vibrant));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: #000;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, var(--gold-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* BANNER HERO TEXT */
        .hero-banner {
            padding: 24px 24px 10px 24px;
            text-align: center;
        }

        .hero-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* FORM SECTION */
        .form-section {
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 0 14px;
            transition: all 0.3s ease;
        }

        .input-box:focus-within {
            border-color: var(--gold-neon);
            box-shadow: 0 0 18px var(--gold-glow);
            background: rgba(15, 23, 42, 0.95);
        }

        .input-icon {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            margin-right: 12px;
        }

        .country-prefix {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--gold-neon);
            padding-right: 12px;
            border-right: 1px solid var(--input-border);
            margin-right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .form-input {
            width: 100%;
            height: 52px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .form-input::placeholder {
            color: rgba(148, 163, 184, 0.5);
            font-weight: 400;
        }

        .btn-toggle-eye {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
            transition: color 0.2s;
        }

        .btn-toggle-eye:hover {
            color: var(--gold-neon);
        }

        /* DISTINCTIVE INVITE CODE STYLING */
        .input-box.invite-box {
            border-color: rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.05);
        }

        .invite-badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold-neon);
            font-size: 0.65rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* PRIVACY AGREEMENT CHECKBOX */
        .agreement-box {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .agreement-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--gold-neon);
            cursor: pointer;
            border-radius: 4px;
        }

        .link-text {
            color: var(--gold-neon);
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.2s;
        }

        .link-text:hover {
            opacity: 0.8;
        }

        /* FLASHY ACTION BUTTON */
        .btn-submit {
            width: 100%;
            height: 54px;
            background: linear-gradient(135deg, #f59e0b 0%, #e63946 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--red-glow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .btn-submit:hover::after {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .login-link-container {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* STICKY BOTTOM CUSTOMER SUPPORT BAR */
        .sticky-support-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .support-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-indicator {
            position: relative;
            width: 10px;
            height: 10px;
            background: var(--green-glow);
            border-radius: 50%;
        }

        .pulse-indicator::after {
            content: '';
            position: absolute;
            top: -3px; left: -3px;
            width: 16px; height: 16px;
            background: rgba(16, 185, 129, 0.4);
            border-radius: 50%;
            animation: pulseWave 1.5s infinite;
        }

        @keyframes pulseWave {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .support-text-main {
            font-size: 0.8rem;
            font-weight: 700;
        }

        .support-text-sub {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .btn-chat-live {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(230, 57, 70, 0.2));
            border: 1px solid var(--gold-neon);
            color: var(--gold-neon);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-chat-live:hover {
            background: var(--gold-neon);
            color: #000;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* LUXURY DARK TOAST ALERT */
        .toast-notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 14px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .toast-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast-notification.error {
            border-color: var(--red-vibrant);
            color: #fca5a5;
        }

        .toast-notification.success {
            border-color: var(--green-glow);
            color: #6ee7b7;
        }
    </style>
</head>
<body>

    <!-- LUXURY TOAST POPUP -->
    <div id="toast" class="toast-notification">Alert Message</div>

    <!-- MAIN APP VIEWPORT -->
    <div class="app-viewport">
        <!-- HEADER -->
        <header class="app-header">
            <button class="btn-back" onclick="window.location.href='login.html'" title="Back to Login">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <a href="home.html" class="brand-logo">
                <div class="logo-badge">N+</div>
                <span class="brand-title">PLAY</span>
            </a>

            <div style="width: 40px;"></div> <!-- Spacer for balance -->
        </header>

        <!-- HERO HEADER -->
        <div class="hero-banner">
            <h1 class="hero-title">Create Account</h1>
            <p class="hero-subtitle">Join 100K+ players & start winning today</p>
        </div>

        <!-- REGISTRATION FORM -->
        <form class="form-section" id="registerForm" onsubmit="handleRegistration(event)">
            
            <!-- PHONE NUMBER WITH +91 PREFIX -->
            <div class="input-group">
                <label class="input-label">
                    <span>Mobile Number</span>
                    <span style="color: var(--gold-neon);">Required *</span>
                </label>
                <div class="input-box">
                    <span class="country-prefix">🇮🇳 +91</span>
                    <input type="tel" id="phone" class="form-input" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                </div>
            </div>

            <!-- SET PASSWORD -->
            <div class="input-group">
                <label class="input-label">Set Password</label>
                <div class="input-box">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="password" class="form-input" placeholder="Min 6 characters" required>
                    <button type="button" class="btn-toggle-eye" onclick="toggleVisibility('password', this)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="input-group">
                <label class="input-label">Confirm Password</label>
                <div class="input-box">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required>
                    <button type="button" class="btn-toggle-eye" onclick="toggleVisibility('confirmPassword', this)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <!-- DISTINCTIVE INVITE CODE FIELD -->
            <div class="input-group">
                <div class="input-label">
                    <span>Recommendation Code</span>
                    <span class="invite-badge">VIP BONUS</span>
                </div>
                <div class="input-box invite-box">
                    <span class="input-icon" style="color: var(--gold-neon);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                    </span>
                    <input type="text" id="inviteCode" class="form-input" value="VIP999" style="color: var(--gold-neon); font-weight: 800; letter-spacing: 1px;">
                </div>
            </div>

            <!-- PRIVACY AGREEMENT CHECKBOX -->
            <div class="agreement-box">
                <input type="checkbox" id="agreement" checked required>
                <label for="agreement">
                    I agree to the <a href="#" class="link-text" onclick="alert('Play Responsibly. Terms & Privacy Policy applies.')">Privacy Agreement</a>
                </label>
            </div>

            <!-- ACTION BUTTON -->
            <button type="submit" class="btn-submit">
                <span>REGISTER NOW</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>

            <!-- LOGIN REDIRECT -->
            <div class="login-link-container">
                Already have an account? <a href="login.html" class="link-text">Log In</a>
            </div>
        </form>

        <!-- STICKY BOTTOM LIVE CHAT BAR -->
        <div class="sticky-support-bar">
            <div class="support-info">
                <div class="pulse-indicator"></div>
                <div>
                    <div class="support-text-main">24/7 Agent Support</div>
                    <div class="support-text-sub">Instant response guaranteed</div>
                </div>
            </div>
            <a href="agent-chat.html" class="btn-chat-live">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Live Chat</span>
            </a>
        </div>
    </div>

    <!-- ==========================================
       JAVASCRIPT FORM VALIDATION LOGIC
       ========================================== -->
    <script>
        // TOGGLE EYE VISIBILITY FOR PASSWORDS
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.style.color = 'var(--gold-neon)';
            } else {
                input.type = 'password';
                btn.style.color = 'var(--text-muted)';
            }
        }

        // LUXURY TOAST NOTIFICATION SYSTEM
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast-notification show ${type}`;

            setTimeout(() => {
                toast.className = 'toast-notification';
            }, 2800);
        }

        // STRICT INDIAN PHONE NUMBER VALIDATION (+91)
        function isValidIndianPhone(phone) {
            const phoneRegex = /^[6-9]\d{9}$/; // 10 digits starting with 6, 7, 8, or 9
            return phoneRegex.test(phone);
        }

        // FORM SUBMISSION HANDLER
        function handleRegistration(e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const inviteCode = document.getElementById('inviteCode').value.trim();
            const agreement = document.getElementById('agreement').checked;

            // 1. Phone Number Validation
            if (!isValidIndianPhone(phone)) {
                showToast('❌ Enter a valid 10-digit Indian phone number', 'error');
                return;
            }

            // 2. Password Length Validation
            if (password.length < 6) {
                showToast('❌ Password must be at least 6 characters long', 'error');
                return;
            }

            // 3. Confirm Password Validation
            if (password !== confirmPassword) {
                showToast('❌ Password and Confirm Password do not match', 'error');
                return;
            }

            // 4. Privacy Checkbox Validation
            if (!agreement) {
                showToast('❌ Please accept the Privacy Agreement', 'error');
                return;
            }

            // Store User Account in LocalStorage
            const newAccount = {
                phone: '+91' + phone,
                inviteCode: inviteCode || 'DEFAULT',
                createdAt: new Date().toISOString()
            };
            localStorage.setItem('nplus_user', JSON.stringify(newAccount));

            // Success Output & Redirection
            showToast('🎉 Account Created Successfully!', 'success');

            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1200);
        }
    </script>
</body>
</html>
