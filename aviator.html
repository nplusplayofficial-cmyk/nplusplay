<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator - Provably Fair Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           CORE RESET & VARIABLES
           ========================================== */
        :root {
            --bg-body: #111111;
            --bg-panel: #1a1a1a;
            --bg-input: #000000;
            --border-color: #2b2b2b;
            --primary-red: #e51c23;
            --primary-green: #28a745;
            --primary-orange: #ffc107;
            --text-main: #ffffff;
            --text-muted: #8a8a8a;
            --blue-pill: #2196f3;
            --blue-pill-bg: rgba(33, 150, 243, 0.15);
            --purple-pill: #c2185b;
            --purple-pill-bg: rgba(194, 24, 91, 0.15);
            --success-bg: rgba(40, 167, 69, 0.12);
            --success-border: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ==========================================
           HEADER & HISTORY BAR
           ========================================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #151515;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-red);
            font-weight: 900;
            font-style: italic;
            font-size: 20px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .logo-group svg {
            width: 24px;
            height: 24px;
            fill: var(--primary-red);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance {
            color: var(--primary-green);
            font-weight: 800;
            font-size: 16px;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        .hamburger span {
            width: 22px;
            height: 3px;
            background-color: #fff;
            border-radius: 2px;
        }

        .history-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--bg-body);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            border-bottom: 1px solid var(--border-color);
        }

        .history-bar::-webkit-scrollbar { display: none; }

        .hist-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 8px;
        }
        .hist-blue { background-color: var(--blue-pill-bg); color: var(--blue-pill); }
        .hist-purple { background-color: var(--purple-pill-bg); color: var(--purple-pill); }

        /* ==========================================
           GAME CANVAS ARENA
           ========================================== */
        .game-arena {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #0b1118;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            border-bottom: 2px solid var(--primary-red);
        }

        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        .hud {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        .multiplier-text {
            font-size: 80px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(255,255,255,0.15);
            transition: opacity 0.2s;
        }

        .crash-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flew-away-label {
            font-size: 26px;
            color: var(--primary-red);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -15px;
            text-shadow: 0 0 15px rgba(229, 28, 35, 0.4);
        }

        .flew-away-mult {
            color: var(--primary-red);
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .waiting-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .waiting-loader {
            width: 50px; height: 50px;
            fill: var(--primary-red);
            animation: spin 1.5s linear infinite;
        }

        .waiting-text {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* ==========================================
           DUAL BETTING CONTROLS
           ========================================== */
        .controls-wrapper {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .panel-tabs {
            display: flex;
            justify-content: center;
            background-color: var(--bg-input);
            border-radius: 20px;
            width: 180px;
            margin: 0 auto;
            padding: 2px;
        }

        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 18px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #2b2b2b;
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .panel-body {
            display: flex;
            gap: 12px;
        }

        .input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .amount-control {
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
        }

        .btn-adjust {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #252525;
            color: #fff;
            border: none;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-adjust:active { background-color: #444; }

        .bet-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            outline: none;
            width: 100%;
        }

        .quick-chips {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .chip {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            padding: 8px 0;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s;
        }
        .chip:active { background-color: #333; color: #fff; }

        .action-section {
            width: 140px;
            display: flex;
        }

        .btn-action {
            width: 100%;
            border-radius: 14px;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.96); }

        .btn-state-bet { background-color: var(--primary-green); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 4px 10px rgba(40, 167, 69, 0.3); }
        .btn-state-cancel { background-color: var(--primary-red); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 4px 10px rgba(229, 28, 35, 0.3); }
        .btn-state-cashout { background-color: var(--primary-orange); color: #000; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 4px 10px rgba(255, 193, 7, 0.3); }
        .btn-state-disabled { background-color: #222; color: #666; border: 1px solid #333; pointer-events: none; }

        .btn-action h2 { font-size: 24px; font-weight: 900; line-height: 1.1; letter-spacing: 0.5px; }
        .btn-action span { font-size: 14px; font-weight: 700; opacity: 0.9; }

        /* Floating Win Popup */
        .win-popup {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background-color: rgba(40, 167, 69, 0.95);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            pointer-events: none;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            animation: floatUp 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.9); }
            15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
            30% { transform: translate(-50%, 0) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -30px); }
            100% { opacity: 0; transform: translate(-50%, -40px); }
        }

        /* ==========================================
           LIVE BETS TABLE
           ========================================== */
        .live-bets-container {
            flex: 1;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .bets-tabs {
            display: flex;
            background-color: var(--bg-body);
            padding: 10px 15px 0 15px;
        }

        .b-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .b-tab.active { color: #fff; border-bottom: 2px solid var(--primary-red); }

        .bets-header-stats {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            background-color: var(--bg-panel);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th { text-align: left; padding: 10px 15px; font-size: 11px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-color); }
        td { padding: 10px 15px; font-size: 13px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .tr-win {
            background-color: var(--success-bg);
            border-left: 3px solid var(--success-border);
        }

        .user-cell { display: flex; align-items: center; gap: 8px; color: #aaa; }
        .avatar {
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #fff; font-weight: bold;
        }

        .mult-pill {
            padding: 3px 8px; border-radius: 12px; font-size: 11px;
            background: var(--blue-pill-bg); color: var(--blue-pill);
        }
        .mult-pill.high { background: var(--purple-pill-bg); color: var(--purple-pill); }
        .win-amt { color: var(--primary-green); font-weight: 800; }

    </style>
</head>

        <!-- HEADER -->
        <header>
            <div class="logo-group">
                <svg viewBox="0 0 64 64">
                    <path d="M61.9,18.7l-21.7,3L24.6,6.3c-0.6-0.6-1.5-0.7-2.2-0.2L19,8.5c-0.4,0.3-0.6,0.9-0.5,1.4l5.3,16.5L9.6,30.2L4.1,25c-0.5-0.4-1.2-0.6-1.8-0.3l-1.9,0.9c-0.7,0.3-0.9,1.1-0.5,1.7l7.5,11.2l-0.2,0.2c-0.5,0.5-0.5,1.4,0,1.9l2.8,2.8c0.5,0.5,1.4,0.5,1.9,0l12-11.8l16.7,2.2c0.6,0.1,1.1-0.2,1.4-0.7l20-22C62.4,20,62.5,19.1,61.9,18.7z"/>

    <script>
        /* ==========================================
           1. INITIALIZATION & SETUP
           ========================================== */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const arena = document.getElementById('arena');
        
        let width, height, dpr;
        function resize() {
            width = arena.clientWidth;
            height = arena.clientHeight;
            dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);

        // Pre-load SVG Plane Image
        const planeSVG = `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e51c23' d='M61.9,18.7l-21.7,3L24.6,6.3c-0.6-0.6-1.5-0.7-2.2-0.2L19,8.5c-0.4,0.3-0.6,0.9-0.5,1.4l5.3,16.5L9.6,30.2L4.1,25c-0.5-0.4-1.2-0.6-1.8-0.3l-1.9,0.9c-0.7,0.3-0.9,1.1-0.5,1.7l7.5,11.2l-0.2,0.2c-0.5,0.5-0.5,1.4,0,1.9l2.8,2.8c0.5,0.5,1.4,0.5,1.9,0l12-11.8l16.7,2.2c0.6,0.1,1.1-0.2,1.4-0.7l20-22C62.4,20,62.5,19.1,61.9,18.7z'/%3E%3C/svg%3E`;
        const planeImg = new Image();
        planeImg.src = planeSVG;

        window.addEventListener('load', () => {
            resize();
            initEngine();
        });

        /* ==========================================
           2. CANVAS RENDERING ENGINE (PHYSICS & ANIMATION)
           ========================================== */
        // Sunburst rotation state
        let sunburstAngle = 0;

        function drawBackground() {
            // Draw Radial Background
            let bgGrad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            bgGrad.addColorStop(0, '#1b2838');
            bgGrad.addColorStop(1, '#080b10');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Draw Sunburst Rays
            ctx.save();
            ctx.translate(width/2, height/2);
            ctx.rotate(sunburstAngle);
            ctx.fillStyle = 'rgba(255,255,255,0.015)';
            let rays = 12;
            for(let i=0; i<rays; i++) {
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.arc(0, 0, width, (i*2)*Math.PI/rays, (i*2+0.5)*Math.PI/rays);
                ctx.fill();
            }
            ctx.restore();
            sunburstAngle += 0.001;

            // Draw Axes Dots
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            for(let y=20; y<height-20; y+=20) ctx.fillRect(20, y, 2, 2);
            for(let x=20; x<width-20; x+=20) ctx.fillRect(x, height-20, 2, 2);
        }

        function drawCurveAndPlane(progress, isCrashed, crashElapsed) {
            let p0 = {x: 20, y: height - 20};
            let p2 = {x: width - 40, y: 40};
            
            // Control point makes it flat initially, then swoop up
            let p1 = {x: p0.x + (p2.x - p0.x) * 0.8, y: p0.y};

            // Calculate current end point of curve based on Bezier formula
            let t = progress;
            let cx = (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x;
            let cy = (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y;

            // Apply Crash Trajectory if needed
            if (isCrashed) {
                cx += crashElapsed * 1500; // Fly right
                cy -= crashElapsed * 1000; // Fly up
            }

            // Draw Filled Area under curve
            if (!isCrashed) {
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.quadraticCurveTo(p1.x, p1.y, cx, cy);
                ctx.lineTo(cx, p0.y);
                ctx.closePath();

                let fillGrad = ctx.createLinearGradient(0, p0.y, 0, cy);
                fillGrad.addColorStop(0, 'rgba(229, 28, 35, 0)');
                fillGrad.addColorStop(1, 'rgba(229, 28, 35, 0.45)');
                ctx.fillStyle = fillGrad;
                ctx.fill();

                // Draw solid red curve line
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.quadraticCurveTo(p1.x, p1.y, cx, cy);
                ctx.strokeStyle = '#e51c23';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // Calculate Plane Rotation (Derivative of Quadratic Bezier)
            let angle = 0;
            if (!isCrashed) {
                let dx = 2*(1-t)*(p1.x - p0.x) + 2*t*(p2.x - p1.x);
                let dy = 2*(1-t)*(p1.y - p0.y) + 2*t*(p2.y - p1.y);
                angle = Math.atan2(dy, dx);
            } else {
                angle = -Math.PI / 4; // Sharp upward tilt on crash
            }

            // Draw Plane
            let size = 60;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.drawImage(planeImg, -size/2, -size/2, size, size);
            ctx.restore();
        }

        /* ==========================================
           3. GAME LOOP & STATE MANAGEMENT
           ========================================== */
        let gameState = 'WAITING'; // WAITING, FLYING, CRASHED
        let currentMult = 1.00;
        let crashMult = 0;
        let flightStartTime = 0;
        let crashTime = 0;

        const hudWaiting = document.getElementById('waiting-ui');
        const hudMultText = document.getElementById('multiplier-ui');
        const hudCrash = document.getElementById('crash-ui');
        const crashMultText = document.getElementById('crash-mult');

        function initEngine() {
            changeState('WAITING');
            renderLoop();
        }

        function changeState(newState) {
            gameState = newState;
            if (newState === 'WAITING') {
                hudWaiting.classList.remove('hidden');
                hudMultText.classList.add('hidden');
                hudCrash.classList.add('hidden');
                currentMult = 1.00;
                
                // Process Panel Transitions
                [1, 2].forEach(id => {
                    let p = panelStates[id];
                    if (p.status === 'QUEUED') p.status = 'ACTIVE';
                    else if (p.status === 'CASHED') p.status = 'IDLE';
                    syncPanelUI(id);
                });
                
                generateDummyBets(1.00, false);
                setTimeout(() => changeState('FLYING'), 5000);
            } 
            else if (newState === 'FLYING') {
                hudWaiting.classList.add('hidden');
                hudMultText.classList.remove('hidden');
                hudMultText.innerText = `1.00x`;
                
                // Weighted Random Crash Point
                let r = Math.random();
                if (r < 0.3) crashMult = 1.00 + Math.random() * 0.5;
                else if (r < 0.8) crashMult = 1.50 + Math.random() * 3.5;
                else crashMult = 5.00 + Math.random() * 20.0;
                
                flightStartTime = performance.now();
            }
            else if (newState === 'CRASHED') {
                crashTime = performance.now();
                hudMultText.classList.add('hidden');
                hudCrash.classList.remove('hidden');
                crashMultText.innerText = `${currentMult.toFixed(2)}x`;
                
                // End active bets (Loss)
                [1, 2].forEach(id => {
                    if (panelStates[id].status === 'ACTIVE') {
                        panelStates[id].status = 'IDLE';
                        syncPanelUI(id);
                    }
                });

                addHistory(currentMult.toFixed(2));
                generateDummyBets(currentMult, true);

                setTimeout(() => changeState('WAITING'), 3000);
            }
        }

        function renderLoop() {
            drawBackground();

            if (gameState === 'FLYING' || gameState === 'CRASHED') {
                let elapsed = (performance.now() - flightStartTime) / 1000;
                
                if (gameState === 'FLYING') {
                    // Exponential multiplier calculation
                    currentMult = 1 + (0.06 * Math.pow(elapsed, 1.5));
                    
                    if (currentMult >= crashMult) {
                        currentMult = crashMult;
                        changeState('CRASHED');
                    } else {
                        hudMultText.innerText = `${currentMult.toFixed(2)}x`;
                        
                        // Update cashout buttons
                        [1, 2].forEach(id => {
                            if(panelStates[id].status === 'ACTIVE') syncPanelUI(id);
                        });
                        
                        if (Math.random() < 0.05) generateDummyBets(currentMult, false);
                    }
                }

                let progress = 0;
                let crashElapsed = 0;
                if (gameState === 'FLYING') {
                    progress = Math.min(1, elapsed / 4); // Ease over 4 secs
                    progress = 1 - Math.exp(-progress * 3); // Exponential ease out
                } else {
                    progress = 1;
                    crashElapsed = (performance.now() - crashTime) / 1000;
                }

                drawCurveAndPlane(progress, gameState === 'CRASHED', crashElapsed);
            }

            requestAnimationFrame(renderLoop);
        }

        /* ==========================================
           4. BETTING STATE MACHINE & UI
           ========================================== */
        let balanceAmt = 1000.00;
        const balanceEl = document.getElementById('user-balance');

        // Status: IDLE, QUEUED (waiting for next), ACTIVE (in flight), CASHED
        const panelStates = {
            1: { amount: 10.00, status: 'IDLE' },
            2: { amount: 10.00, status: 'IDLE' }
        };

        function validateInput(id) {
            if (panelStates[id].status !== 'IDLE') return;
            let val = parseFloat(document.getElementById(`input-${id}`).value);
            if (isNaN(val) || val < 1) val = 10.00;
            panelStates[id].amount = val;
            syncPanelUI(id);
        }

        function adjustBet(id, delta) {
            if (panelStates[id].status !== 'IDLE') return;
            let val = panelStates[id].amount + delta;
            if (val < 1) val = 1;
            panelStates[id].amount = val;
            syncPanelUI(id);
        }

        function setBet(id, val) {
            if (panelStates[id].status !== 'IDLE') return;
            panelStates[id].amount = val;
            syncPanelUI(id);
        }

        function handleAction(id) {
            let p = panelStates[id];
            
            if (p.status === 'IDLE') {
                if (balanceAmt < p.amount) return alert('Insufficient Balance');
                balanceAmt -= p.amount;
                updateBalance();
                p.status = (gameState === 'WAITING') ? 'ACTIVE' : 'QUEUED';
            } 
            else if (p.status === 'QUEUED') {
                balanceAmt += p.amount;
                updateBalance();
                p.status = 'IDLE';
            }
            else if (p.status === 'ACTIVE' && gameState === 'FLYING') {
                let winAmt = p.amount * currentMult;
                balanceAmt += winAmt;
                updateBalance();
                p.status = 'CASHED';
                triggerWinAnimation(id, winAmt, currentMult);
            }
            syncPanelUI(id);
        }

        function syncPanelUI(id) {
            let p = panelStates[id];
            document.getElementById(`input-${id}`).value = p.amount.toFixed(2);
            
            let btn = document.getElementById(`btn-${id}`);
            let title = document.getElementById(`btn-title-${id}`);
            let sub = document.getElementById(`btn-sub-${id}`);
            
            btn.className = 'btn-action';

            if (p.status === 'IDLE') {
                btn.classList.add('btn-state-bet');
                title.innerText = 'BET';
                sub.innerText = p.amount.toFixed(2) + ' INR';
            } else if (p.status === 'QUEUED') {
                btn.classList.add('btn-state-cancel');
                title.innerText = 'CANCEL';
                sub.innerText = 'Waiting for next round';
            } else if (p.status === 'ACTIVE') {
                btn.classList.add('btn-state-cashout');
                title.innerText = 'CASH OUT';
                sub.innerText = (p.amount * currentMult).toFixed(2) + ' INR';
            } else if (p.status === 'CASHED') {
                btn.classList.add('btn-state-disabled');
                title.innerText = 'CASHED OUT';
                sub.innerText = '';
            }
        }

        function triggerWinAnimation(panelId, amt, mult) {
            let panel = document.getElementById(`panel-${panelId}`);
            let anim = document.createElement('div');
            anim.className = 'win-popup';
            anim.innerHTML = `You have cashed out!<br>${mult.toFixed(2)}x<br>Win: ${amt.toFixed(2)} INR`;
            panel.appendChild(anim);
            setTimeout(() => anim.remove(), 1800);
        }

        function updateBalance() {
            balanceEl.innerText = balanceAmt.toFixed(2);
        }

        /* ==========================================
           5. HISTORY & LIVE BETS DUMMY DATA
           ========================================== */
        const histBar = document.getElementById('history-bar');
        function addHistory(val) {
            let num = parseFloat(val);
            let cls = num >= 2 ? 'hist-purple' : 'hist-blue';
            let span = document.createElement('span');
            span.className = `hist-pill ${cls}`;
            span.innerText = val + 'x';
            histBar.insertBefore(span, histBar.firstChild);
        }

        let dummyBets = [];
        
        // HSL Color Generator for Avatars
        function getAvatarColor(str) {
            let hash = 0;
            for(let i=0; i<str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${hash % 360}, 70%, 50%)`;
        }

        function generateDummyBets(mult, isCrashed) {
            const tbody = document.getElementById('bets-tbody');
            if(dummyBets.length === 0) {
                let count = Math.floor(Math.random()*15) + 15;
                document.getElementById('total-bets-text').innerText = `ALL BETS: ${count + 2030}`;
                for(let i=0; i<count; i++) {
                    let userStr = `${Math.floor(Math.random()*9+1)}***${Math.floor(Math.random()*9+1)}`;
                    dummyBets.push({
                        user: userStr,
                        color: getAvatarColor(userStr),
                        bet: [10, 50, 100, 500, 1000][Math.floor(Math.random()*5)],
                        target: 1.05 + Math.random() * 5,
                        cashed: false
                    });
                }
            }

            let html = '';
            dummyBets.forEach((b, i) => {
                if (i > 8) return; // Render limit
                if (!b.cashed && mult >= b.target && !isCrashed) b.cashed = true;
                
                let win = b.cashed ? (b.bet * b.target).toFixed(2) : '-';
                let xCls = b.target >= 2 ? 'high' : '';
                let x = b.cashed ? `<span class="mult-pill ${xCls}">${b.target.toFixed(2)}x</span>` : '-';
                let rowCls = b.cashed ? 'tr-win' : '';

                if (isCrashed && !b.cashed) { x = '-'; win = '-'; }

                html += `<tr class="${rowCls}">
                    <td><div class="user-cell"><div class="avatar" style="background:${b.color}">U</div>${b.user}</div></td>
                    <td style="text-align:right">${b.bet.toFixed(2)}</td>
                    <td style="text-align:center">${x}</td>
                    <td style="text-align:right" class="win-amt">${win}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
            
            if (isCrashed) dummyBets = []; // Reset for next round
        }

    </script>
</body>
</html>
