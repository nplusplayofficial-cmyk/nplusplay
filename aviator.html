<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator - N+ PLAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0808;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 10px 8px 80px 8px;
        }
        .app { max-width: 480px; width: 100%; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 6px;
        }
        .header .logo {
            font-size: 18px;
            font-weight: 900;
            color: #f5c518;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .logo svg { width: 22px; height: 22px; fill: #f5c518; }
        .header .logo svg path { fill: #f5c518; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header-right .balance {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.15);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 13px;
            font-weight: 800;
            color: #10b981;
        }
        .header-right .back-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
        }

        /* TOP ROW: Timer + Round ID */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 6px;
        }
        .top-row .timer {
            font-size: 24px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            color: #f5c518;
        }
        .top-row .timer.danger { color: #ef4444; animation: blink 0.6s infinite; }
        .top-row .sec-label { font-size: 12px; color: #94a3b8; font-weight: 600; margin-left: 2px; }
        .top-row .round-id {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }
        .top-row .round-id span { color: #fff; font-weight: 700; }
        .top-row .status {
            font-size: 10px;
            font-weight: 700;
            color: #22c55e;
            margin-left: 8px;
        }
        .top-row .status.closed { color: #ef4444; }
        @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }

        /* CHART */
        .chart-container {
            width: 100%;
            height: 220px;
            background: #0f172a;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.06);
            position: relative;
            overflow: hidden;
            margin-bottom: 6px;
        }
        #chartCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .chart-overlay-mult {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(245,197,24,0.2);
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .chart-overlay-mult.show { opacity: 1; }
        .chart-overlay-mult.crashed { color: #ef4444; text-shadow: 0 0 30px rgba(239,68,68,0.4); }

        /* HISTORY STRIP */
        .history-strip {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 4px 0 8px 0;
            margin-bottom: 4px;
            white-space: nowrap;
        }
        .history-strip::-webkit-scrollbar { display: none; }
        .multiplier-tag {
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(15,23,42,0.6);
            border: 1px solid rgba(255,215,0,0.04);
            flex-shrink: 0;
        }
        .multiplier-tag.low { color: #06b6d4; border-color: rgba(6,182,212,0.15); }
        .multiplier-tag.mid { color: #8b5cf6; border-color: rgba(139,92,246,0.15); }
        .multiplier-tag.high { color: #f5c518; border-color: rgba(245,197,24,0.15); }

        /* BET PANEL */
        .bet-panel {
            background: rgba(15,23,42,0.4);
            border: 1px solid rgba(255,215,0,0.04);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .bet-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .bet-row .stake-input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 6px 10px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            min-width: 60px;
            text-align: center;
        }
        .bet-row .stake-input:focus { outline: none; border-color: #f5c518; }
        .bet-row .stake-input::placeholder { color: #64748b; font-weight: 400; font-size: 12px; }

        .bet-actions {
            display: flex;
            gap: 6px;
        }
        .btn-bet {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-bet.bet {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 15px rgba(34,197,94,0.2);
            flex: 2;
        }
        .btn-bet.bet:hover { transform: scale(1.02); }
        .btn-bet.bet:active { transform: scale(0.97); }
        .btn-bet.cashout {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            box-shadow: 0 4px 15px rgba(245,158,11,0.3);
            animation: pulseGlow 0.8s infinite alternate;
            flex: 2;
        }
        .btn-bet.waiting {
            background: rgba(255,255,255,0.05);
            color: #64748b;
            cursor: not-allowed;
            flex: 2;
        }
        .btn-bet.crashed {
            background: #ef4444;
            color: #fff;
            flex: 2;
        }
        .btn-auto {
            flex: 1;
            height: 44px;
            border: 1px solid #2a2a3a;
            border-radius: 10px;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-auto:hover { border-color: #f5c518; color: #f5c518; }
        .btn-auto.active { border-color: #f5c518; background: rgba(245,197,24,0.08); color: #f5c518; }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 8px rgba(245,158,11,0.15); }
            to { box-shadow: 0 0 20px rgba(245,158,11,0.4); }
        }

        .bet-closed-msg {
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: #ef4444;
            padding: 6px 0;
            margin-top: 4px;
            border-radius: 6px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.1);
            display: none;
            letter-spacing: 0.5px;
        }
        .bet-closed-msg.active { display: block; }

        .msg-box {
            padding: 6px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            text-align: center;
            margin-top: 4px;
            display: none;
        }
        .msg-box.win { background: rgba(16,185,129,0.08); color: #10b981; border: 1px solid rgba(16,185,129,0.08); display: block; }
        .msg-box.lose { background: rgba(239,68,68,0.08); color: #ef4444; border: 1px solid rgba(239,68,68,0.08); display: block; }
        .msg-box.info { background: rgba(245,197,24,0.05); color: #f5c518; border: 1px solid rgba(245,197,24,0.06); display: block; }

        /* LIVE BETS TABLE */
        .live-table-card {
            background: rgba(15,23,42,0.4);
            border: 1px solid rgba(255,215,0,0.04);
            border-radius: 10px;
            padding: 8px;
        }
        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 6px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 6px;
        }
        .table-header-row .all-bets {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
        }
        .table-header-row .all-bets span { color: #f5c518; }
        .table-header-row .ping {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
        }
        .table-header-row .ping span { color: #22c55e; }

        .table-tabs {
            display: flex;
            gap: 4px;
            background: #0f172a;
            padding: 2px;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .table-tabs button {
            flex: 1;
            padding: 4px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            font-size: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .table-tabs button.active { background: #f5c518; color: #000; }

        .table-wrapper { max-height: 160px; overflow-y: auto; overflow-x: auto; }
        .table-wrapper::-webkit-scrollbar { width: 3px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #f5c518; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; min-width: 280px; }
        th { text-align: left; padding: 5px 4px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid #1a1a2e; position: sticky; top: 0; background: #0f172a; z-index: 5; font-size: 9px; }
        td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,0.02); color: #cbd5e1; font-size: 10px; }
        .user-cell { display: flex; align-items: center; gap: 4px; }
        .avatar {
            width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 7px; font-weight: 800; color: #fff;
        }
        .cashout-mult { color: #f5c518; font-weight: 800; }
        .win-amt { color: #10b981; font-weight: 800; }
        .tr-win { background: rgba(16,185,129,0.04); border-left: 2px solid #10b981; }
        .text-muted { color: #64748b; }

        /* RESULT POPUP */
        .result-popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 300; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .result-popup-overlay.active { opacity: 1; pointer-events: auto; }
        .result-popup {
            background: #0f172a;
            border: 1px solid #f5c518;
            border-radius: 12px;
            padding: 18px 20px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(245,197,24,0.1);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .result-popup-overlay.active .result-popup { transform: scale(1); }
        .result-popup .result-icon { font-size: 36px; margin-bottom: 4px; }
        .result-popup .result-title { font-size: 20px; font-weight: 800; }
        .result-popup .result-title.win { color: #10b981; }
        .result-popup .result-title.lose { color: #ef4444; }
        .result-popup .result-details { margin-top: 8px; font-size: 12px; color: #94a3b8; line-height: 1.6; }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px;
            background: rgba(10,8,8,0.96);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,215,0,0.04);
            display: flex; justify-content: space-around;
            padding: 6px 0 10px;
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            color: #94a3b8; text-decoration: none; font-size: 0.55rem; font-weight: 600;
            transition: 0.2s;
        }
        .nav-item .nav-icon { font-size: 1.2rem; }
        .nav-item.active { color: #f5c518; }

        @media (max-width: 400px) {
            .chart-container { height: 160px; }
            .chart-overlay-mult { font-size: 32px; }
            .top-row .timer { font-size: 20px; }
            .btn-bet { height: 40px; font-size: 14px; }
            .btn-auto { height: 40px; font-size: 12px; }
            .top-row .round-id { font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 64 64"><path d="M61.9,18.7l-21.7,3L24.6,6.3c-0.6-0.6-1.5-0.7-2.2-0.2L19,8.5c-0.4,0.3-0.6,0.9-0.5,1.4l5.3,16.5L9.6,30.2L4.1,25c-0.5-0.4-1.2-0.6-1.8-0.3l-1.9,0.9c-0.7,0.3-0.9,1.1-0.5,1.7l7.5,11.2l-0.2,0.2c-0.5,0.5-0.5,1.4,0,1.9l2.8,2.8c0.5,0.5,1.4,0.5,1.9,0l12-11.8l16.7,2.2c0.6,0.1,1.1-0.2,1.4-0.7l20-22C62.4,20,62.5,19.1,61.9,18.7z"/></svg>
            AVIATOR
        </div>
        <div class="header-right">
            <span class="balance">₹<span id="balanceDisplay">1000.00</span></span>
            <button class="back-btn" onclick="window.location.href='index.html'">✕</button>
        </div>
    </div>

    <!-- TOP ROW: Timer + Round ID -->
    <div class="top-row">
        <div>
            <span class="timer" id="timerDisplay">--:--</span>
            <span class="sec-label">sec</span>
        </div>
        <div>
            <span class="round-id">Round ID: <span id="roundIdDisplay">22880684</span></span>
            <span class="status" id="statusLabel">● Betting Open</span>
        </div>
    </div>

    <!-- CHART -->
    <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
        <div class="chart-overlay-mult" id="chartMult">1.00x</div>
    </div>

    <!-- HISTORY STRIP -->
    <div class="history-strip" id="historyStrip">
        <span class="multiplier-tag low">1.85x</span>
        <span class="multiplier-tag mid">3.20x</span>
        <span class="multiplier-tag high">18.50x</span>
        <span class="multiplier-tag low">1.08x</span>
        <span class="multiplier-tag mid">4.60x</span>
        <span class="multiplier-tag low">1.12x</span>
        <span class="multiplier-tag mid">2.84x</span>
    </div>

    <!-- BET PANEL -->
    <div class="bet-panel">
        <div class="bet-row">
            <input type="number" id="stakeInput" class="stake-input" value="10.00" min="1" step="1" placeholder="1.00 INR">
            <div class="bet-actions">
                <button class="btn-bet bet" id="actionBtn" onclick="handleAction()">
                    <span id="btnText">BET</span>
                </button>
                <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">⚡ Auto</button>
            </div>
        </div>
        <div class="bet-closed-msg" id="betClosedMsg">⛔ Betting Closed!</div>
        <div id="betMsg" class="msg-box"></div>
    </div>

    <!-- LIVE BETS TABLE -->
    <div class="live-table-card">
        <div class="table-header-row">
            <span class="all-bets">All Bets <span id="totalBetsCount">2069</span></span>
            <span class="ping">Ping: <span id="pingDisplay">234</span>ms</span>
        </div>
        <div class="table-tabs">
            <button class="active" data-tab="all">All Bets</button>
            <button data-tab="my">My Bets</button>
            <button data-tab="top">Top</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>User</th><th style="text-align:right">Bet INR</th><th style="text-align:center">Cash out</th></tr>
                </thead>
                <tbody id="betsTableBody">
                    <tr><td colspan="3" style="text-align:center;color:#64748b;padding:10px;font-size:11px;">Waiting for bets...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- RESULT POPUP -->
    <div class="result-popup-overlay" id="resultPopup">
        <div class="result-popup">
            <div class="result-icon" id="popupIcon">🎉</div>
            <div class="result-title" id="popupTitle">You Win!</div>
            <div class="result-details" id="popupDetails"></div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="activity.html" class="nav-item">
            <span class="nav-icon">🔥</span>
            <span>Activity</span>
        </a>
        <a href="promotion.html" class="nav-item">
            <span class="nav-icon">🎁</span>
            <span>Promotion</span>
        </a>
        <a href="account.html" class="nav-item active">
            <span class="nav-icon">👤</span>
            <span>Account</span>
        </a>
    </nav>

    <script>
        (function() {
            'use strict';

            // --- CONFIG ---
            const ROUND_DURATION = 30; // Fixed 30 seconds
            let balance = 1000;
            let history = [];
            let rounds = 0, wins = 0, losses = 0, totalWon = 0;

            let gameState = 'WAITING';
            let currentMultiplier = 1.00;
            let crashMultiplier = 2.00;
            let betPlaced = false;
            let betAmount = 0;
            let hasCashedOut = false;
            let isAutoMode = false;

            let timerInterval = null;
            let roundActive = false;
            let bettingOpen = true;
            let currentRoundId = 22880684;
            let lastBeepSecond = -1;

            let allBetsData = [];
            let myBetsData = [];
            let topBetsData = [];

            // DOM refs
            const balanceEl = document.getElementById('balanceDisplay');
            const timerEl = document.getElementById('timerDisplay');
            const roundIdEl = document.getElementById('roundIdDisplay');
            const statusLabel = document.getElementById('statusLabel');
            const stakeInput = document.getElementById('stakeInput');
            const actionBtn = document.getElementById('actionBtn');
            const btnText = document.getElementById('btnText');
            const autoBtn = document.getElementById('autoBtn');
            const betMsg = document.getElementById('betMsg');
            const betClosedMsg = document.getElementById('betClosedMsg');
            const chartMult = document.getElementById('chartMult');
            const historyStrip = document.getElementById('historyStrip');
            const betsTableBody = document.getElementById('betsTableBody');
            const totalBetsCount = document.getElementById('totalBetsCount');
            const pingDisplay = document.getElementById('pingDisplay');
            const resultPopup = document.getElementById('resultPopup');
            const popupIcon = document.getElementById('popupIcon');
            const popupTitle = document.getElementById('popupTitle');
            const popupDetails = document.getElementById('popupDetails');
            const canvas = document.getElementById('chartCanvas');
            const ctx = canvas.getContext('2d');

            const BALANCE_KEY = 'aviator_balance';
            const HISTORY_KEY = 'aviator_history';

            // --- ROUND ID GENERATION ---
            function generateRoundId() {
                return Math.floor(Math.random() * 90000000) + 10000000;
            }

            function updateRoundId() {
                currentRoundId = generateRoundId();
                roundIdEl.textContent = currentRoundId;
            }

            // --- TIMER ---
            function getNextRoundStart() {
                const now = Date.now();
                const remainder = Math.floor(now/1000) % ROUND_DURATION;
                return now + (ROUND_DURATION - remainder) * 1000;
            }

            function formatTime(secs) {
                const m = Math.floor(secs/60);
                const s = secs%60;
                return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
            }

            function updateTimerDisplay() {
                const now = Date.now();
                const nextStart = getNextRoundStart();
                const remaining = Math.max(0, (nextStart - now) / 1000);
                const secs = Math.ceil(remaining);
                timerEl.textContent = formatTime(secs);

                if (secs <= 5 && bettingOpen && gameState === 'WAITING') {
                    setBettingState(false);
                    if (secs === 5) {
                        betClosedMsg.classList.add('active');
                        showMsg('⛔ Betting Closed!', 'info');
                    }
                } else if (secs > 5 && !bettingOpen && !roundActive && gameState === 'WAITING') {
                    setBettingState(true);
                    betClosedMsg.classList.remove('active');
                }

                if (secs <= 0 && !roundActive && gameState === 'WAITING') {
                    startRound();
                }
            }

            function startTimerLoop() {
                if (timerInterval) clearInterval(timerInterval);
                updateTimerDisplay();
                timerInterval = setInterval(updateTimerDisplay, 200);
            }

            function setBettingState(open) {
                bettingOpen = open;
                if (open && gameState === 'WAITING') {
                    statusLabel.textContent = '● Betting Open';
                    statusLabel.className = 'status';
                    betClosedMsg.classList.remove('active');
                } else {
                    statusLabel.textContent = '● Betting Closed';
                    statusLabel.className = 'status closed';
                    betClosedMsg.classList.add('active');
                }
            }

            // --- PING ---
            function updatePing() {
                const ping = Math.floor(Math.random() * 150) + 180;
                pingDisplay.textContent = ping;
            }

            // --- BALANCE ---
            function loadBalance() {
                try {
                    const val = localStorage.getItem(BALANCE_KEY);
                    if (val !== null) balance = parseFloat(val) || 1000;
                } catch(e) { balance = 1000; }
                updateBalanceUI();
            }
            function saveBalance() { localStorage.setItem(BALANCE_KEY, String(balance)); }

            function loadHistory() {
                try {
                    const raw = localStorage.getItem(HISTORY_KEY);
                    if (raw) {
                        const d = JSON.parse(raw);
                        history = d.history || [];
                        rounds = d.rounds || 0;
                        wins = d.wins || 0;
                        losses = d.losses || 0;
                        totalWon = d.totalWon || 0;
                        return;
                    }
                } catch(e) {}
                history = []; rounds = 0; wins = 0; losses = 0; totalWon = 0;
            }
            function saveHistory() {
                const data = { history, rounds, wins, losses, totalWon };
                localStorage.setItem(HISTORY_KEY, JSON.stringify(data));
            }

            function updateBalanceUI() {
                balanceEl.textContent = balance.toFixed(2);
            }

            // --- CANVAS ---
            let planeImg = null;

            function initPlane() {
                const svg = `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f5c518' d='M61.9,18.7l-21.7,3L24.6,6.3c-0.6-0.6-1.5-0.7-2.2-0.2L19,8.5c-0.4,0.3-0.6,0.9-0.5,1.4l5.3,16.5L9.6,30.2L4.1,25c-0.5-0.4-1.2-0.6-1.8-0.3l-1.9,0.9c-0.7,0.3-0.9,1.1-0.5,1.7l7.5,11.2l-0.2,0.2c-0.5,0.5-0.5,1.4,0,1.9l2.8,2.8c0.5,0.5,1.4,0.5,1.9,0l12-11.8l16.7,2.2c0.6,0.1,1.1-0.2,1.4-0.7l20-22C62.4,20,62.5,19.1,61.9,18.7z'/%3E%3C/svg%3E`;
                planeImg = new Image();
                planeImg.src = svg;
            }

            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 400;
                canvas.height = rect.height || 220;
            }

            function drawChart(progress, crashPt, isCrashed) {
                const w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);
                const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w);
                grad.addColorStop(0, '#1a202c');
                grad.addColorStop(1, '#0f172a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Y-axis labels (8.0x, 6.0x, 4.0x, 2.0x, 0.0x)
                ctx.fillStyle = '#64748b';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'right';
                const maxMult = 8.0;
                for (let i = 0; i <= 4; i++) {
                    const val = (i * 2).toFixed(1);
                    const y = h - 10 - (h - 20) * (i / 4);
                    ctx.fillText(val + 'x', 30, y + 3);
                    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(35, y);
                    ctx.lineTo(w - 10, y);
                    ctx.stroke();
                }

                // X-axis
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(35, h - 10);
                ctx.lineTo(w - 10, h - 10);
                ctx.stroke();

                if (progress > 0) {
                    const startX = 35, endX = w - 10;
                    const startY = h - 10, endY = 10;
                    const totalPoints = 100;
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    let lastX = startX, lastY = startY;
                    for (let i = 0; i <= totalPoints; i++) {
                        let t = (i / totalPoints) * progress;
                        let x = startX + (endX - startX) * t;
                        let y = startY - (startY - endY) * Math.pow(t, 1.6);
                        ctx.lineTo(x, y);
                        if (i === totalPoints) { lastX = x; lastY = y; }
                    }
                    ctx.lineTo(lastX, startY);
                    ctx.closePath();
                    const fillGrad = ctx.createLinearGradient(0, startY, 0, endY);
                    fillGrad.addColorStop(0, 'rgba(245,197,24,0)');
                    fillGrad.addColorStop(1, 'rgba(245,197,24,0.1)');
                    ctx.fillStyle = fillGrad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    for (let i = 0; i <= totalPoints; i++) {
                        let t = (i / totalPoints) * progress;
                        let x = startX + (endX - startX) * t;
                        let y = startY - (startY - endY) * Math.pow(t, 1.6);
                        ctx.lineTo(x, y);
                    }
                    ctx.strokeStyle = isCrashed ? '#ef4444' : '#f5c518';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    if (planeImg && !isCrashed && progress < 0.95 && progress > 0.05) {
                        const t = progress;
                        const x = startX + (endX - startX) * t;
                        const y = startY - (startY - endY) * Math.pow(t, 1.6);
                        const angle = Math.atan2(-(startY-endY)*1.6*Math.pow(t,0.6), (endX-startX));
                        ctx.save();
                        ctx.translate(x, y);
                        ctx.rotate(angle);
                        ctx.drawImage(planeImg, -16, -16, 32, 32);
                        ctx.restore();
                    }

                    if (isCrashed && crashPt > 0) {
                        ctx.fillStyle = '#ef4444';
                        ctx.font = 'bold 16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('💥 CRASHED! ' + crashPt.toFixed(2) + 'x', w/2, 30);
                    }
                }
            }

            // --- UI HELPERS ---
            function showMsg(text, type = 'info') {
                betMsg.textContent = text;
                betMsg.className = 'msg-box ' + type;
                betMsg.style.display = 'block';
                if (type !== 'info') setTimeout(() => { betMsg.style.display = 'none'; }, 3500);
            }

            function showResultPopup(won, payout, roundId, mult, netChange) {
                popupIcon.textContent = won ? '🎉' : '😞';
                popupTitle.textContent = won ? 'You Win!' : 'You Lose';
                popupTitle.className = 'result-title ' + (won ? 'win' : 'lose');
                let details = `<div><strong>Round ID:</strong> ${roundId}</div>`;
                details += `<div><strong>Multiplier:</strong> ${mult.toFixed(2)}x</div>`;
                if (won) {
                    details += `<div><strong>Payout:</strong> ₹${payout.toFixed(2)}</div>`;
                    details += `<div><strong>Net Profit:</strong> <span style="color:#10b981;">+₹${netChange.toFixed(2)}</span></div>`;
                } else {
                    details += `<div><strong>Net Loss:</strong> <span style="color:#ef4444;">-₹${Math.abs(netChange).toFixed(2)}</span></div>`;
                }
                popupDetails.innerHTML = details;
                resultPopup.classList.add('active');
                setTimeout(() => resultPopup.classList.remove('active'), 3000);
            }

            function addHistoryTag(mult) {
                const tag = document.createElement('span');
                tag.className = 'multiplier-tag ' + (mult < 2 ? 'low' : (mult < 5 ? 'mid' : 'high'));
                tag.textContent = mult.toFixed(2) + 'x';
                historyStrip.insertBefore(tag, historyStrip.firstChild);
                if (historyStrip.children.length > 20) historyStrip.lastChild.remove();
            }

            // --- GAME ROUND ---
            function startRound() {
                if (roundActive || gameState !== 'WAITING') return;
                roundActive = true;
                gameState = 'FLYING';
                setBettingState(false);

                updateRoundId();

                const rand = Math.random();
                if (rand < 0.1) crashMultiplier = 1.02 + Math.random() * 0.2;
                else if (rand < 0.5) crashMultiplier = 1.20 + Math.random() * 1.0;
                else if (rand < 0.8) crashMultiplier = 2.20 + Math.random() * 3.0;
                else crashMultiplier = 5.00 + Math.random() * 20.0;
                crashMultiplier = parseFloat(crashMultiplier.toFixed(2));

                let elapsed = 0;
                const startTime = performance.now();
                let mult = 1.00;

                if (betPlaced && !hasCashedOut) {
                    actionBtn.className = 'btn-bet cashout';
                    btnText.textContent = 'CASH OUT';
                } else if (!betPlaced) {
                    actionBtn.className = 'btn-bet waiting';
                    btnText.textContent = 'WAITING...';
                }

                function animateFlight() {
                    const now = performance.now();
                    elapsed = (now - startTime) / 1000;
                    mult = 1 + (0.08 * Math.pow(elapsed, 1.5));

                    if (mult >= crashMultiplier) {
                        mult = crashMultiplier;
                        gameState = 'CRASHED';
                        chartMult.textContent = crashMultiplier.toFixed(2) + 'x';
                        chartMult.className = 'chart-overlay-mult show crashed';
                        drawChart(1, crashMultiplier, true);
                        actionBtn.className = 'btn-bet crashed';
                        btnText.textContent = 'CRASHED';
                        processCrash(crashMultiplier);
                        return;
                    }

                    currentMultiplier = mult;
                    const progress = Math.min(1, elapsed / 4);
                    drawChart(progress, crashMultiplier, false);
                    chartMult.textContent = mult.toFixed(2) + 'x';
                    chartMult.className = 'chart-overlay-mult show';

                    if (betPlaced && !hasCashedOut) {
                        const win = (betAmount * mult * 0.985);
                        btnText.textContent = 'CASH OUT ₹' + win.toFixed(2);
                        actionBtn.className = 'btn-bet cashout';
                    }

                    requestAnimationFrame(animateFlight);
                }

                animateFlight();
            }

            function processCrash(crashPt) {
                let netChange = 0;
                if (betPlaced && !hasCashedOut) {
                    netChange = -betAmount;
                    totalWon += netChange;
                    losses++;
                    showMsg(`💥 Crashed at ${crashPt.toFixed(2)}x! Lost ₹${betAmount.toFixed(2)}`, 'lose');
                    showResultPopup(false, 0, currentRoundId, crashPt, netChange);
                    if (myBetsData.length > 0 && myBetsData[0].round === currentRoundId) {
                        myBetsData[0].mult = crashPt.toFixed(2);
                        myBetsData[0].win = '-';
                    }
                }

                rounds++;
                history.unshift({
                    round: currentRoundId,
                    multiplier: crashPt,
                    stake: betPlaced ? betAmount : 0,
                    cashedOut: hasCashedOut,
                    netChange: netChange,
                    timestamp: Date.now()
                });
                if (history.length > 50) history.pop();
                saveHistory();

                addHistoryTag(crashPt);
                renderAllBets();

                // Auto-bet: if auto mode is on, place bet automatically next round
                if (isAutoMode) {
                    setTimeout(() => {
                        if (gameState === 'WAITING' && bettingOpen && !betPlaced) {
                            const stake = parseFloat(stakeInput.value) || 10;
                            if (stake <= balance) {
                                balance -= stake;
                                betAmount = stake;
                                betPlaced = true;
                                hasCashedOut = false;
                                saveBalance();
                                updateBalanceUI();
                                showMsg(`🤖 Auto Bet placed! ₹${stake.toFixed(2)}`, 'win');
                                actionBtn.className = 'btn-bet waiting';
                                btnText.textContent = 'WAITING...';
                                myBetsData.unshift({ round: currentRoundId, bet: stake, mult: '-', win: '-' });
                            }
                        }
                    }, 500);
                }

                setTimeout(() => {
                    roundActive = false;
                    gameState = 'WAITING';
                    betPlaced = false;
                    hasCashedOut = false;
                    betAmount = 0;
                    setBettingState(true);
                    chartMult.className = 'chart-overlay-mult';
                    drawChart(0, 0, false);
                    actionBtn.className = 'btn-bet bet';
                    btnText.textContent = 'BET';
                    betClosedMsg.classList.remove('active');
                    betMsg.style.display = 'none';
                    renderAllBets();
                    renderMyBets();
                }, 3000);
            }

            // --- BET ACTION ---
            function handleAction() {
                if (gameState === 'WAITING' && bettingOpen) {
                    const stake = parseFloat(stakeInput.value);
                    if (isNaN(stake) || stake <= 0) { showMsg('Enter valid amount', 'info'); return; }
                    if (stake > balance) { showMsg('Insufficient balance!', 'lose'); return; }
                    balance -= stake;
                    betAmount = stake;
                    betPlaced = true;
                    hasCashedOut = false;
                    saveBalance();
                    updateBalanceUI();
                    showMsg(`✅ Bet placed! ₹${stake.toFixed(2)}`, 'win');
                    actionBtn.className = 'btn-bet waiting';
                    btnText.textContent = 'WAITING...';
                    myBetsData.unshift({ round: currentRoundId, bet: stake, mult: '-', win: '-' });
                } else if (gameState === 'FLYING' && betPlaced && !hasCashedOut) {
                    const winAmount = betAmount * currentMultiplier * 0.985;
                    balance += winAmount;
                    const net = winAmount - betAmount;
                    saveBalance();
                    updateBalanceUI();
                    hasCashedOut = true;
                    betPlaced = false;
                    wins++;
                    totalWon += net;
                    if (myBetsData.length > 0 && myBetsData[0].round === currentRoundId) {
                        myBetsData[0].mult = currentMultiplier.toFixed(2);
                        myBetsData[0].win = winAmount.toFixed(2);
                    }
                    showMsg(`🎉 Cashed out! ${currentMultiplier.toFixed(2)}x → ₹${winAmount.toFixed(2)}`, 'win');
                    showResultPopup(true, winAmount, currentRoundId, currentMultiplier, net);
                    actionBtn.className = 'btn-bet cashout';
                    btnText.textContent = 'CASHED OUT';
                    actionBtn.disabled = true;
                    addHistoryTag(currentMultiplier);
                    // Update total bets count
                    totalBetsCount.textContent = parseInt(totalBetsCount.textContent) + 1;
                }
            }

            // --- AUTO MODE ---
            function toggleAuto() {
                isAutoMode = !isAutoMode;
                autoBtn.classList.toggle('active');
                autoBtn.textContent = isAutoMode ? '⚡ Auto ON' : '⚡ Auto';
                if (isAutoMode) {
                    showMsg('🤖 Auto-bet mode ON', 'info');
                } else {
                    showMsg('🤖 Auto-bet mode OFF', 'info');
                }
            }

            // --- RENDER TABLES ---
            function renderAllBets() {
                if (allBetsData.length === 0) {
                    const users = ['w***8','t***5','g***2','o***0','b***6','z***1','y***2','q***6','r***3','a***8','v***9'];
                    for (let u of users) {
                        const cashout = Math.random() > 0.3 ? (1.05 + Math.random() * 3).toFixed(2) : null;
                        allBetsData.push({
                            user: u,
                            color: '#'+Math.floor(Math.random()*16777215).toString(16).slice(0,6),
                            bet: Math.floor(Math.random()*8000)+1000,
                            mult: cashout ? parseFloat(cashout) : null,
                            cashed: !!cashout
                        });
                    }
                }
                let html = '';
                let count = 0;
                for (let b of allBetsData) {
                    if (count++ > 10) break;
                    const multStr = b.cashed ? b.mult.toFixed(2)+'x' : '-';
                    html += `<tr class="${b.cashed ? 'tr-win' : ''}">
                        <td><div class="user-cell"><span class="avatar" style="background:${b.color}">U</span>${b.user}</div></td>
                        <td style="text-align:right">${b.bet.toFixed(2)}</td>
                        <td style="text-align:center"><span class="${b.cashed ? 'cashout-mult' : 'text-muted'}">${multStr}</span></td>
                    </tr>`;
                }
                betsTableBody.innerHTML = html || '<tr><td colspan="3" style="text-align:center;color:#64748b;padding:10px;font-size:11px;">No bets yet</td></tr>';
            }

            function renderMyBets() {
                let html = '';
                if (myBetsData.length === 0) {
                    html = '<tr><td colspan="3" style="text-align:center;color:#64748b;padding:10px;font-size:11px;">No bets placed.</td></tr>';
                } else {
                    for (let b of myBetsData.slice(0,15)) {
                        const isWin = b.win !== '-';
                        html += `<tr class="${isWin ? 'tr-win' : ''}">
                            <td><div class="user-cell"><span class="avatar" style="background:linear-gradient(135deg,#f5c518,#ef4444)">U</span>Me</div></td>
                            <td style="text-align:right">${b.bet.toFixed(2)}</td>
                            <td style="text-align:center"><span class="${isWin ? 'cashout-mult' : 'text-muted'}">${b.mult}</span></td>
                        </tr>`;
                    }
                }
                betsTableBody.innerHTML = html;
            }

            function renderTopBets() {
                if (topBetsData.length === 0) {
                    topBetsData = [
                        { user: '8***2', color: '#ff6b6b', bet: 10000, mult: 15.42 },
                        { user: '4***9', color: '#4ecdc4', bet: 5000, mult: 22.10 },
                        { user: '1***5', color: '#ffe66d', bet: 20000, mult: 8.50 },
                        { user: '7***1', color: '#a29bfe', bet: 1000, mult: 55.20 }
                    ];
                }
                let html = '';
                for (let b of topBetsData) {
                    html += `<tr class="tr-win">
                        <td><div class="user-cell"><span class="avatar" style="background:${b.color}">U</span>${b.user}</div></td>
                        <td style="text-align:right">${b.bet.toFixed(2)}</td>
                        <td style="text-align:center"><span class="cashout-mult">${b.mult.toFixed(2)}x</span></td>
                    </tr>`;
                }
                betsTableBody.innerHTML = html;
            }

            // --- TABS ---
            function setupTabs() {
                document.querySelectorAll('.table-tabs button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.table-tabs button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const tab = this.dataset.tab;
                        if (tab === 'all') renderAllBets();
                        else if (tab === 'my') renderMyBets();
                        else if (tab === 'top') renderTopBets();
                    });
                });
            }

            // --- CHIPS ---
            function setupChips() {
                const chips = [10, 50, 100, 500, 1000];
                // Not using chip buttons in this design, just input field
                // But we can add quick click on input value
                stakeInput.addEventListener('focus', function() {
                    this.select();
                });
            }

            // --- RULES ---
            document.getElementById('rulesTrigger')?.addEventListener('click', function() {
                alert('📜 Aviator Rules:\n\n- Place your bet before the round starts.\n- Watch the multiplier increase.\n- Click "Cash Out" before the plane crashes.\n- If you cash out, you win: Bet × Multiplier × 0.985.\n- If the plane crashes, you lose your bet.');
            });

            // --- INIT ---
            function init() {
                initPlane();
                loadBalance();
                loadHistory();
                updateRoundId();
                resizeCanvas();
                setupChips();
                setupTabs();
                renderAllBets();
                history.slice(0,10).forEach(item => addHistoryTag(item.multiplier));
                drawChart(0,0,false);
                startTimerLoop();
                updatePing();
                setInterval(updatePing, 5000);

                window.addEventListener('resize', () => {
                    resizeCanvas();
                    drawChart(0,0,false);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.handleAction = handleAction;
            window.toggleAuto = toggleAuto;

        })();
    </script>
</body>
</html>
