<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N+ PLAY — Aviator Demo</title>
<style>
:root{--bg:#08090b;--p:#15171a;--p2:#0d0f11;--line:#292d32;--text:#f4f5f7;--muted:#858b94;--red:#f21d4f;--green:#25d64f}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{max-width:1280px;margin:auto;min-height:100vh;background:#090a0c}.top{height:58px;padding:0 15px;display:flex;align-items:center;border-bottom:1px solid #202327;background:#151719;position:sticky;top:0;z-index:10}.logo{font-size:25px;font-weight:1000;font-style:italic;color:#ff214f}.credit{margin-left:auto;border:1px solid #29302b;background:#101512;border-radius:18px;padding:8px 13px;color:#9cffae;font-weight:900;font-size:13px}.menu{border:0;background:none;color:#888;font-size:21px;margin-left:10px}.notice{text-align:center;color:#777;font-size:10px;padding:7px;border-bottom:1px solid #202327}
.layout{display:grid;grid-template-columns:350px 1fr;gap:8px;padding:8px}.card{background:linear-gradient(#17191c,#111315);border:1px solid #25292e;border-radius:16px;overflow:hidden}
.tabs{height:45px;display:flex;background:#15171a}.tabs button{flex:1;border:0;background:none;color:#8c9299;font-size:12px;font-weight:850}.tabs button.active{color:#eee;background:#25282d;border-radius:18px;margin:6px}
.pool{padding:12px 14px;border-bottom:1px solid #24272b}.pooltop{display:flex;justify-content:space-between;align-items:end}.pool strong{font-size:22px}.pool span{font-size:10px;color:#777}.bar{height:5px;background:#292d31;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:#67c51e}.players{padding:6px 8px;max-height:680px;overflow:auto}.player{height:42px;margin:3px 0;border-radius:12px;background:#0e1012;display:grid;grid-template-columns:30px 1fr 65px 60px;align-items:center;padding:0 8px;gap:5px}.player.win{background:#17320d}.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#777 28%,#222 65%);font-size:9px}.pname,.stake,.payout{font-size:10px}.stake{text-align:right;color:#bbb}.payout{text-align:right;color:#39e96a;font-weight:900}
.graphTop{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #24272b}.history{display:flex;gap:12px;overflow:hidden;white-space:nowrap;font-size:11px}.history span{color:#008cff}.history .hot{color:#b86cff}
.graphWrap{height:510px;position:relative;overflow:hidden;background:
radial-gradient(ellipse at 73% 45%,rgba(77,18,89,.52) 0%,rgba(28,13,43,.42) 27%,rgba(8,9,12,.96) 70%),
linear-gradient(180deg,#08090c,#050506)}
.grid{position:absolute;inset:0;background:
linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
background-size:72px 58px;opacity:.72}
.rays{position:absolute;inset:0;background:
repeating-conic-gradient(from 250deg at 0 100%,rgba(255,255,255,.018) 0 6deg,transparent 6deg 13deg);
opacity:.9}
.graph{position:absolute;inset:0;z-index:2}
.mult{position:absolute;inset:0;display:grid;place-items:center;font-size:92px;font-weight:950;z-index:4;
color:#fff;text-shadow:0 0 10px rgba(255,255,255,.18),0 0 35px rgba(255,30,80,.12);
letter-spacing:-2px}
.mult.crash{color:#ff4969;text-shadow:0 0 18px rgba(255,40,80,.45)}
.mult.wait{font-size:25px;letter-spacing:0;color:#8a8f96;text-shadow:none}
.plane{position:absolute;width:110px;height:70px;z-index:5;left:4%;top:74%;
transform:translate(-8px,-25px) rotate(-2deg);filter:drop-shadow(0 0 7px rgba(255,25,70,.75)) drop-shadow(0 0 18px rgba(255,20,65,.35));
transition:transform .08s linear;pointer-events:none}
.plane img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
.plane:after{content:"";position:absolute;left:-20px;top:42px;width:42px;height:3px;border-radius:99px;background:linear-gradient(90deg,transparent,#ff174d);filter:blur(1px);opacity:.8}
.ground{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#6d1730,#ff174d,#6d1730);opacity:.65;z-index:3}
.betpanels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.betbox{background:#17191c;border:1px solid #25292e;border-radius:15px;padding:10px}.btabs{display:flex;background:#111316;border-radius:16px;padding:3px;margin-bottom:10px}.btabs button{flex:1;border:0;border-radius:13px;background:none;color:#777;padding:7px;font-size:11px}.btabs .active{background:#303338;color:#eee}.controls{display:grid;grid-template-columns:115px 1fr;gap:8px}.amount{display:grid;grid-template-columns:30px 1fr 30px;background:#0e1012;border:1px solid #292d31;border-radius:10px;overflow:hidden}.amount button{border:0;background:none;color:#aaa;font-size:19px}.amount input{width:100%;border:0;background:none;color:#fff;text-align:center;font-weight:900;outline:0}.presets{display:flex;gap:4px;margin-top:6px}.presets button{flex:1;border:1px solid #292d31;background:#111315;color:#aaa;border-radius:7px;font-size:9px;padding:5px}.betbtn{height:66px;border:0;border-radius:11px;background:linear-gradient(#21d713,#16b509);color:#fff;font-weight:950;font-size:18px}.betbtn.cash{background:linear-gradient(#ff2c57,#d80e3a)}.small{text-align:center;font-size:9px;color:#777;margin-top:5px}.bottom{margin-top:8px}.ptabs{display:flex;border-bottom:1px solid #25292e}.ptabs button{flex:1;padding:11px;border:0;background:none;color:#777;font-size:10px;font-weight:900}.ptabs .active{color:#fff;border-bottom:2px solid var(--red)}.table{max-height:230px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:8px;border-bottom:1px solid #222;text-align:left}th{color:#70757c;font-size:9px}.green{color:#4ae86e}.red{color:#ff5c70}.purple{color:#b86cff}
@media(max-width:850px){.layout{grid-template-columns:1fr}.left{order:2}.right{order:1}.graphWrap{height:420px}.mult{font-size:70px}}@media(max-width:520px){.layout{padding:5px}.betpanels{grid-template-columns:1fr}.graphWrap{height:350px}.mult{font-size:55px}}
</style>
</head>

<script>
(()=>{const K='nplus_aviator_demo_v1',q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
let db;try{db=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(!db)db={balance:1000,rounds:[],bets:[]};
let phase='WAIT',left=6,crash=1,started=0,bets=[null,null],mode='history',raf=0;
const save=()=>{db.rounds=db.rounds.slice(0,100);db.bets=db.bets.slice(0,100);localStorage.setItem(K,JSON.stringify(db))};
const balance=()=>q('#balance').textContent=money(db.balance);
function newRound(){phase='WAIT';left=6;crash=makeCrash();bets=[null,null];q('#mult').className='mult wait';q('#mult').textContent='NEXT ROUND 6.0s';qa('.betbtn').forEach((b,i)=>{b.disabled=false;b.classList.remove('cash');b.innerHTML='Bet<br><span>'+money(Number(qa('.betbox')[i].querySelector('input').value)||10)+'</span>'});qa('[id^=state]').forEach(x=>x.textContent='Ready for next round');q('#plane').style.left='4%';q('#plane').style.top='74%';q('#plane').style.transform='translate(-8px,-25px) rotate(-2deg)';draw(0);render()}
function makeCrash(){let r=Math.random();if(r<.08)return 1+Math.random()*.18;if(r<.55)return 1.15+Math.random()*1.85;if(r<.88)return 3+Math.random()*5;if(r<.98)return 8+Math.random()*12;return 20+Math.random()*80}
const fx=x=>Number(x).toFixed(2)+'x';
function start(){phase='FLY';started=performance.now();q('#mult').className='mult';raf=requestAnimationFrame(frame)}
function current(){     const t=(performance.now()-started)/1000;      // Smooth, normal demo multiplier progression     // 1x -> 2x -> 3x -> 4x -> 5x gradually     return 1 + (0.18*t) + (0.035*t*t); }
function frame(){
    if(phase!=='FLY') return;

    const x=current();

    // Smooth flight movement
    const p=Math.min(
        0.93,
        Math.log(x)/Math.log(Math.max(crash,1.01))
    );

    q('#mult').textContent=fx(x);

    q('#plane').style.left=(4+p*84)+'%';
    q('#plane').style.top=(74-p*60)+'%';

    q('#plane').style.transform=
        'translate(-8px,-25px) rotate('+(-2-p*10)+'deg)';

    draw(p);

    qa('.betbtn').forEach((b,i)=>{
        const z=bets[i];

        if(z && !z.cashed){
            b.classList.add('cash');

            b.innerHTML=
                'Cash Out<br><span>'+
                money(z.amount*x)+
                '</span>';
        }
    });

    if(x>=crash){
        return end();
    }

    raf=requestAnimationFrame(frame);
}
function draw(p){let c=q('#graph'),w=q('#wrap').clientWidth,h=q('#wrap').clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);if(!p)return;x.strokeStyle='#ff174d';x.lineWidth=3;x.shadowColor='#ff174d';x.shadowBlur=10;x.beginPath();for(let i=0;i<=80*p;i++){let a=i/80,X=12+a*w*.84,Y=h-12-Math.pow(a,1.55)*h*.70;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();x.shadowBlur=0}
function end(){phase='CRASH';cancelAnimationFrame(raf);q('#mult').className='mult crash';q('#mult').textContent=fx(crash)+' CRASHED';bets.forEach((b,i)=>{if(!b)return;if(!b.cashed){b.status='LOSS';b.result=crash;db.bets.unshift({...b,round:Date.now()});q('#state'+i).textContent='Lost · crash at '+fx(crash)} });db.rounds.unshift({id:Date.now(),result:crash,at:Date.now()});save();render();setTimeout(newRound,2800)}
function place(i){if(phase!=='WAIT'||bets[i])return;let n=Math.max(1,Number(qa('.betbox')[i].querySelector('input').value)||0);if(n>db.balance){alert('Insufficient demo balance.');return}db.balance-=n;bets[i]={amount:n,cashed:false,status:'ACTIVE'};q('#state'+i).textContent='Bet placed · waiting for flight';balance();render()}
function cash(i){let b=bets[i];if(phase!=='FLY'||!b||b.cashed)return;let x=current(),p=b.amount*x;b.cashed=true;b.status='WIN';b.result=x;b.payout=p;db.balance+=p;db.bets.unshift({...b,round:Date.now()});q('#state'+i).textContent='Cashed out · '+fx(x)+' · '+money(p);qa('.betbtn')[i].disabled=true;qa('.betbtn')[i].classList.remove('cash');qa('.betbtn')[i].innerHTML='Cashed Out<br><span>'+money(p)+'</span>';save();balance();render()}
qa('.betbox').forEach((box,i)=>{let input=box.querySelector('input'),btn=box.querySelector('.betbtn'),refresh=()=>{if(phase!=='FLY'||!bets[i])btn.innerHTML='Bet<br><span>'+money(Number(input.value)||0)+'</span>'};box.querySelector('.minus').onclick=()=>{input.value=Math.max(1,(Number(input.value)||1)-1);refresh()};box.querySelector('.plus').onclick=()=>{input.value=Number(input.value||0)+1;refresh()};box.querySelectorAll('.presets button').forEach(p=>p.onclick=()=>{input.value=p.textContent;refresh()});btn.onclick=()=>phase==='FLY'&&bets[i]?cash(i):place(i)});
function render(){balance();q('#history').innerHTML=db.rounds.slice(0,24).map(r=>'<span class="'+(r.result>=10?'hot':'')+'">'+fx(r.result)+'</span>').join('');let arr=['N***7','N***4','N***1','N***b','N***1','N***e','N***1','N***7','N***5','N***3','N***6','N***d'];q('#players').innerHTML=arr.map((n,i)=>'<div class="player '+(i%4===1?'win':'')+'"><div class="avatar">'+(i+1)+'</div><div class="pname">'+n+'</div><div class="stake">'+money(6000+(i%3)*1000)+'</div><div class="payout">'+(i%4===1?'3.37x':'')+'</div></div>').join('');q('#pool').textContent=money(550000+Math.random()*50000);q('#count').textContent='829/1722 Bets';renderTable()}
function renderTable(){if(mode==='history')q('#table').innerHTML='<table><thead><tr><th>ROUND</th><th>CRASH</th><th>TIME</th></tr></thead><tbody>'+db.rounds.slice(0,100).map(r=>'<tr><td>'+r.id+'</td><td class="'+(r.result>=10?'purple':r.result<2?'red':'green')+'">'+fx(r.result)+'</td><td>'+new Date(r.at).toLocaleTimeString()+'</td></tr>').join('')+'</tbody></table>';else q('#table').innerHTML='<table><thead><tr><th>STAKE</th><th>RESULT</th><th>PAYOUT</th></tr></thead><tbody>'+db.bets.slice(0,100).map(b=>'<tr><td>'+money(b.amount)+'</td><td class="'+(b.status==='WIN'?'green':'red')+'">'+b.status+' '+fx(b.result)+'</td><td>'+(b.payout?money(b.payout):'—')+'</td></tr>').join('')+'</tbody></table>'}
qa('[data-tab]').forEach(b=>b.onclick=()=>{qa('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.tab;renderTable()});
setInterval(()=>{if(phase==='WAIT'){left-=.1;q('#mult').textContent='NEXT ROUND '+Math.max(0,left).toFixed(1)+'s';if(left<=0)start()}},100);newRound();
})();
</script></body></html>
