<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Clone - Provably Fair</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        /* --- CORE STYLING & RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #111111;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- LOADING SCREEN --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        
        .loading-logo-container {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .loading-logo-text {
            color: #e51c23;
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            margin-right: 10px;
            letter-spacing: -1px;
        }

        .loading-plane {
            width: 40px;
            height: 40px;
            fill: #e51c23;
        }

        .progress-bar {
            width: 80%;
            max-width: 300px;
            height: 6px;
            background-color: #222222;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #e51c23;
            border-radius: 4px;
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loading-text {
            color: #888888;
            font-size: 12px;
            text-align: center;
            max-width: 80%;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            color: #e51c23;
            font-weight: 900;
            font-size: 20px;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance {
            color: #28a745;
            font-weight: 800;
            font-size: 16px;
        }

        .hamburger {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* --- HISTORY BAR --- */
        .history-bar {
            background-color: #111111;
            padding: 8px 10px;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
        }
        .history-bar::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .history-item {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 8px;
            color: #ffffff;
            background-color: rgba(33, 150, 243, 0.15);
            color: #2196f3;
        }
        .history-item.purple {
            background-color: rgba(194, 24, 91, 0.15);
            color: #c2185b;
        }

        /* --- GAME CANVAS --- */
        .game-arena {
            height: 280px;
            width: 100%;
            background: radial-gradient(circle at center, #1b263b 0%, #000000 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            position: relative;
            border-bottom: 2px solid #222222;
            border-top: 2px solid #222222;
            overflow: hidden;
        }

        #game-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        .multiplier-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 82px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
            z-index: 2;
            text-align: center;
        }

        .waiting-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .waiting-display svg {
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            fill: #e51c23;
            margin-bottom: 10px;
        }

        .waiting-display span {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .flew-away-text {
            font-size: 22px;
            color: #e51c23;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: -15px;
        }

        .flew-away-mult {
            color: #e51c23;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        /* --- BETTING CONTROLS --- */
        .controls-container {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bet-panel {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a2a;
        }

        .panel-header {
            display: flex;
            justify-content: center;
            background-color: #000000;
            border-radius: 20px;
            width: 140px;
            margin: 0 auto 10px auto;
            overflow: hidden;
        }

        .panel-tab {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 12px;
            font-weight: 600;
            color: #888888;
            cursor: pointer;
        }

        .panel-tab.active {
            background-color: #333333;
            color: #ffffff;
            border-radius: 20px;
        }

        .panel-body {
            display: flex;
            gap: 10px;
        }

        .panel-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            background-color: #000000;
            border-radius: 8px;
            align-items: center;
            justify-content: space-between;
            padding: 4px;
            border: 1px solid #333;
        }

        .adjust-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #333333;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .adjust-btn:active { background-color: #555; }

        .bet-input {
            width: 60px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            outline: none;
        }

        .quick-chips {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .chip-btn {
            background-color: #000000;
            border: 1px solid #333;
            color: #aaa;
            border-radius: 6px;
            padding: 6px 0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .chip-btn:active { background-color: #333; color: #fff;}

        .panel-right {
            width: 140px;
            display: flex;
        }

        .main-action-btn {
            width: 100%;
            border-radius: 12px;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .main-action-btn:active { transform: scale(0.97); }

        .btn-green { background-color: #28a745; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .btn-red { background-color: #dc3545; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .btn-orange { background-color: #ffc107; color: #000; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }

        .btn-title { font-size: 22px; font-weight: 900; letter-spacing: 0.5px; line-height: 1.1; }
        .btn-subtitle { font-size: 13px; font-weight: 600; }

        /* --- LIVE BETS SECTION --- */
        .live-bets {
            flex: 1;
            background-color: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            padding-bottom: 20px;
        }

        .bets-tabs {
            display: flex;
            background-color: #111111;
            padding: 10px 15px 0 15px;
        }

        .bets-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .bets-tab.active {
            color: #fff;
            border-bottom: 2px solid #e51c23;
        }

        .bets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .bets-table th {
            text-align: left;
            padding: 8px 15px;
            font-size: 11px;
            color: #888;
            font-weight: 400;
        }
        
        .bets-table td {
            padding: 8px 15px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid #222;
        }

        .tr-success {
            background-color: rgba(40, 167, 69, 0.1);
        }

        .text-green { color: #28a745; }
        .text-blue { color: #2196f3; }

        /* --- TOAST ALERT --- */
        #toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #28a745;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loading-logo-container">
            <div class="loading-logo-text">Aviator</div>
            <svg class="loading-plane" viewBox="0 0 64 64">
                <path d="M61.9,18.7l-21.7,3L24.6,6.3c-0.6-0.6-1.5-0.7-2.2-0.2L19,8.5c-0.4,0.3-0.6,0.9-0.5,1.4l5.3,16.5L9.6,30.2L4.1,25c-0.5-0.4-1.2-0.6-1.8-0.3l-1.9,0.9c-0.7,0.3-0.9,1.1-0.5,1.7l7.5,11.2l-0.2,0.2c-0.5,0.5-0.5,1.4,0,1.9l2.8,2.8c0.5,0.5,1.4,0.5,1.9,0l12-11.8l16.7,2.2c0.6,0.1,1.1-0.2,1.4-0.7l20-22C62.4,20,62.5,19.1,61.9,18.7z"/>
            </svg>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="loading-fill"></div>
        </div>
        <div class="loading-text">Aviator is a 100% provably fair game. All results are verifiable.</div>
    </div>

    <div class="app-container">
        
        <!-- CUSTOM TOAST -->
        <div id="toast">You cashed out!</div>

        <!-- HEADER -->
        <header>
            <div class="logo">Aviator</div>
            <div class="header-right">
                <div class="balance"><span id="balance-amount">0.49</span> INR</div>
                <div class="hamburger">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </header>

        <!-- HISTORY BAR -->
        <div class="history-bar">
            <div class="history-item">1.25x</div>
            <div class="history-item purple">2.78x</div>
            <div class="history-item">1.59x</div>
            <div class="history-item purple">5.12x</div>
            <div class="history-item">1.02x</div>
            <div class="history-item purple">3.44x</div>
            <div class="history-item">1.89x</div>
        </div>

        <!-- GAME ARENA -->
        <div class="game-arena" id="arena">
            <canvas id="game-canvas"></canvas>
            
            <div id="waiting-display" class="waiting-display hidden">
                <svg viewBox="0 0 24 24"><path d="M12 2v4c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 21.52 2 16h4c0 3.31 2.69 6 6 6s6-2.69 6-6-2.69-6-6-6V2l5 4-5 4z"/></svg>
                <span>WAITING FOR NEXT ROUND</span>
            </div>

            <div id="multiplier-display" class="multiplier-display">1.00x</div>
        </div>

        <!-- BETTING CONTROLS -->
        <div class="controls-container">
            
            <!-- PANEL 1 -->
            <div class="bet-panel">
                <div class="panel-header">
                    <div class="panel-tab active">Bet</div>
                    <div class="panel-tab">Auto</div>
                </div>
                <div class="panel-body">
                    <div class="panel-left">
                        <div class="input-row">
                            <button class="adjust-btn" onclick="adjustBet(1, -10)">-</button>
                            <input type="text" class="bet-input" id="bet-input-1" value="10.00" readonly>
                            <button class="adjust-btn" onclick="adjustBet(1, 10)">+</button>
                        </div>
                        <div class="quick-chips">
                            <button class="chip-btn" onclick="setBet(1, 10)">10</button>
                            <button class="chip-btn" onclick="setBet(1, 100)">100</button>
                            <button class="chip-btn" onclick="setBet(1, 500)">500</button>
                            <button class="chip-btn" onclick="setBet(1, 1000)">1000</button>
                        </div>
                    </div>
                    <div class="panel-right">
                        <button id="btn-1" class="main-action-btn btn-green" onclick="handleButton(1)">
                            <span id="btn-title-1" class="btn-title">BET</span>
                            <span id="btn-sub-1" class="btn-subtitle">10.00 INR</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- PANEL 2 -->
            <div class="bet-panel">
                <div class="panel-header">
                    <div class="panel-tab active">Bet</div>
                    <div class="panel-tab">Auto</div>
                </div>
                <div class="panel-body">
                    <div class="panel-left">
                        <div class="input-row">
                            <button class="adjust-btn" onclick="adjustBet(2, -10)">-</button>
                            <input type="text" class="bet-input" id="bet-input-2" value="10.00" readonly>
                            <button class="adjust-btn" onclick="adjustBet(2, 10)">+</button>
                        </div>
                        <div class="quick-chips">
                            <button class="chip-btn" onclick="setBet(2, 10)">10</button>
                            <button class="chip-btn" onclick="setBet(2, 100)">100</button>
                            <button class="chip-btn" onclick="setBet(2, 500)">500</button>
                            <button class="chip-btn" onclick="setBet(2, 1000)">1000</button>
                        </div>
                    </div>
                    <div class="panel-right">
                        <button id="btn-2" class="main-action-btn btn-green" onclick="handleButton(2)">
                            <span id="btn-title-2" class="btn-title">BET</span>
                            <span id="btn-sub-2" class="btn-subtitle">10.00 INR</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- LIVE BETS -->
        <div class="live-bets">
            <div class="bets-tabs">
                <div class="bets-tab active">All Bets</div>
                <div class="bets-tab">My Bets</div>
                <div class="bets-tab">Top</div>
            </div>
            <table class="bets-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Bet INR</th>
                        <th>X</th>
                        <th>Cash out INR</th>
                    </tr>
                </thead>
                <tbody id="bets-body">
                    <!-- Dummy data generated in JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        /* --- LOADING SCREEN LOGIC --- */
        window.addEventListener('load', () => {
            const fill = document.getElementById('loading-fill');
            const screen = document.getElementById('loading-screen');
            setTimeout(() => { fill.style.width = '95%'; }, 100);
            setTimeout(() => {
                screen.style.opacity = '0';
                setTimeout(() => {
                    screen.remove();
                    initGame();
                }, 500);
            }, 2500);
        });

        /* --- GAME ENGINE VARIABLES --- */
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const arena = document.getElementById('arena');
        const multDisplay = document.getElementById('multiplier-display');
        const waitingDisplay = document.getElementById('waiting-display');
        const balanceEl = document.getElementById('balance-amount');
        const toast = document.getElementById('toast');
        
        let width, height;
        let gameState = 'WAITING'; // WAITING, FLYING, CRASHED
        let currentMultiplier = 1.00;
        let crashMultiplier = 0;
        let startTime = 0;
        let crashTime = 0;
        let animationId;

        // User State
        let balance = 0.49;
        
        // Panel States
        // Status: IDLE, WAITING (bet placed for next round), FLYING (bet active), CASHED
        const panels = {
            1: { amount: 10.00, status: 'IDLE', win: 0 },
            2: { amount: 10.00, status: 'IDLE', win: 0 }
        };

        // Pre-load plane SVG
        const planeSVG = `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e51c23' d='M61.9,18.7l-21.7,3L24.6,6.3c-0.6-0.6-1.5-0.7-2.2-0.2L19,8.5c-0.4,0.3-0.6,0.9-0.5,1.4l5.3,16.5L9.6,30.2L4.1,25c-0.5-0.4-1.2-0.6-1.8-0.3l-1.9,0.9c-0.7,0.3-0.9,1.1-0.5,1.7l7.5,11.2l-0.2,0.2c-0.5,0.5-0.5,1.4,0,1.9l2.8,2.8c0.5,0.5,1.4,0.5,1.9,0l12-11.8l16.7,2.2c0.6,0.1,1.1-0.2,1.4-0.7l20-22C62.4,20,62.5,19.1,61.9,18.7z'/%3E%3C/svg%3E`;
        const planeImg = new Image();
        planeImg.src = planeSVG;

        function resizeCanvas() {
            width = arena.clientWidth;
            height = arena.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);

        /* --- GAME LOOP LOGIC --- */
        function initGame() {
            resizeCanvas();
            generateLiveBets(1.00, false);
            startWaiting();
        }

        function startWaiting() {
            gameState = 'WAITING';
            multDisplay.classList.add('hidden');
            waitingDisplay.classList.remove('hidden');
            
            // Resolve Panel states
            [1, 2].forEach(id => {
                if (panels[id].status === 'WAITING') {
                    panels[id].status = 'FLYING';
                } else if (panels[id].status === 'CASHED') {
                    panels[id].status = 'IDLE';
                }
                updatePanelUI(id);
            });

            generateLiveBets(1.00, false);
            drawCanvas(); // Clear canvas

            setTimeout(() => {
                startFlying();
            }, 5000);
        }

        function startFlying() {
            gameState = 'FLYING';
            waitingDisplay.classList.add('hidden');
            multDisplay.classList.remove('hidden');
            multDisplay.classList.remove('flew-away-mult');
            multDisplay.innerHTML = `1.00x`;

            // Random crash between 1.20 and 5.00
            crashMultiplier = (Math.random() * (5.00 - 1.20) + 1.20).toFixed(2);
            startTime = Date.now();
            
            loop();
        }

        function triggerCrash() {
            gameState = 'CRASHED';
            crashTime = Date.now();
            
            multDisplay.innerHTML = `<div class="flew-away-text">Flew Away!</div><div class="flew-away-mult">${currentMultiplier.toFixed(2)}x</div>`;
            
            // Failed bets
            [1, 2].forEach(id => {
                if (panels[id].status === 'FLYING') {
                    panels[id].status = 'IDLE';
                    updatePanelUI(id);
                }
            });

            generateLiveBets(currentMultiplier, true); // Show final crashed table

            setTimeout(() => {
                startWaiting();
            }, 3000);
        }

        function loop() {
            if (gameState !== 'FLYING' && gameState !== 'CRASHED') return;

            if (gameState === 'FLYING') {
                let elapsed = (Date.now() - startTime) / 1000;
                currentMultiplier = 1 + (0.06 * Math.pow(elapsed, 1.5));
                
                if (currentMultiplier >= crashMultiplier) {
                    currentMultiplier = parseFloat(crashMultiplier);
                    triggerCrash();
                } else {
                    multDisplay.innerHTML = `${currentMultiplier.toFixed(2)}x`;
                    
                    // Update active cashout buttons
                    [1, 2].forEach(id => {
                        if (panels[id].status === 'FLYING') {
                            let win = panels[id].amount * currentMultiplier;
                            document.getElementById(`btn-sub-${id}`).innerText = win.toFixed(2) + ' INR';
                        }
                    });

                    // Randomly update live bets
                    if(Math.random() < 0.1) generateLiveBets(currentMultiplier, false);
                }
            }

            drawCanvas();
            requestAnimationFrame(loop);
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            if (gameState === 'WAITING') return;

            // Calculate Plane coordinates
            let startX = 0, startY = height;
            let targetX = width * 0.8;
            let targetY = height * 0.2;
            
            let progress = 0;
            if (gameState === 'FLYING') {
                let elapsed = (Date.now() - startTime) / 1000;
                progress = 1 - Math.exp(-elapsed * 0.4); // Smooth easing curve
            } else if (gameState === 'CRASHED') {
                progress = 1;
                // Fly off screen quickly
                let crashElapsed = (Date.now() - crashTime) / 1000;
                targetX += crashElapsed * 1000;
                targetY -= crashElapsed * 1000;
            }

            let currX = startX + (targetX - startX) * progress;
            let currY = startY - (startY - targetY) * progress;

            // Draw Trail Gradient
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (currX - startX) * 0.5, startY, currX, currY);
            ctx.lineTo(currX, startY);
            ctx.closePath();
            
            let grad = ctx.createLinearGradient(0, startY, 0, currY);
            grad.addColorStop(0, 'rgba(229, 28, 35, 0)');
            grad.addColorStop(1, 'rgba(229, 28, 35, 0.5)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Draw Trail Line
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (currX - startX) * 0.5, startY, currX, currY);
            ctx.strokeStyle = '#e51c23';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Draw Plane
            let planeSize = 64;
            ctx.save();
            ctx.translate(currX, currY);
            if (gameState === 'CRASHED') ctx.rotate(-Math.PI / 4); // Tilt up sharply
            ctx.drawImage(planeImg, -planeSize/2, -planeSize/2, planeSize, planeSize);
            ctx.restore();
        }

        /* --- UI INTERACTIONS --- */
        function adjustBet(id, delta) {
            if (panels[id].status !== 'IDLE') return;
            let val = panels[id].amount + delta;
            if (val < 10) val = 10;
            panels[id].amount = val;
            updatePanelUI(id);
        }

        function setBet(id, val) {
            if (panels[id].status !== 'IDLE') return;
            panels[id].amount = val;
            updatePanelUI(id);
        }

        function handleButton(id) {
            let p = panels[id];
            
            if (p.status === 'IDLE') {
                if (balance < p.amount) {
                    showToast('Insufficient Balance');
                    return;
                }
                balance -= p.amount;
                updateBalance();
                p.status = gameState === 'WAITING' ? 'FLYING' : 'WAITING';
            } 
            else if (p.status === 'WAITING') {
                balance += p.amount;
                updateBalance();
                p.status = 'IDLE';
            }
            else if (p.status === 'FLYING' && gameState === 'FLYING') {
                let winAmt = p.amount * currentMultiplier;
                balance += winAmt;
                updateBalance();
                p.status = 'CASHED';
                showToast(`You cashed out at ${currentMultiplier.toFixed(2)}x<br>Win: ${winAmt.toFixed(2)} INR`);
            }
            
            updatePanelUI(id);
        }

        function updatePanelUI(id) {
            let p = panels[id];
            let btn = document.getElementById(`btn-${id}`);
            let title = document.getElementById(`btn-title-${id}`);
            let sub = document.getElementById(`btn-sub-${id}`);
            let input = document.getElementById(`bet-input-${id}`);
            
            input.value = p.amount.toFixed(2);
            
            btn.className = 'main-action-btn';

            if (p.status === 'IDLE') {
                btn.classList.add('btn-green');
                title.innerText = 'BET';
                sub.innerText = p.amount.toFixed(2) + ' INR';
            } 
            else if (p.status === 'WAITING') {
                btn.classList.add('btn-red');
                title.innerText = 'CANCEL';
                sub.innerText = 'Waiting for next round';
            }
            else if (p.status === 'FLYING') {
                btn.classList.add('btn-orange');
                title.innerText = 'CASH OUT';
                sub.innerText = (p.amount * currentMultiplier).toFixed(2) + ' INR';
            }
            else if (p.status === 'CASHED') {
                btn.style.backgroundColor = '#222';
                btn.style.color = '#888';
                title.innerText = 'CASHED OUT';
                sub.innerText = '';
            }
        }

        function updateBalance() {
            balanceEl.innerText = balance.toFixed(2);
        }

        function showToast(msg) {
            toast.innerHTML = msg;
            toast.style.opacity = '1';
            toast.style.pointerEvents = 'auto';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.pointerEvents = 'none';
            }, 3000);
        }

        /* --- DUMMY LIVE BETS --- */
        function generateLiveBets(currentMult, isCrashed) {
            let html = '';
            // Generate 5 dummy rows
            for(let i=1; i<=5; i++) {
                let user = `1***${Math.floor(Math.random()*9)}`;
                let bet = [10, 20, 50, 100, 500][Math.floor(Math.random()*5)];
                
                // Randomly decide if this dummy user cashed out
                let hasCashed = false;
                let cashMult = '-';
                let payout = '-';
                let trClass = '';

                // Simulation logic for realism
                let targetCashout = 1.1 + (i * 0.3); 
                if (currentMult >= targetCashout) {
                    hasCashed = true;
                    cashMult = `<span class="text-blue">${targetCashout.toFixed(2)}x</span>`;
                    payout = `<span class="text-green">${(bet * targetCashout).toFixed(2)}</span>`;
                    trClass = 'tr-success';
                }

                if (isCrashed && !hasCashed) {
                    // They lost
                    cashMult = '-';
                    payout = '-';
                }

                html += `<tr class="${trClass}">
                    <td><div style="display:flex; align-items:center; gap:6px;">
                        <div style="width:16px;height:16px;background:#333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;">U</div>
                        ${user}
                    </div></td>
                    <td>${bet.toFixed(2)}</td>
                    <td>${cashMult}</td>
                    <td>${payout}</td>
                </tr>`;
            }
            document.getElementById('bets-body').innerHTML = html;
        }

    </script>
