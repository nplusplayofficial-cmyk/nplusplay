<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=451,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>N+ PLAY — VORTEX</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#070a11;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  font-family:Arial,Helvetica,sans-serif;
}

.game{
  position:relative;
  width:451px;
  height:804px;
  flex:0 0 451px;

  background:
    radial-gradient(
      ellipse at 50% 38%,
      rgba(72,78,98,.22) 0%,
      rgba(28,32,43,.18) 34%,
      transparent 67%
    ),
    linear-gradient(
      180deg,
      #20232d 0%,
      #191c25 48%,
      #12151d 100%
    );

  overflow:hidden;
}

/* BACKGROUND RAYS */

.game::before{
  content:"";
  position:absolute;
  inset:-40%;

  background:
    repeating-conic-gradient(
      from 0deg at 50% 50%,
      rgba(38,47,67,.16) 0deg 11deg,
      transparent 11deg 22deg
    );

  opacity:.55;
  pointer-events:none;
}

/* HEADER */

.header{
  position:absolute;
  top:0;
  left:0;
  right:0;

  height:62px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 13px;

  z-index:10;
}

.balance{
  display:flex;
  align-items:center;
  gap:6px;

  color:#f0f1f4;
  font-size:14px;
  font-weight:700;
}

.wallet{
  width:19px;
  height:14px;

  border:2px solid #e4e6ea;
  border-radius:2px;

  position:relative;
}

.wallet::after{
  content:"";

  position:absolute;

  right:-2px;
  top:3px;

  width:5px;
  height:5px;

  border:2px solid #e4e6ea;
  border-left:0;

  border-radius:0 2px 2px 0;
}

.tools{
  display:flex;
  align-items:center;
  gap:17px;

  color:#f0f1f4;
}

.help{
  width:24px;
  height:24px;

  border:2px solid #f1f2f5;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:15px;
  font-weight:700;
}

.sound{
  font-size:23px;
  line-height:1;
}

.settings{
  width:24px;
  height:19px;

  position:relative;
}

.settings span{
  position:absolute;
  left:0;
  right:0;

  height:2px;
  background:#e8e9ed;
}

.settings span:nth-child(1){
  top:2px;
}

.settings span:nth-child(2){
  top:8px;
}

.settings span:nth-child(3){
  top:14px;
}

.settings span::after{
  content:"";

  position:absolute;

  width:5px;
  height:5px;

  border:1.5px solid #e8e9ed;
  background:#20232d;

  border-radius:50%;

  top:-2px;
}

.settings span:nth-child(1)::after{
  left:8px;
}

.settings span:nth-child(2)::after{
  left:15px;
}

.settings span:nth-child(3)::after{
  left:4px;
}

/* LOGO */

.logo{
  position:absolute;

  top:66px;
  left:0;
  right:0;

  height:100px;

  display:flex;
  justify-content:center;
  align-items:center;

  z-index:5;
}

.logo-main{
  position:relative;

  color:#f4f4f6;

  font-size:30px;
  font-weight:900;
  font-style:italic;

  letter-spacing:-2px;

  text-shadow:
    2px 3px 0 #050609,
    0 0 8px rgba(0,0,0,.8);
}

.logo-main::before{
  content:"";

  position:absolute;

  width:128px;
  height:38px;

  left:50%;
  top:-14px;

  transform:
    translateX(-50%)
    rotate(-9deg);

  border-top:7px solid #8c21ff;

  border-radius:50%;

  z-index:-1;
}

.logo-main::after{
  content:"";

  position:absolute;

  width:98px;
  height:27px;

  left:50%;
  top:4px;

  transform:
    translateX(-50%)
    rotate(-15deg);

  border-bottom:6px solid #6814d2;

  border-radius:50%;

  z-index:-1;
}

.logo-sub{
  display:block;

  text-align:center;

  margin-top:-4px;

  font-size:9px;
  font-weight:800;

  letter-spacing:1px;

  font-style:normal;

  color:#d9dbe1;

  text-shadow:none;
}

/* WHEEL */

.wheel-area{
  position:absolute;

  top:132px;
  left:0;
  right:0;

  height:430px;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  z-index:3;
}

.wheel{
  width:386px;
  height:386px;

  position:relative;

  border-radius:50%;

  border:5px solid #343946;

  background:
    radial-gradient(
      circle,
      #151923 0% 17%,
      #303542 17.5% 21%,
      #10131b 21.5% 31%,
      #303542 31.5% 32.5%,
      #11141c 33% 42%,
      #303542 42.5% 43.5%,
      #10131b 44% 52%,
      #303542 52.5% 53.5%,
      #10131b 54% 63%,
      #303542 63.5% 64.5%,
      #0c0f16 65% 100%
    );

  box-shadow:
    inset 0 0 22px #000,
    0 9px 25px rgba(0,0,0,.8);

  transition:
    transform 3.2s
    cubic-bezier(.12,.7,.12,1);
}

.wheel::before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:50%;

  background:
    repeating-conic-gradient(
      from 0deg,
      transparent 0deg 11deg,
      rgba(130,137,151,.23) 11deg 12deg
    );

  mask:
    radial-gradient(
      circle,
      transparent 0 30%,
      #000 30.5%
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 30%,
      #000 30.5%
    );
}

.ring{
  position:absolute;

  inset:35px;

  border:
    2px solid #363b48;

  border-radius:50%;
}

.ring.r2{
  inset:78px;
}

.ring.r3{
  inset:119px;
}

/* TOP POINTER */

.pointer{
  position:absolute;

  top:7px;
  left:50%;

  transform:translateX(-50%);

  font-size:29px;

  z-index:6;

  filter:
    drop-shadow(0 2px 3px #000);
}

/* SYMBOLS */

.symbol{
  position:absolute;

  left:50%;
  top:50%;

  transform-origin:0 0;

  color:#777e8e;

  font-size:17px;
  font-weight:800;

  white-space:nowrap;
}

.s1{
  transform:
    rotate(-90deg)
    translateY(-142px)
    rotate(90deg);
}

.s2{
  transform:
    rotate(-60deg)
    translateY(-142px)
    rotate(60deg);
}

.s3{
  transform:
    rotate(-30deg)
    translateY(-142px)
    rotate(30deg);
}

.s4{
  transform:
    rotate(0deg)
    translateY(-142px);
}

.s5{
  transform:
    rotate(30deg)
    translateY(-142px)
    rotate(-30deg);
}

.s6{
  transform:
    rotate(60deg)
    translateY(-142px)
    rotate(-60deg);
}

.s7{
  transform:
    rotate(90deg)
    translateY(-142px)
    rotate(-90deg);
}

.s8{
  transform:
    rotate(120deg)
    translateY(-142px)
    rotate(-120deg);
}

.s9{
  transform:
    rotate(150deg)
    translateY(-142px)
    rotate(-150deg);
}

.s10{
  transform:
    rotate(180deg)
    translateY(-142px)
    rotate(-180deg);
}

.s11{
  transform:
    rotate(210deg)
    translateY(-142px)
    rotate(-210deg);
}

.s12{
  transform:
    rotate(240deg)
    translateY(-142px)
    rotate(-240deg);
}

.s13{
  transform:
    rotate(270deg)
    translateY(-142px)
    rotate(-270deg);
}

.s14{
  transform:
    rotate(300deg)
    translateY(-142px)
    rotate(-300deg);
}

.s15{
  transform:
    rotate(330deg)
    translateY(-142px)
    rotate(-330deg);
}

/* EMOJIS */

.emoji{
  position:absolute;

  left:50%;
  top:50%;

  font-size:26px;

  filter:
    drop-shadow(0 2px 4px #000);
}

.e1{
  transform:
    translate(-50%,-50%)
    translateY(-169px);
}

.e2{
  transform:
    translate(-50%,-50%)
    translateY(-126px);
}

.e3{
  transform:
    translate(-50%,-50%)
    translateY(-83px);
}

.e4{
  transform:
    translate(-50%,-50%)
    translateY(83px);
}

/* CENTER */

.center{
  position:absolute;

  width:78px;
  height:78px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  border:3px solid #555b68;

  background:
    radial-gradient(
      circle at 35% 30%,
      #78808e 0%,
      #303643 45%,
      #12151d 75%
    );

  box-shadow:
    inset 0 0 15px #000,
    0 3px 10px #000;
}

.center::after{
  content:"◌";

  position:absolute;

  left:17px;
  top:8px;

  color:#b1b6c0;

  font-size:43px;

  transform:rotate(35deg);
}

/* CONTROLS */

.controls{
  position:absolute;

  left:0;
  right:0;

  bottom:34px;

  z-index:10;
}

.control-row{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:13px;
}

.circle{
  width:48px;
  height:48px;

  border-radius:50%;

  border:
    1px solid #353a47;

  background:
    linear-gradient(
      #292d38,
      #171a22
    );

  color:#eee;

  font-size:22px;

  box-shadow:
    0 5px 12px #000;

  cursor:pointer;
}

.circle:active{
  transform:scale(.95);
}

.bet{
  min-width:120px;

  text-align:center;
}

.bet-label{
  color:#a0a5b0;

  font-size:11px;
  font-weight:700;
}

.bet-value{
  margin-top:4px;

  color:#f0f1f4;

  font-size:14px;
  font-weight:800;
}

.quick{
  display:flex;
  justify-content:center;
  gap:6px;

  margin-top:8px;
}

.quick button{
  border:0;

  background:#2b303b;

  color:#ddd;

  border-radius:16px;

  padding:5px 9px;

  font-size:10px;
  font-weight:700;

  cursor:pointer;
}

/* MAIN BUTTONS */

.main-controls{
  margin-top:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:17px;
}

.side{
  width:67px;
  height:48px;

  border:0;

  border-radius:15px;

  background:#2a2e39;

  color:#777d89;

  font-size:12px;
  font-weight:800;

  cursor:pointer;
}

.spin{
  width:92px;
  height:92px;

  border-radius:50%;

  border:0;

  background:
    radial-gradient(
      circle,
      #fff 0% 18%,
      #eee 19% 29%,
      #fff 30% 38%,
      #7e17ff 40% 66%,
      #4c0ba0 67% 100%
    );

  box-shadow:
    0 0 0 7px rgba(126,23,255,.16),
    0 0 30px rgba(126,23,255,.95);

  color:#7014dd;

  font-size:38px;

  cursor:pointer;
}

.spin:active{
  transform:scale(.96);
}

.status{
  height:14px;

  margin-top:4px;

  text-align:center;

  color:#a8adb8;

  font-size:10px;
  font-weight:700;
}

/* FOOTER */

.footer{
  position:absolute;

  left:8px;
  right:8px;
  bottom:5px;

  display:flex;
  justify-content:space-between;

  color:#858b98;

  font-size:10px;

  z-index:10;
}

/* MOBILE */

@media(max-width:451px){

  body{
    justify-content:flex-start;
  }

  .game{
    transform-origin:
      top left;

    transform:
      scale(
        calc(100vw / 451)
      );
  }

}

@media(max-height:760px){

  .logo{
    top:50px;
  }

  .wheel-area{
    top:112px;
    transform:scale(.86);
    transform-origin:top center;
  }

  .controls{
    bottom:25px;
  }

  .footer{
    display:none;
  }
}
</style>
</head>

<body>

<div class="game">

  <!-- HEADER -->

  <header class="header">

    <div class="balance">
      <span class="wallet"></span>
      <span id="balance">0.16</span>
      <span>INR</span>
    </div>

    <div class="tools">
      <span class="help">?</span>
      <span class="sound">⌁</span>

      <span class="settings">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </div>

  </header>


  <!-- LOGO -->

  <div class="logo">

    <div class="logo-main">
      VORTEX

      <span class="logo-sub">
        OFFICIAL GAME
      </span>
    </div>

  </div>


  <!-- WHEEL -->

  <section class="wheel-area">

    <div
      class="wheel"
      id="wheel"
    >

      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>

      <div class="pointer">
        🔥
      </div>

      <div class="emoji e1">🔥</div>
      <div class="emoji e2">☘️</div>
      <div class="emoji e3">🌊</div>
      <div class="emoji e4">🌊</div>

      <span class="symbol s1">3.9×</span>
      <span class="symbol s2">2.5×</span>
      <span class="symbol s3">1.5×</span>
      <span class="symbol s4">7×</span>
      <span class="symbol s5">12.5×</span>
      <span class="symbol s6">28×</span>
      <span class="symbol s7">52×</span>
      <span class="symbol s8">85×</span>
      <span class="symbol s9">21.5×</span>
      <span class="symbol s10">10×</span>
      <span class="symbol s11">44×</span>
      <span class="symbol s12">200×</span>
      <span class="symbol s13">133×</span>
      <span class="symbol s14">20.5×</span>
      <span class="symbol s15">16×</span>

      <div class="center"></div>

    </div>

  </section>


  <!-- CONTROLS -->

  <section class="controls">

    <div class="control-row">

      <button
        class="circle"
        id="minus"
      >−</button>

      <div class="bet">

        <div class="bet-label">
          Bet Amount ⓘ
        </div>

        <div
          class="bet-value"
          id="bet"
        >
          5.00 INR
        </div>

      </div>

      <button
        class="circle"
        id="plus"
      >+</button>

      <button
        class="circle"
        id="max"
      >≋</button>

    </div>


    <div class="quick">

      <button data-value="1">1</button>
      <button data-value="5">5</button>
      <button data-value="10">10</button>
      <button data-value="25">25</button>
      <button data-value="50">50</button>

    </div>


    <div class="main-controls">

      <button
        class="side"
        id="cashout"
      >
        CASH<br>OUT
      </button>

      <button
        class="spin"
        id="spin"
      >
        ◉
      </button>

      <button
        class="side"
        id="reset"
      >
        ↻
      </button>

    </div>


    <div
      class="status"
      id="status"
    >
      READY • DEMO
    </div>

  </section>


  <!-- FOOTER -->

  <footer class="footer">

    <span>
      TopBet Games • Vortex
    </span>

    <span id="clock"></span>

  </footer>

</div>


<script>

let balance = 0.16;
let bet = 5;
let spinning = false;
let rotation = 0;

const multipliers = [
  1.5,
  2,
  2.5,
  2.8,
  3.9,
  4.4,
  7,
  10,
  12.5,
  16,
  21.5,
  28,
  44,
  52,
  85,
  133,
  200
];

const $ = id =>
  document.getElementById(id);


/* BALANCE */

function render(){

  $("balance").textContent =
    balance.toFixed(2);

  $("bet").textContent =
    bet.toFixed(2) + " INR";
}


/* BET MINUS */

$("minus").onclick = () => {

  if(spinning) return;

  bet = Math.max(
    1,
    bet - 1
  );

  render();
};


/* BET PLUS */

$("plus").onclick = () => {

  if(spinning) return;

  bet = Math.min(
    500,
    bet + 1
  );

  render();
};


/* MAX */

$("max").onclick = () => {

  if(spinning) return;

  bet = Math.min(
    500,
    Math.floor(balance)
  );

  render();
};


/* QUICK BET */

document
.querySelectorAll(".quick button")
.forEach(button => {

  button.onclick = () => {

    if(spinning) return;

    bet =
      Number(
        button.dataset.value
      );

    render();
  };

});


/* RESET */

$("reset").onclick = () => {

  if(spinning) return;

  bet = 5;

  render();

  $("status").textContent =
    "READY • DEMO";
};


/* SPIN */

$("spin").onclick = () => {

  if(spinning)
    return;

  if(balance < bet){

    $("status").textContent =
      "INSUFFICIENT BALANCE";

    return;
  }


  spinning = true;

  balance -= bet;

  render();


  $("status").textContent =
    "SPINNING • DEMO";


  const index =
    Math.floor(
      Math.random() *
      multipliers.length
    );

  const multiplier =
    multipliers[index];


  const extra =
    1440 +
    Math.random() * 720;


  rotation +=
    extra +
    index * 8;


  $("wheel").style.transform =
    `rotate(${rotation}deg)`;


  setTimeout(() => {

    const payout =
      bet * multiplier;

    balance += payout;

    render();


    $("status").textContent =
      `RESULT • ${multiplier}× • +${payout.toFixed(2)} INR`;


    spinning = false;

  },3200);

};


/* CASHOUT DEMO */

$("cashout").onclick = () => {

  if(spinning){

    $("status").textContent =
      "DEMO CASH OUT";

  }

};


/* CLOCK */

function updateClock(){

  const now =
    new Date();

  const date =
    now.toLocaleDateString(
      "en-GB",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );

  const time =
    now.toLocaleTimeString(
      "en-GB",
      {
        hour12:false
      }
    );

  $("clock").textContent =
    date + " • " + time;
}


setInterval(
  updateClock,
  1000
);

updateClock();
render();

</script>

</body>
</html>
