<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N+ PLAY — Vortex</title>
<style>
:root{--bg:#050505;--panel:#101010;--line:#2a2926;--gold:#d8b76a;--gold2:#f1d991;--text:#f4f1eb;--muted:#89867f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.app{width:min(100%,620px);min-height:100vh;background:radial-gradient(circle at 50% 35%,rgba(216,183,106,.08),transparent 34%),linear-gradient(180deg,#0b0b0b,#050505);display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#090909e8;backdrop-filter:blur(14px)}
.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#111;color:#eee;font-size:24px}
.brand{font-weight:950;letter-spacing:4px;color:var(--gold2)}
.badge{font-size:9px;letter-spacing:1.5px;color:#777}
.main{flex:1;display:grid;place-items:center;padding:28px 18px}
.card{width:min(100%,470px);padding:34px 24px 28px;border:1px solid #3a352d;border-radius:24px;background:linear-gradient(180deg,#181818,#0d0d0d);box-shadow:0 25px 80px #0009;text-align:center}
.mark{width:92px;height:92px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#1d1d1d,#0e0e0e);border:1px solid #38332b;box-shadow:0 0 35px #d8b76a14;color:var(--gold2);font-weight:950;font-size:22px;letter-spacing:2px}
.kicker{font-size:9px;color:#8b877f;letter-spacing:2.5px;margin-bottom:12px}
h1{margin:0;font-size:30px;font-weight:950}
.line{width:64px;height:2px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
p{margin:0 auto;max-width:360px;color:#9b9891;line-height:1.65;font-size:12px}
.coming{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:11px 16px;border:1px solid #5c5038;border-radius:12px;background:#1a1711;color:var(--gold2);font-size:10px;font-weight:950;letter-spacing:1.6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold2);box-shadow:0 0 12px #f1d991b3}
.home{width:100%;margin-top:18px;padding:13px 15px;border:1px solid #3d3a35;border-radius:12px;background:#141414;color:#ddd;font-weight:900;font-size:11px}
.footer{text-align:center;padding:0 14px 18px;color:#555;font-size:8px}
</style>
</head>
<body>
<main class="app">
<header class="top">
<button class="icon" onclick="history.back()">‹</button>
<div class="brand">N+ PLAY</div>
<div class="badge">DEMO PLATFORM</div>
</header>
<section class="main">
<div class="card">
<div class="mark">N+</div>
<div class="kicker">VORTEX</div>
<h1>Coming Soon</h1>
<div class="line"></div>
<p>Vortex experience is currently under development. We are preparing the next premium N+ PLAY version.</p>
<div class="coming"><span class="dot"></span>COMING SOON</div>
<button class="home" onclick="location.href='index.html'">BACK TO N+ PLAY</button>
</div>
</section>
<div class="footer">N+ PLAY · VIRTUAL-CREDIT DEMO EXPERIENCE · 18+</div>
</main>
</body>
</html>
