<script>
(() => {
  "use strict";

  const form = document.getElementById("adminForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const status = document.getElementById("status");

  function showStatus(message, type = "err") {
    status.textContent = message;
    status.className = "status show " + type;
  }

  async function getAdminRole(userId) {

    const client = window.NPlusAuth?.client;

    if (!client) {
      throw new Error("Authentication system unavailable.");
    }

    const { data, error } = await client
      .from("profiles")
      .select("role")
      .eq("id", userId)
      .maybeSingle();

    if (error) {
      console.error("Role check error:", error);
      throw new Error("Unable to verify admin access.");
    }

    return String(data?.role || "").toLowerCase();
  }

  form.addEventListener("submit", async (e) => {

    e.preventDefault();

    status.className = "status";
    status.textContent = "";

    loginBtn.disabled = true;

    try {

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        throw new Error("Enter admin email and password.");
      }

      const client = window.NPlusAuth?.client;

      if (!client) {
        throw new Error("Supabase authentication unavailable.");
      }

      // ADMIN LOGIN = EMAIL + PASSWORD ONLY
      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw new Error(error.message);
      }

      const user = data?.user;

      if (!user?.id) {
        throw new Error("Authentication failed.");
      }

      // Verify role from Supabase profile
      const role = await getAdminRole(user.id);

      if (role !== "admin") {

        await client.auth.signOut();

        throw new Error(
          "This account is not authorized for the Admin Panel."
        );
      }

      showStatus(
        "Admin authentication successful. Opening dashboard…",
        "ok"
      );

      setTimeout(() => {
        location.replace("admin.html");
      }, 500);

    } catch (err) {

      console.error("Admin login error:", err);

      showStatus(
        err?.message ||
        "Admin login failed. Please check your credentials."
      );

    } finally {

      loginBtn.disabled = false;

    }

  });

})();
</script>
