<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080909">
<title>N+ PLAY — Admin Login</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,#302b1d 0,#111310 35%,#070808 70%);
  color:#f4f1e9;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:420px;
}

.brand{
  text-align:center;
  margin-bottom:24px;
}

.mark{
  width:52px;
  height:52px;
  margin:0 auto 12px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#f4d996,#9c7132);
  color:#171209;
  font-size:18px;
  font-weight:950;
}

.brand h1{
  margin:0;
  font-size:25px;
  letter-spacing:.5px;
}

.brand p{
  margin:7px 0 0;
  color:#858a84;
  font-size:10px;
  letter-spacing:2px;
}

.card{
  background:#111311;
  border:1px solid rgba(216,182,109,.2);
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 70px #0008;
}

.kicker{
  color:#d8b66d;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  margin-bottom:7px;
}

h2{
  margin:0 0 20px;
  font-size:20px;
}

.field{
  margin-bottom:14px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#858a84;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:13px 14px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.09);
  background:#0b0c0b;
  color:#fff;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#d8b66d;
}

.action{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:5px;
  background:linear-gradient(135deg,#f1d38f,#b6873c);
  color:#151108;
  font-weight:950;
  cursor:pointer;
}

.action:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  font-size:12px;
  line-height:1.4;
}

.status.show{
  display:block;
}

.status.err{
  background:#321817;
  color:#ffaaa6;
  border:1px solid #69302d;
}

.status.ok{
  background:#14291f;
  color:#86dfb0;
  border:1px solid #28543d;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#858a84;
  font-size:11px;
  text-decoration:none;
}

.back:hover{
  color:#d8b66d;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#555a55;
  font-size:9px;
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">
    <div class="mark">N+</div>
    <h1>N+ PLAY</h1>
    <p>ADMIN CONTROL CENTER</p>
  </div>

  <section class="card">

    <div class="kicker">AUTHORIZED ACCESS</div>
    <h2>Admin Login</h2>

    <form id="adminForm">

      <div class="field">
        <label for="email">ADMIN EMAIL</label>
        <input
          id="email"
          type="email"
          required
          autocomplete="username"
          placeholder="admin@example.com">
      </div>

      <div class="field">
        <label for="password">PASSWORD</label>
        <input
          id="password"
          type="password"
          required
          minlength="6"
          autocomplete="current-password"
          placeholder="Admin password">
      </div>

      <button class="action" id="loginBtn" type="submit">
        ENTER ADMIN PANEL
      </button>

    </form>

    <div id="status" class="status"></div>

    <a class="back" href="auth.html">
      ← Back to N+ PLAY Login
    </a>

  </section>

  <div class="footer">
    N+ PLAY · Virtual-credit platform · Authorized personnel only
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="core/nplus-config.js"></script>
<script src="core/nplus-auth.js"></script>

<script>
(() => {
  "use strict";

  const form = document.getElementById("adminForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const status = document.getElementById("status");

  function showStatus(message, type = "err") {
    status.textContent = message;
    status.className = "status show " + type;
  }

  async function getAdminRole(userId) {

    const client = window.NPlusAuth?.client;

    if (!client) {
      throw new Error("Authentication system unavailable.");
    }

    const { data, error } = await client
      .from("profiles")
      .select("role")
      .eq("id", userId)
      .maybeSingle();

    if (error) {
      console.error(error);
      throw new Error("Unable to verify admin access.");
    }

    return String(data?.role || "").toLowerCase();
  }

  form.addEventListener("submit", async (e) => {

    e.preventDefault();

    status.className = "status";
    status.textContent = "";

    loginBtn.disabled = true;

    try {

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      await window.NPlusAuth.signIn({
        email,
        password
      });

      const user = await window.NPlusAuth.current();

      if (!user?.id) {
        throw new Error("Authentication failed.");
      }

      const role = await getAdminRole(user.id);

      if (role !== "admin") {

        await window.NPlusAuth.signOut();

        throw new Error(
          "This account is not authorized for the Admin Panel."
        );
      }

      showStatus(
        "Admin authentication successful. Opening dashboard…",
        "ok"
      );

      setTimeout(() => {
        location.replace("admin.html");
      }, 400);

    } catch (err) {

      console.error("Admin login error:", err);

      showStatus(
        err?.message ||
        "Admin login failed. Please check your credentials."
      );

    } finally {

      loginBtn.disabled = false;

    }

  });

})();
</script>

</body>
</html>
