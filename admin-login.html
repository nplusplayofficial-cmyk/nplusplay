<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.webmanifest">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>N+ PLAY — Admin Login</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#070707;
  --panel:#101010;
  --gold:#c9a55b;
  --gold2:#f1e5c3;
  --text:#f5f2e9;
  --muted:#8e8e8e;
  --red:#ff5260;
  --green:#23d39a;
  --line:rgba(201,165,91,.16);
}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at top right,rgba(201,165,91,.10),transparent 32%),
    radial-gradient(circle at bottom left,rgba(201,165,91,.05),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  padding:20px;
}
.box{
  width:min(430px,100%);
  background:rgba(16,16,16,.96);
  border:1px solid var(--line);
  border-radius:24px;
  padding:30px;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
}
.brand{
  text-align:center;
  margin-bottom:26px;
}
.mark{
  width:58px;height:58px;
  margin:0 auto 12px;
  display:grid;place-items:center;
  border-radius:16px;
  background:linear-gradient(145deg,#f1e5c3,#c9a55b);
  color:#080808;
  font-weight:1000;
  font-size:23px;
}
h1{margin:0;font-size:21px;letter-spacing:3px}
p{color:var(--muted);font-size:12px}
label{
  display:block;
  margin:15px 0 7px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:1.4px;
}
input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background:#151515;
  color:#fff;
  outline:none;
}
input:focus{border-color:rgba(201,165,91,.55)}
button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:linear-gradient(145deg,#f1e5c3,#c9a55b);
  color:#090909;
  font-weight:1000;
  cursor:pointer;
}
button:disabled{opacity:.55;cursor:not-allowed}
.back{
  display:block;
  margin-top:16px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  text-decoration:none;
}
.error{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,82,96,.25);
  background:rgba(255,82,96,.06);
  color:#ff9aa2;
  font-size:12px;
}
.error.show{display:block}
</style>
</head>
<body>
<main class="box">
  <div class="brand">
    <div class="mark">N+</div>
    <h1>N+ PLAY</h1>
    <p>ADMINISTRATOR LOGIN • VIRTUAL DEMO CONTROL</p>
  </div>

  <form id="adminLoginForm">
    <label for="email">ADMIN EMAIL</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">PASSWORD</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="loginBtn" type="submit">ADMIN LOGIN</button>
    <div id="error" class="error"></div>
  </form>

  <a class="back" href="auth.html">← Back to User Login</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="core/nplus-config.js"></script>
<script>
(() => {
  "use strict";

  const cfg = window.NPlusConfig;
  const form = document.getElementById("adminLoginForm");
  const btn = document.getElementById("loginBtn");
  const errorBox = document.getElementById("error");

  if (!cfg?.supabaseUrl || !cfg?.supabaseAnonKey) {
    errorBox.textContent = "N+ PLAY configuration not found.";
    errorBox.classList.add("show");
    return;
  }

  const supabase = window.supabase.createClient(
    cfg.supabaseUrl,
    cfg.supabaseAnonKey
  );

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add("show");
  }

  (async () => {
    const { data } = await supabase.auth.getSession();

    if (data.session?.user) {
      const { data: profile } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", data.session.user.id)
        .maybeSingle();

      if (profile?.role === "admin") {
        location.replace("admin.html");
      }
    }
  })();

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "CHECKING...";

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showError(error.message || "Admin login failed.");
      btn.disabled = false;
      btn.textContent = "ADMIN LOGIN";
      return;
    }

    const { data: profile, error: profileError } = await supabase
      .from("profiles")
      .select("role")
      .eq("id", data.user.id)
      .maybeSingle();

    if (profileError || profile?.role !== "admin") {
      await supabase.auth.signOut();
      showError("Admin access denied. This account is not authorized.");
      btn.disabled = false;
      btn.textContent = "ADMIN LOGIN";
      return;
    }

    location.replace("admin.html");
  });
})();
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("N+ PLAY PWA registration skipped",e)));</script>
</body>
</html>
